  form: "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>K-PaF · Desk Registration Form<\/title>\n<script>\n/* ═══════════════════════════════════════════════════════════════════\n   EDIT THIS — paste your Supabase publishable key into SUPABASE_ANON.\n   (The URL is already set for your project. Use the publishable key only.)\n   ═══════════════════════════════════════════════════════════════════ */\nconst SUPABASE_URL  = \"https://xspzasjievdxknjbwyzy.supabase.co\";\nconst SUPABASE_ANON = \"sb_publishable_ky-_jCG8aIKx2R3r3HZhag_nD8BzdAt\";\n<\/script>\n<script>(function(){try{var t=localStorage.getItem('kpaf_theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();<\/script>\n<script>(function(){try{var emb=(window.self!==window.top)||/[?&]embed=1/.test(location.search);if(emb)document.documentElement.setAttribute('data-embedded','1');}catch(e){document.documentElement.setAttribute('data-embedded','1');}})();<\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#001a3a; --bg2:#002651; --sf:#012a57;\n  --bd:rgba(0,147,213,.18); --bd2:rgba(0,147,213,.32);\n  --tx:#cfdcee; --hl:#eaf2fb; --mu:#90a4c0;\n  --gn:#3ecf8e; --gn2:#1a9960; --fld:rgba(0,0,0,.22);\n  --rd:#ef4444; --am:#f59e0b;\n  --sh-lg:0 24px 60px rgba(0,0,0,.55);\n}\n:root[data-theme=\"light\"]{\n  --bg:#eef2f7; --bg2:#e3e9f2; --sf:#ffffff;\n  --bd:#e2e8f0; --bd2:#cdd7e3;\n  --tx:#1f2d3d; --hl:#0a1d30; --mu:#56657a;\n  --gn:#2bb673; --gn2:#1a9960; --fld:#f3f6fa;\n  --rd:#dc2626; --am:#d97706;\n  --sh-lg:0 24px 60px rgba(15,36,56,.18);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%}\nbody{font-family:'Open Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}\n\n.bar{display:flex;flex-direction:column;gap:0;\n  background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}\n.bar-top{display:flex;align-items:center;justify-content:center;padding:11px 20px 10px;border-bottom:1px solid var(--bd)}\n.bar-bot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:8px 20px}\n[data-embedded] .bar{display:none !important}\n.brand{display:flex;align-items:center;gap:12px;flex:1;justify-content:center;min-width:0}\n.flagmark{flex:0 0 auto;width:52px;height:34px;border-radius:5px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.15)}\n.flagmark img{width:100%;height:100%;object-fit:cover;display:block}\n.brandttl{font-size:1.3rem;font-weight:800;color:var(--hl);letter-spacing:-.2px;line-height:1.15}\n.moh-brand{flex:0 0 auto;display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:6px 11px;box-shadow:0 4px 12px rgba(0,0,0,.3)}\n.moh-logo{height:42px;width:auto;display:block;object-fit:contain}\n.co-brand{flex:0 0 auto;display:inline-flex;align-items:center;text-decoration:none;opacity:.92;transition:opacity .2s}\n.co-brand:hover{opacity:1}\n.theme-tgl{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:transform .15s,border-color .15s}\n.theme-tgl:hover{transform:translateY(-1px);border-color:var(--gn)}\n.theme-tgl .moon{display:none}.theme-tgl .sun{display:inline}\n[data-theme=\"light\"] .theme-tgl .sun{display:none}[data-theme=\"light\"] .theme-tgl .moon{display:inline}\n.co-logo{height:60px;width:auto;display:block;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.35))}\n.rightgrp{display:flex;align-items:center;gap:16px;flex:0 0 auto}\n[data-theme=\"light\"] .moh-brand{box-shadow:0 2px 8px rgba(0,0,0,.10)}\n[data-theme=\"light\"] .co-logo{filter:none}\n[data-theme=\"light\"] .flagmark{box-shadow:0 2px 8px rgba(15,36,56,.14),0 0 0 1px rgba(15,36,56,.06)}\n@media(max-width:700px){.brandttl{font-size:.95rem}.co-logo{height:46px}.moh-logo{height:34px}.flagmark{width:44px;height:29px}}\n.mark{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;\n  background:var(--gn);color:#fff;font-size:1.15rem;box-shadow:0 2px 8px rgba(43,182,115,.35)}\n.brand .t{display:flex;flex-direction:column;line-height:1.18;min-width:0}\n.brand .t b{color:var(--hl);font-size:.98rem;font-weight:800;white-space:nowrap}\n.brand .t span{color:var(--mu);font-size:.72rem;white-space:nowrap}\n.nav{display:flex;align-items:center;gap:10px}\n.who{color:var(--mu);font-size:.82rem;font-weight:700}\n.b{font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;border-radius:9px;padding:8px 15px;\n  border:1px solid transparent;transition:.15s;white-space:nowrap}\n.b-pri{background:var(--gn);color:#fff}\n.b-pri:hover{background:var(--gn2)}\n.b-pri:disabled{opacity:.55;cursor:default}\n.b-out{background:transparent;color:var(--tx);border-color:var(--bd2)}\n.b-out:hover{background:rgba(127,127,127,.12)}\n\n.wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}\n.intro{background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--gn);\n  border-radius:14px;padding:22px 24px;margin-bottom:20px}\n.intro h1{margin:0 0 8px;color:var(--hl);font-size:1.4rem;font-weight:800}\n.intro p{margin:0;color:var(--mu);font-size:.9rem}\n\n.sec{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin-bottom:18px}\n.sec h2{margin:0 0 4px;color:var(--gn);font-size:1.05rem;font-weight:800}\n.sec .desc{margin:0 0 16px;color:var(--mu);font-size:.82rem;line-height:1.5}\n\n.q{margin-bottom:18px}\n.q:last-child{margin-bottom:0}\n.q label.qlabel{display:block;color:var(--hl);font-size:.9rem;font-weight:700;margin-bottom:7px}\n.q .req{color:var(--rd);margin-left:3px}\n.q .hint{display:block;color:var(--mu);font-size:.76rem;font-weight:400;margin-top:3px;line-height:1.45}\ninput[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{\n  width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;\n  background:var(--fld);color:var(--tx);border:1px solid var(--bd2);border-radius:9px;outline:none}\ninput[type=date]{color-scheme:dark}\n:root[data-theme=\"light\"] input[type=date]{color-scheme:light}\ninput[type=date]::-webkit-calendar-picker-indicator{\n  cursor:pointer;\n  filter:brightness(0) invert(1);\n  opacity:1;\n  width:18px;\n  height:18px;\n  padding:6px;\n}\n:root[data-theme=\"light\"] input[type=date]::-webkit-calendar-picker-indicator{\n  filter:brightness(0) saturate(100%) invert(13%) sepia(20%) saturate(1289%) hue-rotate(173deg) brightness(94%) contrast(93%);\n}\ninput:focus,select:focus,textarea:focus{border-color:var(--gn)}\ntextarea{resize:vertical;min-height:90px}\nselect{cursor:pointer}\n/* Menu xổ xuống do HỆ ĐIỀU HÀNH vẽ — đặt màu tương phản mạnh, cố định,\n   để luôn đọc được dù trình duyệt/Windows ở chế độ sáng hay tối. */\nselect option{background:#ffffff;color:#11243a;padding:6px}\nselect optgroup{background:#eef2f7;color:#0f6e56;font-weight:700}\nselect option:checked,select option:hover{background:#2bb673;color:#ffffff}\n.note-box{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;\n  padding:9px 12px;font-size:.78rem;color:var(--am);margin-top:7px}\n.other-field{margin-top:8px}\n.ref-img{display:block;width:100%;height:auto;border:1px solid var(--bd2);border-radius:9px;margin:8px 0 10px;background:#fff}\n\n.submit-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}\n.bigbtn{font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;border:0;border-radius:11px;\n  padding:13px 28px;background:var(--gn);color:#fff;box-shadow:0 4px 14px rgba(43,182,115,.35);transition:.15s}\n.bigbtn:hover{background:var(--gn2)}\n.bigbtn:disabled{opacity:.55;cursor:default;box-shadow:none}\n.msg{font-size:.85rem;font-weight:700}\n.msg.ok{color:var(--gn)}\n.msg.bad{color:var(--rd)}\n\n.mask{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,15,30,.55);backdrop-filter:blur(4px)}\n.card{width:min(380px,92vw);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:26px 24px;box-shadow:var(--sh-lg)}\n.card h2{margin:0 0 4px;color:var(--hl);font-size:1.2rem;font-weight:800}\n.card .sub{margin:0 0 18px;color:var(--mu);font-size:.82rem}\n.card label{display:block;color:var(--hl);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}\n.card input{display:block;width:100%;margin-top:6px;padding:10px 12px;font-family:inherit;font-size:.92rem;background:var(--fld);color:var(--tx);border:1px solid var(--bd2);border-radius:9px;outline:none}\n.card input:focus{border-color:var(--gn)}\n.err{background:rgba(239,68,68,.12);color:var(--rd);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 10px;font-size:.8rem;margin-bottom:12px}\n.row{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}\n[hidden]{display:none!important}\n.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:60;\n  background:var(--gn);color:#fff;font-weight:700;font-size:.92rem;padding:13px 22px;border-radius:11px;\n  box-shadow:0 8px 26px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n\n@media(max-width:680px){\n  .bar{padding:8px 12px}\n  .brand .t span{display:none}\n  .wrap{padding:16px 12px 50px}\n  .sec,.intro{padding:18px 16px}\n}\n<\/style>\n<\/head>\n<body>\n<div id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<header class=\"bar\">\n  <div class=\"bar-top\">\n    <div class=\"brand\">\n      <div class=\"flagmark\" title=\"Republic of Kiribati\"><img src=\"https://flagcdn.com/w160/ki.png\" alt=\"Flag of Kiribati\"><\/div>\n      <h1 class=\"brandttl\">Kiribati Patient Feedback Dashboard<\/h1>\n    <\/div>\n  <\/div>\n  <div class=\"bar-bot\">\n    <span class=\"moh-brand\" title=\"Kiribati Ministry of Health &amp; Medical Services\">\n      <img src=\"Logo-MoH.png\" alt=\"Kiribati Ministry of Health &amp; Medical Services\" class=\"moh-logo\" onerror=\"this.onerror=null;var b=this.closest('.moh-brand');if(b)b.style.display='none'\">\n    <\/span>\n    <div class=\"nav\">\n      <button class=\"theme-tgl\" id=\"themeBtn\" onclick=\"toggleTheme()\" title=\"Switch light / dark theme\" aria-label=\"Switch light or dark theme\"><span class=\"sun\">☀️<\/span><span class=\"moon\">🌙<\/span><\/button>\n      <span id=\"whoLabel\" class=\"who\" hidden><\/span>\n      <button id=\"btnLogout\" class=\"b b-out\" onclick=\"logout()\" hidden>Log out<\/button>\n    <\/div>\n    <a href=\"https://www.who.int/westernpacific\" target=\"_blank\" rel=\"noopener\" class=\"co-brand\" title=\"World Health Organization · Western Pacific Region\">\n      <img src=\"who-wpro-logo-blue.png\" alt=\"WHO Western Pacific Region\" class=\"co-logo\">\n    <\/a>\n  <\/div>\n<\/header>\n\n<!-- Sign-in gate -->\n<div id=\"gate\" class=\"wrap\" style=\"text-align:center;padding-top:60px\">\n  <div style=\"font-size:2.6rem;margin-bottom:12px\">🔒<\/div>\n  <div style=\"color:var(--hl);font-size:1.2rem;font-weight:800;margin-bottom:8px\">Sign in to register feedback<\/div>\n  <div style=\"color:var(--mu);font-size:.9rem;max-width:380px;margin:0 auto 20px;line-height:1.55\">This form contains patient information. Only authorized K-PaF Office staff with an account may enter data.<\/div>\n  <button class=\"b b-pri\" onclick=\"openLogin()\">🔒 Sign in<\/button>\n<\/div>\n\n<!-- FORM (hidden until signed in) -->\n<div id=\"formWrap\" class=\"wrap\" hidden>\n  <div class=\"intro\">\n    <h1>K-PaF Desk Registration Form<\/h1>\n    <p>This form is used to document and file feedback received from health service users through the K-PaF Office. Each submission should correspond to a single complaint, concern, suggestion, or compliment case. Fields marked <span style=\"color:var(--rd)\">*<\/span> are required.<\/p>\n  <\/div>\n\n  <form id=\"kpafForm\" onsubmit=\"return submitForm(event)\">\n\n    <!-- ── SECTION 1 ── -->\n    <div class=\"sec\">\n      <h2>Section 1 — Intake Information<\/h2>\n      <p class=\"desc\">Details of how the feedback was received.<\/p>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">1. Receipt Date <span class=\"req\">*<\/span><\/label>\n        <input type=\"date\" name=\"receipt_date\" required>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">2. Intake Officer <span class=\"req\">*<\/span><\/label>\n        <select name=\"intake_officer\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Marea Itaia<\/option>\n          <option value=\"Other\">Other (please specify)<\/option>\n        <\/select>\n        <div class=\"other-field\" id=\"intakeOfficerOtherWrap\" hidden>\n          <input type=\"text\" id=\"intake_officer_other\" placeholder=\"Please specify\">\n        <\/div>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">3. Modality <span class=\"req\">*<\/span><\/label>\n        <select name=\"modality\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Walk in/in person<\/option>\n          <option>Email<\/option>\n          <option>Phone call<\/option>\n          <option>Officer outreach<\/option>\n          <option>Other<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <!-- ── SECTION 2 ── -->\n    <div class=\"sec\">\n      <h2>Section 2 — Concerned Person<\/h2>\n      <p class=\"desc\">Provide the information of the healthcare user (patient) to whom the feedback relates.<\/p>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">4. Patient ID <span class=\"req\">*<\/span><\/label>\n        <input type=\"text\" name=\"patient_id\" required>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">5. Patient's Sex <span class=\"req\">*<\/span><\/label>\n        <select name=\"patient_sex\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Male<\/option>\n          <option>Female<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">6. Patient's Age Category <span class=\"req\">*<\/span><\/label>\n        <select name=\"patient_age_cat\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Newborn (0- 29 days)<\/option>\n          <option>1 - 11 months<\/option>\n          <option>1 - 5 years old<\/option>\n          <option>5 - 12 years old<\/option>\n          <option>13 - 19 years old<\/option>\n          <option>20 - 29 years old<\/option>\n          <option>30 - 39 years old<\/option>\n          <option>40 - 49 years old<\/option>\n          <option>50 - 59 years old<\/option>\n          <option>60 - 69 years old<\/option>\n          <option>&gt; 70 years old<\/option>\n          <option>Unknown<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">7. Patient's Address <span class=\"req\">*<\/span><\/label>\n        <input type=\"text\" name=\"patient_address\" required>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">8. Phone<\/label>\n        <input type=\"tel\" name=\"phone\">\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">9. Email<\/label>\n        <input type=\"email\" name=\"email\">\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">10. Relationship to Patient <span class=\"req\">*<\/span><\/label>\n        <select name=\"relationship\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Patient<\/option>\n          <option>Family<\/option>\n          <option>Friend / Acquaintance<\/option>\n          <option>Care Taker<\/option>\n          <option>Visitor<\/option>\n          <option>Other<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <!-- ── SECTION 3 ── -->\n    <div class=\"sec\">\n      <h2>Section 3 — Concerned Facility<\/h2>\n      <p class=\"desc\">Select the facility associated with the feedback.<\/p>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">11. Concerned Facility <span class=\"req\">*<\/span><\/label>\n        <select name=\"facility\" required>\n          <option value=\"\">— Select —<\/option>\n          <optgroup label=\"TCH\">\n            <option>TCH: Outpatient Department<\/option>\n            <option>TCH: Operating Theatre<\/option>\n            <option>TCH: Emergency Department<\/option>\n            <option>TCH(OPD): Surgical Clinic<\/option>\n            <option>TCH(OPD): Gyne Medical Clinic<\/option>\n            <option>TCH(OPD): Diabetics Clinic<\/option>\n            <option>TCH(OPD): Medical Clinic<\/option>\n            <option>TCH(OPD): Pediatric Department<\/option>\n            <option>TCH(OPD): Psychiatric clinic<\/option>\n            <option>TCH(OPD): Antenatal Care and Health Programme<\/option>\n            <option>TCH(OPD): Family Clinic<\/option>\n            <option>TCH(IPD): Private Ward<\/option>\n            <option>TCH(IPD): Peadiatric Ward<\/option>\n            <option>TCH(IPD): Obstetrics &amp; Gynecology Ward<\/option>\n            <option>TCH(IPD): Surgical Ward<\/option>\n            <option>TCH(IPD): Medical Ward<\/option>\n            <option>TCH(IPD): Psychiatric Ward<\/option>\n            <option>TCH(IPD): TB Ward<\/option>\n            <option>TCH(IPD): Intensive Care Unit<\/option>\n            <option>TCH: Laboratory<\/option>\n          <\/optgroup>\n          <optgroup label=\"BH\">\n            <option>BH(OPD): Obesteric<\/option>\n            <option>BH(OPD): Pediatrics<\/option>\n            <option>BH(IPD): Obesteric Ward<\/option>\n            <option>BH(IPD): Pediatrics Ward<\/option>\n            <option>BH(IPD): Private<\/option>\n          <\/optgroup>\n          <optgroup label=\"Clinics\">\n            <option>AMBO Clinic<\/option>\n            <option>BAIRIKI Clinic<\/option>\n            <option>BANRAEABA Clinic<\/option>\n            <option>BIKENIBEU EAST Clinic<\/option>\n            <option>BIKENIBEU WEST Clinic<\/option>\n            <option>BONRIKI EAST Clinic<\/option>\n            <option>BONRIKI WEST Clinic<\/option>\n            <option>BUOTA Clinic<\/option>\n            <option>EITA Clinic<\/option>\n            <option>NANIKAI Clinic<\/option>\n            <option>TAKORONGA Clinic<\/option>\n            <option>TEAORAEREKE Clinic<\/option>\n            <option>TEMAIKU Clinic<\/option>\n            <option>TEMAKIN Clinic<\/option>\n            <option>TEMAUOKO Clinic<\/option>\n            <option>TETOAMATOA Clinic<\/option>\n            <option>URANO Clinic<\/option>\n            <option>Maungan DOTs Clinic<\/option>\n            <option>TEMAIKU Maneaba<\/option>\n          <\/optgroup>\n          <option value=\"Other\">Other (please specify)<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q other-field\" id=\"facilityOtherWrap\" hidden>\n        <label class=\"qlabel\">11-1. Concerned Facility — please specify <span class=\"req\">*<\/span><\/label>\n        <input type=\"text\" name=\"facility_other\" placeholder=\"Please specify\" disabled>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">12. Area of Facility<\/label>\n        <input type=\"text\" name=\"facility_area\">\n        <span class=\"hint\">Specify the facility area when available.<\/span>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">13. Inpatient / Outpatient <span class=\"req\">*<\/span><\/label>\n        <select name=\"in_outpatient\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Outpatient<\/option>\n          <option>Inpatient<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">14. Complaint or Compliment <span class=\"req\">*<\/span><\/label>\n        <select name=\"case_type\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Complaint<\/option>\n          <option>Compliment<\/option>\n          <option>Other<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <!-- ── SECTION 4 ── -->\n    <div class=\"sec js-complaint-section\">\n      <h2>Section 4 — Complaint Categories<\/h2>\n      <p class=\"desc\">Please record the feedback as described by the client. Where possible, describe events in chronological order and distinguish between the events themselves and the client's perceptions, feelings, assumptions, or beliefs. Do not include the opinions or interpretations of the person receiving the feedback.<\/p>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">15. Complaint Details <span class=\"req\">*<\/span><\/label>\n        <textarea name=\"complaint_details\" required><\/textarea>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">15-2. Complaint Summary — to be shared with MHMS <span class=\"req\">*<\/span><\/label>\n        <textarea name=\"complaint_summary\" required><\/textarea>\n        <div class=\"note-box\">⚠ Note: To ensure patient data security, data entry personnel must not include any personally identifiable information in the complaint summary.<\/div>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">16. Case Categories <span class=\"req\">*<\/span><\/label>\n        <img src=\"complaint-categories-reference.png\" alt=\"Complaint category reference table\" class=\"ref-img\" onerror=\"this.onerror=null;this.src='Presentation1.png';\">\n        <select name=\"case_category\" required>\n          <option value=\"\">— Select —<\/option>\n          <optgroup label=\"Clinical\">\n            <option>Clinical: Quality: Examinations<\/option>\n            <option>Clinical: Quality: Patient Journey(Clinical)<\/option>\n            <option>Clinical: Quality: Quality of care<\/option>\n            <option>Clinical: Quality: Treatment<\/option>\n            <option>Clinical: Safety: Errors in Triage<\/option>\n            <option>Clinical: Safety: Errors in diagnosis<\/option>\n            <option>Clinical: Safety: Medication errors<\/option>\n            <option>Clinical: Safety: Safety incidents<\/option>\n            <option>Clinical: Safety: Skills and conduct<\/option>\n            <option>Clinical: Saftey: Clinical documentation<\/option>\n          <\/optgroup>\n          <optgroup label=\"Management\">\n            <option>Management: Institutional Issues: Bureaucracy<\/option>\n            <option>Management: Institutional Issues: Environment<\/option>\n            <option>Management: Institutional Issues: Finance and billing<\/option>\n            <option>Management: Institutional Issues: Service issues<\/option>\n            <option>Management: Institutional Issues: Staffing and resources<\/option>\n            <option>Management: Institutional Issues: Patient Journey(Administrative)<\/option>\n            <option>Management: Timing and access: Access and admission<\/option>\n            <option>Management: Timing and access: Medicines and supplies<\/option>\n            <option>Management: Timing and access: Delays<\/option>\n            <option>Management: Timing and access: Discharge<\/option>\n            <option>Management: Timing and access: Referrals<\/option>\n          <\/optgroup>\n          <optgroup label=\"Relationships\">\n            <option>Relationships: Communication: Communication breakdown<\/option>\n            <option>Relationships: Communication: Incorrect information<\/option>\n            <option>Relationships: Communication: Patient-staff dialogue<\/option>\n            <option>Relationships: Humaneness/caring: Respect, dignity, and caring<\/option>\n            <option>Relationships: Humaneness/caring: Staff attitudes<\/option>\n            <option>Relationships: Humaneness/caring: Abuse<\/option>\n            <option>Relationships: Patient Rights: Confidentiality<\/option>\n            <option>Relationships: Patient Rights: Consent<\/option>\n            <option>Relationships: Patient Rights: Discrimination<\/option>\n          <\/optgroup>\n          <option value=\"Other\">Other (please specify)<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q other-field\" id=\"caseCategoryOtherWrap\" hidden>\n        <label class=\"qlabel\">16-1. Case Categories — please specify <span class=\"req\">*<\/span><\/label>\n        <input type=\"text\" name=\"case_category_other\" placeholder=\"Please specify\" disabled>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">17. Complaints Group <span class=\"req\">*<\/span><\/label>\n        <select name=\"complaints_group\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Medical<\/option>\n          <option>Nursing<\/option>\n          <option>Pharmacist<\/option>\n          <option>Laboratory<\/option>\n          <option>Admin<\/option>\n          <option>Ambulance Crew<\/option>\n          <option>Transportation Staff<\/option>\n          <option>Policy / Leadership<\/option>\n          <option>Security Guard<\/option>\n          <option>Facility and Maintenance<\/option>\n          <option>Kitchen and Catering<\/option>\n          <option>Coordination<\/option>\n          <option value=\"Other\">Other (please specify)<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q other-field\" id=\"complaintsGroupOtherWrap\" hidden>\n        <label class=\"qlabel\">17-1. Complaints Group — please specify <span class=\"req\">*<\/span><\/label>\n        <input type=\"text\" name=\"complaints_group_other\" placeholder=\"Please specify\" disabled>\n      <\/div>\n    <\/div>\n\n    <!-- ── SECTION 5 ── -->\n    <div class=\"sec js-complaint-section\">\n      <h2>Section 5 — Stage of Patient Journey<\/h2>\n      <p class=\"desc\">Please select the stage of the patient's healthcare journey to which the feedback relates. This helps identify where in the care process the experience, concern, or issue occurred.<\/p>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">18. Patient journey <span class=\"req\">*<\/span><\/label>\n        <select name=\"patient_journey\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Appointment<\/option>\n          <option>Transport (incl. ambulance)<\/option>\n          <option>Registration / Reception<\/option>\n          <option>Pre-Examination<\/option>\n          <option>Consultation/Examination / Initial Assessment<\/option>\n          <option>Laboratory<\/option>\n          <option>Pre-Admission<\/option>\n          <option>Admissions<\/option>\n          <option>Care on Ward<\/option>\n          <option>Procedures / Operations<\/option>\n          <option>Pharmacy<\/option>\n          <option>Discharge (OPD)<\/option>\n          <option>Discharge(IPD)<\/option>\n          <option>Patient Transit Facility (Maneaba)<\/option>\n          <option value=\"Other\">Other (please specify)<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q other-field\" id=\"patientJourneyOtherWrap\" hidden>\n        <label class=\"qlabel\">18-1. Patient journey — please specify <span class=\"req\">*<\/span><\/label>\n        <input type=\"text\" name=\"patient_journey_other\" placeholder=\"Please specify\" disabled>\n      <\/div>\n    <\/div>\n\n    <!-- ── SECTION 6 ── -->\n    <div class=\"sec js-complaint-section\">\n      <h2>Section 6 — Requested Follow-up<\/h2>\n      <p class=\"desc\">Please indicate what the client expects from K-PaF and/or MHMS in response to this feedback.<\/p>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">19. Requested Follow-up <span class=\"req\">*<\/span><\/label>\n        <select name=\"followup_requested\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Action + Report back<\/option>\n          <option>Action but no report back<\/option>\n          <option>Feedback only<\/option>\n          <option>Undetermined<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">20. Date Forwarded to PNO / Responsible Staff<\/label>\n        <input type=\"date\" name=\"date_forwarded_pno\">\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">20-1. Handed over to<\/label>\n        <input type=\"text\" name=\"handed_over_to\" placeholder=\"Name of PNO / responsible staff\">\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">21. Case Status <span class=\"req\">*<\/span><\/label>\n        <select name=\"case_status\" required>\n          <option value=\"\">— Select —<\/option>\n          <option>Case Closed<\/option>\n          <option>Pending at K-PaF<\/option>\n          <option>Pending at MHMS<\/option>\n          <option>Other<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"q\">\n        <label class=\"qlabel\">22. Date Closed <span id=\"dateClosedReq\" class=\"req\" hidden>*<\/span><\/label>\n        <input type=\"date\" name=\"date_closed\">\n      <\/div>\n    <\/div>\n\n    <!-- Submit -->\n    <div class=\"sec\">\n      <div class=\"submit-row\">\n        <button type=\"submit\" class=\"bigbtn\" id=\"btnSubmit\">Submit<\/button>\n        <span id=\"formMsg\" class=\"msg\"><\/span>\n      <\/div>\n    <\/div>\n\n  <\/form>\n<\/div>\n\n<!-- Login modal -->\n<div id=\"loginMask\" class=\"mask\" hidden>\n  <form class=\"card\" onsubmit=\"return doLogin(event)\">\n    <h2>Staff sign in<\/h2>\n    <p class=\"sub\">Sign in to open the registration form.<\/p>\n    <label>Email<input id=\"liUser\" autocomplete=\"username\" spellcheck=\"false\"><\/label>\n    <label>Password<input id=\"liPass\" type=\"password\" autocomplete=\"current-password\"><\/label>\n    <div id=\"liErr\" class=\"err\" hidden><\/div>\n    <div class=\"row\">\n      <button type=\"button\" class=\"b b-out\" onclick=\"closeLogin()\">Cancel<\/button>\n      <button type=\"submit\" class=\"b b-pri\">Sign in<\/button>\n    <\/div>\n  <\/form>\n<\/div>\n\n<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"><\/script>\n<script>\nconst sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);\nconst $ = id => document.getElementById(id);\nfunction toggleTheme(){\n  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';\n  const next=cur==='dark'?'light':'dark';\n  document.documentElement.setAttribute('data-theme',next);\n  try{localStorage.setItem('kpaf_theme',next);}catch(e){}\n}\naddEventListener('storage',function(e){\n  if(e.key==='kpaf_theme') document.documentElement.setAttribute('data-theme', e.newValue==='dark'?'dark':'light');\n});\nlet _toastTimer=null;\nfunction showToast(text){\n  const t=$('toast'); if(!t) return;\n  t.textContent=text; t.classList.add('show');\n  if(_toastTimer) clearTimeout(_toastTimer);\n  _toastTimer=setTimeout(()=>{ t.classList.remove('show'); }, 4000);\n}\nconst SK_AUTH = 'kpaf_v10_auth';\nconst SK_TOKEN = 'kpaf_v10_token';\nconst authed = () => !!sessionStorage.getItem(SK_AUTH);\n\nfunction openLogin(){ $('liErr').hidden=true; $('liUser').value=''; $('liPass').value=''; $('loginMask').hidden=false; setTimeout(()=>$('liUser').focus(),30); }\nfunction closeLogin(){ $('loginMask').hidden=true; }\n\nasync function doLogin(e){\n  e.preventDefault();\n  const email=($('liUser').value||'').trim(), pass=$('liPass').value||'';\n  const er=$('liErr'); er.hidden=true;\n  const btn=e.target.querySelector('button[type=\"submit\"]');\n  if(btn){btn.disabled=true;btn.textContent='Signing in…';}\n  try{\n    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});\n    if(error||!data||!data.session){ er.textContent='Incorrect email or password — please try again.'; er.hidden=false; $('liPass').value=''; }\n    else{ sessionStorage.setItem(SK_AUTH,data.user.email||email); sessionStorage.setItem(SK_TOKEN,data.session.access_token); closeLogin(); applyAuthUI(); }\n  }catch(err){ er.textContent='Could not reach the server — check your connection.'; er.hidden=false; }\n  finally{ if(btn){btn.disabled=false;btn.textContent='Sign in';} }\n  return false;\n}\n\nasync function logout(){\n  try{ await sb.auth.signOut(); }catch(e){}\n  sessionStorage.removeItem(SK_AUTH); sessionStorage.removeItem(SK_TOKEN);\n  applyAuthUI();\n}\n\nfunction applyAuthUI(){\n  const on=authed();\n  $('gate').hidden=on;\n  $('formWrap').hidden=!on;\n  $('whoLabel').hidden=!on;\n  $('btnLogout').hidden=!on;\n  if(on) $('whoLabel').textContent='👤 '+(sessionStorage.getItem(SK_AUTH)||'');\n}\n\naddEventListener('keydown', e=>{ if(e.key==='Escape') closeLogin(); });\n\n(async function boot(){\n  try{\n    const {data}=await sb.auth.getSession();\n    if(data&&data.session){ sessionStorage.setItem(SK_AUTH,data.session.user.email||''); sessionStorage.setItem(SK_TOKEN,data.session.access_token); }\n  }catch(e){}\n  applyAuthUI();\n})();\n\n/* ── Submit the form to Supabase ─────────────────────────────────────\n   Read every field → build an object → POST to the cases table.\n   Empty fields → null (date columns especially must be null, not \"\").\n   case_number is auto-generated so each case has a unique ID\n   (used by the Follow-up dashboard to locate it). */\nconst CASES_TABLE = 'cases';\nconst CASE_COLUMNS = new Set([\n  'case_number','ts_form','receipt_date','intake_officer','modality',\n  'patient_id','patient_sex','patient_age_cat','patient_address','phone','email',\n  'relationship','facility','facility_other','facility_area','in_outpatient',\n  'case_type','complaint_details','complaint_summary','case_category',\n  'case_category_other','complaints_group','complaints_group_other',\n  'patient_journey','patient_journey_other','followup_requested',\n  'date_forwarded_pno','handed_over_to','case_status','date_last_fu_pno',\n  'date_closed','duration_to_close','status_after_fu','followup_end_date',\n  'followup_notes'\n]);\nconst DATE_FIELDS = ['receipt_date','date_forwarded_pno','date_last_fu_pno','date_closed','followup_end_date'];\nconst OTHER_FIELDS = [\n  {select:'intake_officer', wrap:'intakeOfficerOtherWrap', input:'#intake_officer_other'},\n  {select:'facility', wrap:'facilityOtherWrap', input:'input[name=\"facility_other\"]'},\n  {select:'case_category', wrap:'caseCategoryOtherWrap', input:'input[name=\"case_category_other\"]'},\n  {select:'complaints_group', wrap:'complaintsGroupOtherWrap', input:'input[name=\"complaints_group_other\"]'},\n  {select:'patient_journey', wrap:'patientJourneyOtherWrap', input:'input[name=\"patient_journey_other\"]'}\n];\n\nfunction taoCaseNumber(){\n  const d=new Date();\n  const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');\n  const rand=Math.floor(1000+Math.random()*9000);\n  return 'KPAF-'+ymd+'-'+rand;\n}\n\nfunction setControlEnabled(el,on){\n  el.disabled=!on;\n  el.required=on && el.dataset.baseRequired==='1';\n}\n\nfunction updateOtherField(cfg){\n  const form=$('kpafForm');\n  const sel=form.querySelector('[name=\"'+cfg.select+'\"]');\n  const wrap=$(cfg.wrap);\n  const input=form.querySelector(cfg.input);\n  if(!sel||!wrap||!input) return;\n  const show=sel.value==='Other' && !sel.disabled;\n  wrap.hidden=!show;\n  input.disabled=!show;\n  input.required=show;\n  if(!show) input.value='';\n}\n\nfunction updateConditionalFields(scrollToSubmit){\n  const form=$('kpafForm');\n  const isCompliment=form.elements.case_type && form.elements.case_type.value==='Compliment';\n  const isOtherCaseCategory=form.elements.case_category && form.elements.case_category.value==='Other';\n  const dateClosed=form.elements.date_closed;\n  const dateClosedReq=$('dateClosedReq');\n  form.querySelectorAll('.js-complaint-section').forEach(sec=>{\n    sec.hidden=isCompliment;\n    sec.querySelectorAll('input,select,textarea').forEach(el=>setControlEnabled(el,!isCompliment));\n  });\n  if(dateClosed){\n    const needsDateClosed=!dateClosed.disabled && form.elements.case_status && form.elements.case_status.value==='Case Closed';\n    dateClosed.required=needsDateClosed;\n    dateClosed.dataset.baseRequired=needsDateClosed?'1':'0';\n    if(dateClosedReq) dateClosedReq.hidden=!needsDateClosed;\n  }\n  OTHER_FIELDS.forEach(updateOtherField);\n  if((isCompliment || isOtherCaseCategory) && scrollToSubmit){\n    $('btnSubmit').scrollIntoView({behavior:'smooth',block:'center'});\n  }\n}\n\nfunction initConditionalForm(){\n  const form=$('kpafForm');\n  form.querySelectorAll('input,select,textarea').forEach(el=>{\n    el.dataset.baseRequired=el.required?'1':'0';\n  });\n  OTHER_FIELDS.forEach(cfg=>{\n    const sel=form.querySelector('[name=\"'+cfg.select+'\"]');\n    if(sel) sel.addEventListener('change',()=>updateConditionalFields(cfg.select==='case_category'));\n  });\n  if(form.elements.case_type){\n    form.elements.case_type.addEventListener('change',()=>updateConditionalFields(true));\n  }\n  if(form.elements.case_status){\n    form.elements.case_status.addEventListener('change',()=>updateConditionalFields(false));\n  }\n  form.addEventListener('reset',()=>setTimeout(()=>updateConditionalFields(false),0));\n  updateConditionalFields(false);\n}\ninitConditionalForm();\n\nasync function submitForm(e){\n  e.preventDefault();\n  const form=$('kpafForm');\n  const btn=$('btnSubmit'), msg=$('formMsg');\n  msg.className='msg'; msg.textContent='';\n\n  const token=sessionStorage.getItem(SK_TOKEN);\n  if(!token){ msg.className='msg bad'; msg.textContent='Your session has expired — please sign in again.'; return false; }\n\n  // Collect form data\n  const fd=new FormData(form);\n  const row={};\n  for(const [k,v] of fd.entries()){\n    const val=(typeof v==='string')?v.trim():v;\n    if(val===''){ row[k]=null; }                  // empty → null\n    else if(DATE_FIELDS.includes(k)){ row[k]=val; } // date: keep YYYY-MM-DD\n    else{ row[k]=val; }\n  }\n  if(row.intake_officer==='Other'){\n    row.intake_officer=($('intake_officer_other').value||'').trim()||null;\n  }\n  row.case_number=taoCaseNumber();   // auto-generated case number\n  row.ts_form=new Date().toISOString(); // submission timestamp\n  const payload=Object.fromEntries(Object.entries(row).filter(([k])=>CASE_COLUMNS.has(k)));\n\n  btn.disabled=true; btn.textContent='Submitting…';\n  try{\n    const res=await fetch(SUPABASE_URL.replace(/\\/$/,'')+'/rest/v1/'+CASES_TABLE,{\n      method:'POST',\n      headers:{\n        'apikey':SUPABASE_ANON,\n        'Authorization':'Bearer '+token,\n        'Content-Type':'application/json',\n        'Prefer':'return=minimal'\n      },\n      body:JSON.stringify(payload)\n    });\n    if(res.ok){\n      msg.className='msg ok';\n      msg.textContent='✓ Saved (case '+row.case_number+'). Form cleared for the next case.';\n      form.reset();\n      showToast('✓ Case submitted — a new blank form is ready.');\n      window.scrollTo({top:0,behavior:'smooth'});\n      const first=form.querySelector('input,select,textarea');\n      if(first) setTimeout(()=>{ try{first.focus();}catch(e){} }, 400);\n    } else {\n      let detail='';\n      try{ const j=await res.json(); detail=j.message||j.hint||''; }catch(_){}\n      if(res.status===401||res.status===403){\n        msg.className='msg bad';\n        msg.textContent='Denied (HTTP '+res.status+'): your session has expired. Sign in again, then resubmit.';\n

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-PaF · Patient Safety</title>
<!-- Match the dashboards' theme (shared localStorage key 'kpaf_theme'; default light) -->
<script>(function(){try{var t=localStorage.getItem('kpaf_theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ── Tokens (mirror dashboard_v9 palette) ── */
:root{ /* DARK (default) */
  --bg:#001a3a; --bg2:#002651; --sf:#012a57;
  --bd:rgba(0,147,213,.18); --bd2:rgba(0,147,213,.32);
  --tx:#cfdcee; --hl:#eaf2fb; --mu:#90a4c0;
  --gn:#3ecf8e; --gn2:#1a9960; --fld:rgba(0,0,0,.22);
  --sh-lg:0 24px 60px rgba(0,0,0,.55);
}
:root[data-theme="light"]{ /* LIGHT (matches v9 default) */
  --bg:#eef2f7; --bg2:#e3e9f2; --sf:#ffffff;
  --bd:#e2e8f0; --bd2:#cdd7e3;
  --tx:#3a4a5e; --hl:#0f2438; --mu:#64748b;
  --gn:#2bb673; --gn2:#1a9960; --fld:#f3f6fa;
  --sh-lg:0 24px 60px rgba(15,36,56,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Open Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);
  display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Top bar ── */
.bar{flex:0 0 auto;display:flex;flex-direction:column;gap:0;background:var(--sf);border-bottom:1px solid var(--bd)}
.bar-top{display:flex;align-items:center;justify-content:center;padding:11px 24px 10px;border-bottom:1px solid var(--bd)}
.bar-bot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:9px 24px}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;min-width:0}
.flagmark{flex:0 0 auto;width:52px;height:34px;border-radius:5px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.15)}
.flagmark img{width:100%;height:100%;object-fit:cover;display:block}
.brandttl{font-size:1.3rem;font-weight:800;color:var(--hl);letter-spacing:-.2px;line-height:1.15;white-space:nowrap}
.moh-brand{flex:0 0 auto;display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:6px 11px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.moh-logo{height:42px;width:auto;display:block;object-fit:contain}
.co-brand{flex:0 0 auto;display:inline-flex;align-items:center;text-decoration:none;opacity:.92;transition:opacity .2s}
.co-brand:hover{opacity:1}
.co-logo{height:58px;width:auto;display:block;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.rightgrp{display:flex;align-items:center;gap:16px;flex:0 0 auto}
[data-theme="light"] .moh-brand{box-shadow:0 2px 8px rgba(0,0,0,.10)}
[data-theme="light"] .co-logo{filter:none}
[data-theme="light"] .flagmark{box-shadow:0 2px 8px rgba(15,36,56,.14),0 0 0 1px rgba(15,36,56,.06)}
.mark{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:var(--gn);color:#fff;font-size:1.15rem;line-height:1;box-shadow:0 2px 8px rgba(43,182,115,.35)}
.brand .t{display:flex;flex-direction:column;line-height:1.18;min-width:0}
.brand .t b{color:var(--hl);font-size:.98rem;font-weight:800;white-space:nowrap}
.brand .t span{color:var(--mu);font-size:.72rem;white-space:nowrap}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{color:var(--mu);font-size:.82rem;font-weight:700;white-space:nowrap}
.b{font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;border-radius:9px;padding:8px 15px;
  border:1px solid transparent;transition:.15s;white-space:nowrap}
.b-pri{background:var(--gn);color:#fff}
.b-pri:hover{background:var(--gn2)}
.b-out{background:transparent;color:var(--tx);border-color:var(--bd2)}
.b-out:hover{background:rgba(127,127,127,.12)}
.switch{display:inline-flex;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg-b{font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;border:0;background:transparent;
  color:var(--mu);padding:6px 14px;border-radius:7px;transition:.15s}
.seg-b:hover{color:var(--tx)}
.seg-b.on{background:var(--gn);color:#fff;box-shadow:0 2px 6px rgba(43,182,115,.3)}

/* ── Iframe stage ── */
.stage{flex:1 1 auto;position:relative;background:var(--bg)}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0}
[hidden]{display:none!important}

/* ── Login modal ── */
.mask{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(8,15,30,.55);backdrop-filter:blur(4px)}
.card{width:min(380px,92vw);background:var(--sf);border:1px solid var(--bd);border-radius:16px;
  padding:26px 24px;box-shadow:var(--sh-lg)}
.card h2{margin:0 0 4px;color:var(--hl);font-size:1.2rem;font-weight:800}
.card .sub{margin:0 0 18px;color:var(--mu);font-size:.82rem}
.card label{display:block;color:var(--hl);font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:14px}
.card input{display:block;width:100%;margin-top:6px;padding:10px 12px;font-family:inherit;font-size:.92rem;
  background:var(--fld);color:var(--tx);border:1px solid var(--bd2);border-radius:9px;outline:none}
.card input:focus{border-color:var(--gn)}
.err{background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.3);
  border-radius:8px;padding:8px 10px;font-size:.8rem;margin-bottom:12px}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.note{color:var(--mu);font-size:.7rem;margin-top:16px;text-align:center;line-height:1.5}

/* ── Responsive: phones & small screens ── */
@media(max-width:680px){
  .bar{padding:8px 12px;gap:8px}
  .brand .t span{display:none}             /* hide the long ministry subtitle on phones */
  .brand .t b{font-size:.9rem;white-space:normal;line-height:1.15}
  .mark{width:30px;height:30px;font-size:1rem}
  .b{padding:8px 12px;font-size:.78rem}
  .seg-b{padding:8px 11px;font-size:.78rem}
  .who{display:none}                       /* hide username chip to save room (toggle shows the view) */
  .nav{gap:7px}
  .card{padding:22px 18px}
}
@media(max-width:380px){
  .brand .t b{font-size:.82rem}
  .b{padding:7px 9px;font-size:.72rem}
  .seg-b{padding:7px 8px;font-size:.72rem}
}
/* Comfortable tap targets on touch devices */
@media(hover:none) and (pointer:coarse){
  .b,.seg-b{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
}
</style>

:18px;\n  --r-sm:12px;\n  --sh:0 8px 32px rgba(0,0,0,.4);\n  --sh-lg:0 24px 60px rgba(0,0,0,.55);\n}\n/* LIGHT theme — applied when <html data-theme=\"light\"> */\n:root[data-theme=\"light\"]{\n  --bg:#eef2f7;                /* app canvas — soft blue-gray */\n  --bg2:#e3e9f2;\n  --sf:#ffffff;                /* card surface — solid white */\n  --sf2:#f6f9fc;\n  --bd:#e2e8f0;                /* light hairline border */\n  --bd2:#cdd7e3;               /* stronger border */\n  --tx:#3a4a5e;                /* body text — slate */\n  --hl:#0f2438;                /* headings — deep navy */\n  --mu:#64748b;                /* muted */\n  --mu2:#94a3b8;               /* more muted */\n  --gn:#2bb673;                /* deeper green so text reads on white */\n  --gn2:#1a9960;\n  --pu:#7c5cd6;\n  --pu2:#5c43a8;\n  --bl:#2f8fe0;\n  --cy:#0ea5b7;\n  --rd:#ef4444;\n  --or:#f59e0b;\n  --yl:#eab308;\n  --sh:0 1px 3px rgba(15,36,56,.08), 0 6px 20px rgba(15,36,56,.06);\n  --sh-lg:0 12px 40px rgba(15,36,56,.16);\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{overflow-x:hidden;scroll-behavior:smooth}\nbody{\n  font-family:'Open Sans',system-ui,sans-serif;\n  background:var(--bg);\n  color:var(--tx);\n  min-height:100vh;\n  -webkit-font-smoothing:antialiased;\n  overflow-x:hidden;\n  position:relative;\n}\n\n/* Ambient WHO-blue glow background */\nbody::before{\n  content:'';position:fixed;inset:0;z-index:-2;\n  background:\n    radial-gradient(ellipse 900px 600px at 10% -10%, rgba(0,147,213,.20), transparent 62%),\n    radial-gradient(ellipse 700px 500px at 92% 18%, rgba(0,92,171,.18), transparent 60%),\n    radial-gradient(ellipse 900px 600px at 50% 110%, rgba(62,207,142,.10), transparent 65%);\n  pointer-events:none;\n}\nbody::after{\n  content:'';position:fixed;inset:0;z-index:-1;\n  background:linear-gradient(180deg, rgba(0,26,58,0) 0%, rgba(0,15,33,.55) 100%);\n  pointer-events:none;\n}\n\n/* ═════════════ HEADER ═════════════ */\n.hdr{\n  position:sticky;top:0;z-index:50;\n  background:color-mix(in srgb, var(--bg) 78%, transparent);\n  backdrop-filter:blur(18px);\n  -webkit-backdrop-filter:blur(18px);\n  border-bottom:1px solid var(--bd);\n  padding:14px 32px;\n}\n.hdr-row{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;transform:scale(.85);transform-origin:right center}\n.brand{display:flex;align-items:center;gap:14px;flex:1;justify-content:center;min-width:0}\n.brand-mark{\n  width:64px;height:42px;border-radius:6px;\n  overflow:hidden;flex-shrink:0;\n  box-shadow:0 6px 18px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.15);\n}\n.brand-mark img{width:100%;height:100%;object-fit:cover;display:block}\n.brand h1{\n  font-family:'Open Sans',sans-serif;\n  font-size:1.35rem;font-weight:700;color:var(--hl);\n  letter-spacing:-.3px;line-height:1.1;\n  text-shadow:0 2px 12px rgba(0,0,0,.4);\n}\n.brand .tag{\n  font-size:.66rem;color:var(--mu);font-weight:600;\n  text-transform:uppercase;letter-spacing:1.4px;margin-top:3px;\n  display:flex;align-items:center;gap:6px;\n}\n.brand .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn);animation:pulse 2s infinite}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}\n\n/* WHO/WPRO co-brand — white logo, no box */\n.co-brand{\n  display:inline-flex;align-items:center;\n  padding:0;background:none;border:none;border-radius:0;\n  text-decoration:none;transition:opacity .2s;\n  opacity:.92;\n}\n.co-brand:hover{opacity:1}\n.co-logo{\n  height:84px;width:auto;display:block;\n  object-fit:contain;\n  /* Dark header (default): re-color the blue PNG to pure white. Light theme overrides this below. */\n  filter:brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,.4));\n}\n@media(max-width:1100px){.co-logo{height:72px}}\n@media(max-width:900px){.co-logo{height:60px}}\n@media(max-width:560px){.co-logo{height:46px}}\n\n/* Host-ministry (MoH) + WHO partner lockup */\n.co-group{display:flex;align-items:center;gap:150px}\n.co-div{width:1px;height:52px;flex:0 0 auto;background:var(--bd2);opacity:.65}\n/* MoH is a full-colour logo on a light field, so it sits in a white chip to\n   stay legible on the dark header (and blends cleanly in light theme). */\n/* Phẳng, không khung/bóng — đồng bộ với WHO (.co-brand): hơi mờ, hover rõ lên (\"in chìm\") */\n.moh-brand{display:inline-flex;align-items:center;transition:opacity .2s}\n.moh-brand:hover{opacity:1}\n/* Theme TỐI: file logo nền trắng → bọc thẻ trắng bo góc gọn gàng cho hết bị \"ô chữ nhật\" chói.\n   Chỉ áp dụng cho dark; theme sáng vẫn để phẳng. */\n[data-theme=\"dark\"] .moh-brand{background:#fff;border-radius:10px;padding:6px 11px;box-shadow:0 2px 12px rgba(0,0,0,.30)}\n.moh-logo{height:50px;width:auto;display:block;object-fit:contain}\n.moh-brand{background:#fff;border-radius:8px;padding:7px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}\n[data-theme=\"light\"] .moh-brand{box-shadow:0 2px 8px rgba(0,0,0,.10)}\n@media(max-width:1100px){.moh-logo{height:53px}.co-div{height:46px}.co-group{gap:90px}}\n@media(max-width:900px){.moh-logo{height:46px}.co-div{height:40px}.co-group{gap:48px}}\n@media(max-width:560px){.moh-logo{height:38px}.co-div{display:none}.co-group{gap:20px}}\n\n.live{\n  display:flex;align-items:center;gap:7px;\n  padding:6px 14px;border-radius:20px;\n  background:rgba(62,207,142,.10);\n  border:1px solid rgba(62,207,142,.28);\n  font-size:.65rem;font-weight:700;color:var(--gn);\n  text-transform:uppercase;letter-spacing:1px;\n  cursor:pointer;transition:.18s;font-family:inherit;\n}\n.live:hover{background:rgba(62,207,142,.18);transform:translateY(-1px)}\n.live .dot{width:6px;height:6px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn);animation:pulse 1.5s infinite}\n.live.off{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.3);color:var(--mu)}\n.live.off .dot{background:var(--mu);box-shadow:none;animation:none}\n.live.err{background:rgba(255,91,138,.10);border-color:rgba(255,91,138,.3);color:#ff8eae}\n.live.err .dot{background:#ff5b8a;box-shadow:0 0 8px #ff5b8a}\n.live.syn{background:rgba(255,209,102,.10);border-color:rgba(255,209,102,.3);color:#ffd784}\n.live.syn .dot{background:#ffd166;box-shadow:0 0 8px #ffd166;animation:pulse .8s infinite}\n\n/* Modal */\n.ovly{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;animation:fu .25s ease}\n.ovly.sh{display:flex}\n.mdl{\n  width:100%;max-width:560px;\n  background:linear-gradient(180deg, rgba(20,28,40,.96), rgba(12,18,26,.96));\n  backdrop-filter:blur(20px);\n  border:1px solid var(--bd2);border-radius:20px;\n  padding:28px 30px;\n  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);\n  animation:fu .3s ease;\n  max-height:90vh;overflow-y:auto;\n}\n.mdl h2{font-family:'Open Sans',sans-serif;font-size:1.4rem;color:var(--hl);margin-bottom:6px;letter-spacing:-.3px}\n.mdl .desc{font-size:.78rem;color:var(--mu);line-height:1.6;margin-bottom:18px}\n.mdl label{display:block;font-size:.66rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin:14px 0 6px}\n.mdl input[type=\"text\"],.mdl input[type=\"url\"]{\n  width:100%;background:rgba(0,0,0,.3);border:1px solid var(--bd2);\n  border-radius:10px;padding:10px 14px;color:var(--tx);\n  font-family:'Open Sans',monospace;font-size:.8rem;outline:none;transition:.15s;\n}\n.mdl input[type=\"text\"]:focus,.mdl input[type=\"url\"]:focus{border-color:var(--gn);background:rgba(62,207,142,.05);box-shadow:0 0 0 3px rgba(62,207,142,.12)}\n.mdl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}\n.mdl-row .btn{padding:9px 18px;font-size:.74rem}\n.mdl .x{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--mu);font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}\n.mdl .x:hover{background:rgba(255,255,255,.06);color:var(--hl)}\n.mdl-w{position:relative}\n.steps{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-top:14px;font-size:.76rem;color:var(--tx);line-height:1.7}\n.steps b{color:var(--hl)}\n.steps ol{padding-left:18px;margin:6px 0}\n.steps li{margin:4px 0}\n.steps code{background:rgba(62,207,142,.10);color:#7ee0a7;padding:1px 6px;border-radius:5px;font-size:.74rem;font-family:'Consolas',monospace}\n.mdl .stat{font-size:.72rem;color:var(--mu);margin-top:8px;line-height:1.5}\n.mdl .stat.ok{color:#7ee0a7}.mdl .stat.bad{color:#ff8eae}\n\n/* Diagnostic panel inside modal */\n.diag{\n  margin-top:14px;padding:12px 14px;\n  background:rgba(255,91,138,.07);\n  border:1px solid rgba(255,91,138,.25);\n  border-left:3px solid #ff5b8a;\n  border-radius:10px;\n  font-size:.74rem;color:var(--tx);line-height:1.55;\n}\n.diag-ttl{font-weight:800;color:#ff8eae;margin-bottom:8px;letter-spacing:.3px;font-size:.78rem}\n.diag-row{display:flex;gap:8px;margin:4px 0;flex-wrap:wrap}\n.diag-row>span:first-child{color:var(--mu);font-weight:700;min-width:96px;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px}\n.diag-row code{background:rgba(0,0,0,.35);color:#cfdcee;padding:2px 7px;border-radius:5px;font-size:.7rem;font-family:'Consolas','Monaco',monospace;word-break:break-all;flex:1;min-width:0}\n.diag-link{\n  display:inline-flex;align-items:center;gap:6px;\n  margin-top:10px;padding:7px 12px;\n  background:linear-gradient(135deg, var(--who3), var(--who));color:#fff;\n  border-radius:10px;font-size:.74rem;font-weight:700;\n  text-decoration:none;transition:.15s;\n}\n.diag-link:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,147,213,.4)}\n.diag-hint{\n  margin-top:10px;padding:9px 12px;\n  background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.25);\n  border-radius:8px;font-size:.74rem;color:#ffd784;line-height:1.55;\n}\n.diag-hint b{color:#ffd166}\n\n/* ═════════════ FILTER BAR ═════════════ */\n.filt{\n  margin-top:12px;\n  display:flex;align-items:center;gap:14px;flex-wrap:wrap;\n  padding:10px 14px;\n  background:rgba(18,26,38,.5);\n  backdrop-filter:blur(10px);\n  border:1px solid var(--bd);\n  border-radius:14px;\n}\n.filt-grp{display:flex;align-items:center;gap:8px}\n.filt-grp label{font-size:.62rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px}\n.filt input[type=\"date\"]{\n  background:rgba(255,255,255,.04);\n  border:1px solid var(--bd2);border-radius:8px;\n  padding:5px 9px;font-size:.78rem;color:var(--tx);\n  font-family:inherit;cursor:pointer;outline:none;\n  transition:.15s;color-scheme:dark;\n}\n.filt input[type=\"date\"]:hover,.filt input[type=\"date\"]:focus{border-color:var(--gn);background:rgba(62,207,142,.06)}\n.arrow{color:var(--mu2);font-size:.85rem}\n.btn{\n  background:linear-gradient(135deg, var(--gn2), var(--gn));\n  color:#fff;border:none;border-radius:18px;\n  padding:6px 14px;font-size:.7rem;font-weight:700;cursor:pointer;\n  letter-spacing:.4px;transition:.18s;font-family:inherit;\n  box-shadow:0 4px 14px rgba(62,207,142,.3);\n}\n.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(62,207,142,.45)}\n.btn-out{\n  background:transparent;color:var(--tx);\n  border:1px solid var(--bd2);box-shadow:none;\n}\n.btn-out:hover{border-color:var(--gn);color:var(--gn);background:rgba(62,207,142,.06)}\n\n.pills{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}\n.pill{\n  padding:5px 11px;font-size:.68rem;font-weight:700;\n  border-radius:14px;border:1px solid var(--bd2);\n  background:transparent;color:var(--mu);cursor:pointer;\n  transition:.15s;font-family:inherit;letter-spacing:.3px;\n}\n.pill:hover{color:var(--hl);border-color:var(--bd2)}\n.pill.on{\n  background:linear-gradient(135deg, rgba(62,207,142,.18), rgba(124,92,191,.18));\n  color:var(--hl);border-color:rgba(62,207,142,.45);\n  box-shadow:0 2px 10px rgba(62,207,142,.18);\n}\n\n/* ═════════════ MAIN ═════════════ */\n.main{max-width:1480px;margin:0 auto;padding:28px 32px 60px}\n\n/* ═════════════ SOURCE BANNER (data connection state) ═════════════ */\n.src-bnr{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:16px;flex-wrap:wrap;\n  margin:14px 0 26px;padding:14px 22px;\n  background:linear-gradient(135deg, rgba(0,147,213,.10), rgba(0,30,68,.55));\n  border:1px solid rgba(0,147,213,.28);\n  border-left:4px solid var(--mu);\n  border-radius:14px;\n  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\n  transition:.25s;\n}\n.src-bnr.disc{border-left-color:var(--mu)}\n.src-bnr.syn{border-left-color:var(--yl);background:linear-gradient(135deg, rgba(255,209,102,.10), rgba(0,30,68,.55));border-color:rgba(255,209,102,.32)}\n.src-bnr.err{border-left-color:var(--rd);background:linear-gradient(135deg, rgba(255,91,138,.12), rgba(0,30,68,.55));border-color:rgba(255,91,138,.32)}\n.src-bnr.ok{border-left-color:var(--gn);background:linear-gradient(135deg, rgba(62,207,142,.12), rgba(0,147,213,.10));border-color:rgba(62,207,142,.32)}\n\n.src-l{display:flex;align-items:center;gap:14px;min-width:0;flex:1}\n.src-icon{\n  width:46px;height:46px;border-radius:12px;flex-shrink:0;\n  display:grid;place-items:center;position:relative;\n  background:rgba(0,147,213,.14);\n  border:1px solid rgba(0,147,213,.28);\n}\n.src-bnr.ok .src-icon{background:rgba(62,207,142,.14);border-color:rgba(62,207,142,.32)}\n.src-bnr.syn .src-icon{background:rgba(255,209,102,.12);border-color:rgba(255,209,102,.32)}\n.src-bnr.err .src-icon{background:rgba(255,91,138,.12);border-color:rgba(255,91,138,.32)}\n.src-bnr.disc .src-icon{background:rgba(144,164,192,.10);border-color:rgba(144,164,192,.25)}\n.src-dot{width:14px;height:14px;border-radius:50%;background:var(--mu);transition:.2s}\n.src-bnr.ok .src-dot{background:var(--gn);box-shadow:0 0 14px var(--gn);animation:pulse 2s infinite}\n.src-bnr.syn .src-dot{background:var(--yl);box-shadow:0 0 14px var(--yl);animation:pulse .8s infinite}\n.src-bnr.err .src-dot{background:var(--rd);box-shadow:0 0 14px var(--rd)}\n.src-bnr.disc .src-dot{background:var(--mu)}\n\n.src-info{min-width:0;flex:1}\n.src-ttl-l{\n  font-size:.62rem;color:var(--mu);font-weight:700;\n  text-transform:uppercase;letter-spacing:1.4px;margin-bottom:3px;\n}\n.src-val{\n  font-family:'Open Sans',sans-serif;\n  font-size:.95rem;color:var(--hl);font-weight:700;letter-spacing:-.1px;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n}\n\n.src-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.src-meta{\n  font-size:.7rem;color:var(--hl);font-weight:700;\n  letter-spacing:.3px;padding:6px 12px;\n  background:rgba(0,147,213,.14);border-radius:10px;\n  border:1px solid rgba(0,147,213,.30);\n}\n.btn-who{\n  background:linear-gradient(135deg, var(--who3), var(--who));\n  color:#fff;border:none;border-radius:18px;\n  padding:7px 14px;font-size:.7rem;font-weight:700;cursor:pointer;\n  letter-spacing:.4px;transition:.18s;font-family:inherit;\n  box-shadow:0 4px 14px rgba(0,147,213,.32);\n  display:inline-flex;align-items:center;gap:5px;\n}\n.btn-who:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,147,213,.5)}\n\n/* Drill-down chip bar — shows active click-through filters */\n.drill-bar{\n  display:flex;align-items:center;gap:10px;flex-wrap:wrap;\n  margin:0 0 22px;padding:11px 16px;\n  background:linear-gradient(135deg, rgba(0,147,213,.14), rgba(62,207,142,.10));\n  border:1px solid rgba(0,147,213,.32);\n  border-left:3px solid var(--who);\n  border-radius:12px;\n  animation:fu .25s ease;\n}\n.drill-lbl{font-size:.68rem;font-weight:700;color:var(--hl);text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:6px}\n.drill-chip{\n  display:inline-flex;align-items:center;\n  background:rgba(0,147,213,.18);border:1px solid rgba(0,147,213,.38);\n  border-radius:14px;padding:4px 11px;\n  font-size:.72rem;font-weight:600;\n}\n.drill-k{font-size:.58rem;color:var(--mu);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-right:7px}\n.drill-v{color:var(--hl);font-weight:700}\n.drill-x{\n  margin-left:auto;background:rgba(255,91,138,.10);\n  border:1px solid rgba(255,91,138,.36);\n  color:#ff8eae;padding:6px 13px;border-radius:12px;\n  font-size:.66rem;font-weight:800;cursor:pointer;\n  text-transform:uppercase;letter-spacing:.6px;font-family:inherit;\n  transition:.15s;\n}\n.drill-x:hover{background:rgba(255,91,138,.22);color:#fff;transform:translateY(-1px)}\n@media(max-width:700px){\n  .drill-bar{padding:10px 12px;gap:8px;margin-bottom:18px}\n  .drill-x{margin-left:0;width:100%;text-align:center;margin-top:4px}\n}\n\n/* Section title */\n.s-ttl{\n  font-family:'Open Sans',sans-serif;\n  font-size:1.5rem;font-weight:700;color:var(--hl);\n  margin:6px 0 4px;letter-spacing:-.3px;\n}\n.s-sub{font-size:.78rem;color:var(--mu);margin-bottom:22px;line-height:1.5;max-width:720px}\n\n/* ═════════════ KPI ═════════════ */\n.kpis{\n  display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:30px;\n}\n.kpi{\n  position:relative;overflow:hidden;\n  background:var(--sf);\n  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  border:1px solid var(--bd);\n  border-radius:var(--r);\n  padding:18px 18px 16px;\n  transition:.25s;\n}\n.kpi::before{\n  content:'';position:absolute;inset:0;\n  background:radial-gradient(ellipse 200px 120px at 50% -20%, var(--g, rgba(62,207,142,.18)), transparent 70%);\n  pointer-events:none;\n}\n.kpi:hover{transform:translateY(-3px);border-color:var(--bd2);box-shadow:var(--sh)}\n.kpi .v{\n  font-family:'Open Sans',sans-serif;\n  font-size:2.2rem;font-weight:800;color:var(--hl);\n  line-height:1;letter-spacing:-1px;\n  text-shadow:0 2px 16px rgba(0,0,0,.5);  /* dark-mode glow; removed in light via [data-theme=\"light\"] */\n}\n.kpi .l{\n  font-size:.6rem;color:var(--mu);\n  text-transform:uppercase;letter-spacing:1.4px;\n  font-weight:700;margin-top:10px;\n}\n.kpi .ic{\n  position:absolute;top:14px;right:14px;\n  width:30px;height:30px;border-radius:9px;\n  display:grid;place-items:center;font-size:.95rem;\n  background:rgba(255,255,255,.04);\n  border:1px solid var(--bd);\n}\n.kpi.gn{--g:rgba(62,207,142,.20)}\n.kpi.rd{--g:rgba(255,91,138,.20)}\n.kpi.bl{--g:rgba(95,180,255,.20)}\n.kpi.or{--g:rgba(255,174,92,.22)}\n.kpi.pu{--g:rgba(155,123,224,.22)}\n.kpi.cy{--g:rgba(94,234,212,.20)}\n.kpi.in{--g:rgba(99,102,241,.22)}\n/* Full-width info note (e.g. denominator caveat under Feedback Type Breakdown) */\n.note-band{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;\n  background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--gn);\n  border-radius:12px;font-family:'Open Sans',sans-serif;font-size:.78rem;\n  line-height:1.55;color:var(--mu)}\n.note-band b{color:var(--hl);font-weight:700}\n.note-ic{font-size:.95rem;line-height:1.4;flex:none}\n\n/* ═════════════ NAV ═════════════ */\n.nav{\n  display:flex;gap:4px;flex-wrap:wrap;\n  margin-bottom:24px;padding:6px;\n  background:var(--sf);\n  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  border:1px solid var(--bd);border-radius:var(--r);\n}\n.vb{\n  display:flex;align-items:center;gap:7px;\n  padding:9px 16px;border-radius:12px;border:1px solid transparent;\n  background:transparent;color:var(--mu);\n  font-size:.76rem;font-weight:700;cursor:pointer;\n  transition:.18s;white-space:nowrap;font-family:inherit;\n  letter-spacing:.2px;\n}\n.vb:hover{background:rgba(255,255,255,.04);color:var(--hl)}\n.vb.on{\n  background:linear-gradient(135deg, rgba(62,207,142,.16), rgba(95,180,255,.12));\n  color:var(--hl);border-color:rgba(62,207,142,.35);\n  box-shadow:0 2px 10px rgba(62,207,142,.15), inset 0 1px 0 rgba(255,255,255,.05);\n}\n.vb .i{font-size:1rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}\n/* Back button — filled accent so users always spot the exit from a drill-down */\n.vb-back{\n  margin-left:auto;\n  background:linear-gradient(135deg, var(--gn), var(--gn2));\n  color:#fff;border-color:transparent;letter-spacing:.3px;\n  box-shadow:0 4px 14px rgba(62,207,142,.40), inset 0 1px 0 rgba(255,255,255,.22);\n}\n.vb-back:hover{\n  background:linear-gradient(135deg, var(--gn2), var(--gn));\n  color:#fff;border-color:transparent;\n  box-shadow:0 6px 20px rgba(62,207,142,.55), inset 0 1px 0 rgba(255,255,255,.22);\n  transform:translateY(-1px);\n}\n/* Per-tab total-count — right-aligned on the section-title row · \"TOTAL (N) = …\" */\n.tab-total{margin-left:auto;font-family:'Open Sans',sans-serif;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mu);white-space:nowrap}\n.tab-total b{color:var(--hl);font-size:.92rem;letter-spacing:.3px;margin-left:2px}\n\n/* ═════════════ ADVANCED FILTERS (multi-select) ═════════════ */\n.adv-filt{\n  margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;\n  padding:10px 14px;\n  background:rgba(17,26,36,.5);\n  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\n  border:1px solid var(--bd);border-radius:14px;\n}\n.adv-l{font-size:.62rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin-right:4px;display:flex;align-items:center;gap:5px}\n.msel{\n  position:relative;\n  display:inline-flex;align-items:center;gap:6px;\n  padding:6px 12px;font-size:.72rem;font-weight:700;\n  border-radius:14px;border:1px solid var(--bd2);\n  background:rgba(255,255,255,.03);color:var(--tx);cursor:pointer;\n  transition:.15s;font-family:inherit;letter-spacing:.3px;\n  user-select:none;\n}\n.msel:hover{background:rgba(255,255,255,.06);border-color:var(--gn)}\n.msel.active{\n  background:linear-gradient(135deg, rgba(62,207,142,.18), rgba(95,180,255,.14));\n  color:var(--hl);border-color:rgba(62,207,142,.45);\n  box-shadow:0 2px 10px rgba(62,207,142,.18);\n}\n.msel .ic{font-size:.85rem;opacity:.85}\n.msel .cnt{font-size:.66rem;background:rgba(62,207,142,.25);color:#7ee0a7;padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:.2px}\n.msel:not(.active) .cnt{display:none}\n.msel .car{font-size:.55rem;opacity:.7;transition:transform .2s;margin-left:2px}\n.msel.open .car{transform:rotate(180deg)}\n.msel-pop{\n  display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;\n  min-width:230px;max-height:300px;overflow-y:auto;\n  background:linear-gradient(180deg, rgba(20,28,40,.97), rgba(12,18,26,.97));\n  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);\n  border:1px solid var(--bd2);border-radius:12px;padding:6px;\n  box-shadow:0 16px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);\n  animation:fu .2s ease;\n}\n.msel.open .msel-pop{display:block}\n.msel-pop::-webkit-scrollbar{width:6px}\n.msel-pop::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}\n.msel-opt{\n  display:flex;align-items:center;gap:9px;\n  padding:7px 11px;border-radius:7px;cursor:pointer;\n  font-size:.76rem;color:var(--tx);font-weight:600;\n  transition:.12s;letter-spacing:.1px;\n}\n.msel-opt:hover{background:rgba(62,207,142,.10);color:var(--hl)}\n.msel-opt input[type=checkbox]{\n  accent-color:var(--gn);width:14px;height:14px;cursor:pointer;margin:0;\n}\n.msel-empty{color:var(--mu2);padding:8px 12px;font-size:.74rem;font-style:italic}\n.fbtn-clr{\n  margin-left:auto;font-size:.66rem;font-weight:700;\n  color:var(--mu);background:none;border:none;cursor:pointer;\n  padding:5px 10px;border-radius:10px;\n  text-transform:uppercase;letter-spacing:.8px;font-family:inherit;\n  transition:.15s;\n}\n.fbtn-clr:hover{color:#ff8eae;background:rgba(255,91,138,.08)}\n.fbtn-clr.hide{display:none}\n\n/* ═════════════ SEGMENT TOGGLE (filter buttons inside tabs) ═════════════ */\n.seg-bar{\n  display:flex;align-items:center;gap:6px;flex-wrap:wrap;\n  margin:0 0 18px;padding:10px 14px;\n  background:var(--sf);\n  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  border:1px solid var(--bd);border-radius:14px;\n}\n.seg-bar .seg-l{\n  font-size:.62rem;font-weight:700;color:var(--mu);\n  text-transform:uppercase;letter-spacing:1.2px;margin-right:4px;\n}\n.seg-bar .seg-sp{flex:1}\n.seg{\n  display:inline-flex;align-items:center;gap:6px;\n  padding:6px 13px;font-size:.7rem;font-weight:700;\n  border-radius:14px;border:1px solid var(--bd2);\n  background:transparent;color:var(--mu);cursor:pointer;\n  transition:.15s;font-family:inherit;letter-spacing:.3px;\n}\n.seg:hover{color:var(--hl);border-color:var(--bd2);background:rgba(255,255,255,.03)}\n.seg.on{\n  background:linear-gradient(135deg, rgba(62,207,142,.18), rgba(95,180,255,.14));\n  color:var(--hl);border-color:rgba(62,207,142,.45);\n  box-shadow:0 2px 10px rgba(62,207,142,.18);\n}\n\n/* ═════════════ PANELS ═════════════ */\n.pn{display:none;animation:fu .35s ease}.pn.sh{display:block}\n@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\n\n.cr{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:18px}\n.cr.s1{grid-template-columns:1fr}\n.cr.s3{grid-template-columns:repeat(3,1fr)}\n.cr.s4{grid-template-columns:repeat(2,1fr)}\n.cc{\n  position:relative;overflow:hidden;\n  background:var(--sf);\n  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  border:1px solid var(--bd);\n  border-radius:var(--r);\n  padding:22px 24px;\n  transition:.25s;\n}\n.cc:hover{border-color:var(--bd2)}\n.cc::before{\n  content:'';position:absolute;top:0;left:0;right:0;height:1px;\n  background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);\n}\n.cc h3{\n  font-family:'Open Sans',sans-serif;\n  font-size:1rem;font-weight:700;color:var(--hl);\n  margin-bottom:14px;display:flex;align-items:center;gap:9px;\n  letter-spacing:-.2px;\n}\n.cc h3 .i{\n  font-size:.95rem;\n  width:28px;height:28px;border-radius:8px;\n  display:grid;place-items:center;\n  background:rgba(62,207,142,.10);\n  border:1px solid rgba(62,207,142,.22);\n  color:var(--gn);\n}\n.cc h3 .sub{\n  font-family:'Open Sans',sans-serif;\n  font-size:.66rem;color:var(--mu);font-weight:600;\n  text-transform:uppercase;letter-spacing:1px;\n  margin-left:auto;\n}\n\n.cb{position:relative;width:100%}\n.cb.h250{height:250px}.cb.h300{height:300px}.cb.h340{height:340px}.cb.h380{height:380px}.cb.h420{height:420px}.cb.h500{height:500px}.cb.h600{height:600px}.cb.h820{height:820px}\n\n/* Per-tab indicator filter — narrows the tab to one specific category/facility/etc. */\n.tab-filter{display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:11px 16px;background:rgba(15,22,32,.55);border:1px solid var(--bd);border-radius:12px;flex-wrap:wrap}\n.tab-filter label{font-family:'Open Sans',sans-serif;font-size:.66rem;color:var(--mu);font-weight:800;text-transform:uppercase;letter-spacing:1.1px}\n/* Indicator chips — one chip per column, each with its own checkbox popup (shorter dropdowns) */\n.ind-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}\n.ind-chip{position:relative;display:inline-flex;align-items:center;gap:7px;background:rgba(8,14,22,.85);color:#cbd5e1;border:1px solid var(--bd2);border-radius:8px;padding:7px 12px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:'Open Sans',sans-serif;user-select:none;transition:border-color .15s,color .15s,background .15s}\n.ind-chip:hover{border-color:var(--mu2);color:#eaf2fb}\n.ind-chip.active{border-color:var(--gn);color:#eaf2fb;background:rgba(62,207,142,.10)}\n.ind-chip .cnt{background:rgba(62,207,142,.16);color:var(--gn);padding:1px 7px;border-radius:8px;font-size:.62rem;font-weight:800;min-width:16px;text-align:center}\n.ind-chip.active .cnt{background:var(--gn);color:#0a1118}\n.ind-chip .car{font-size:.6rem;color:var(--mu);transition:transform .2s}\n.ind-chip.open .car{transform:rotate(180deg)}\n.ic-all{background:rgba(62,207,142,.10);border-color:rgba(62,207,142,.32);color:#7ee0a7;font-weight:800}\n.ic-all:hover{background:rgba(62,207,142,.20);color:#eaf2fb}\n.ind-chip-pop{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;max-width:380px;max-height:340px;overflow-y:auto;background:rgba(8,14,22,.98);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd2);border-radius:10px;padding:8px;display:none;z-index:60;box-shadow:0 12px 28px rgba(0,0,0,.55);font-weight:500;cursor:default}\n.ind-chip.open .ind-chip-pop{display:block}\n.ind-chip-pop::-webkit-scrollbar{width:8px}\n.ind-chip-pop::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}\n.ind-chip-pop::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}\n.ind-opt{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:.76rem;color:#cbd5e1;transition:background .12s,color .12s}\n.ind-opt:hover{background:rgba(255,255,255,.04);color:#eaf2fb}\n.ind-opt input[type=checkbox]{cursor:pointer;accent-color:var(--gn);margin:0;width:14px;height:14px;flex-shrink:0}\n.ind-opt span{flex:1;line-height:1.35}\n/* \"Select all in this column\" toggle at top of each chip popup */\n.ind-opt-grp{font-size:.62rem;font-weight:800;color:#9aabbf;text-transform:uppercase;letter-spacing:1.1px;padding:6px 7px;border-bottom:1px solid var(--bd);margin-bottom:4px;border-radius:0}\n.ind-opt-grp:hover{background:rgba(255,255,255,.05);color:#cbd5e1}\n.btn-tf{background:rgba(255,91,138,.10);color:#ff8eae;border:1px solid rgba(255,91,138,.32);border-radius:8px;padding:8px 14px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:'Open Sans',sans-serif;letter-spacing:.3px;transition:background .15s}\n.btn-tf:hover{background:rgba(255,91,138,.18);border-color:rgba(255,91,138,.55)}\n\n/* Grouped pie-chart legend list (dark→light shades within each theme) */\n.plg{margin-top:14px;display:flex;flex-direction:column;gap:11px;font-family:'Open Sans',sans-serif}\n.plg-grp{border-left:3px solid rgba(255,255,255,.10);padding:2px 0 2px 11px}\n.plg-grp-h{font-size:.62rem;font-weight:800;color:#9aabbf;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}\n.plg-grp-h .plg-sub{font-size:.62rem;font-weight:800;color:#3ecf8e;letter-spacing:.3px;text-transform:none;font-variant-numeric:tabular-nums;white-space:nowrap}\n.plg-grand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;padding:8px 6px 2px;border-top:2px solid rgba(62,207,142,.5);font-size:.74rem;font-weight:800;color:#3ecf8e;text-transform:uppercase;letter-spacing:.6px}\n.plg-grand .plg-grand-v{font-variant-numeric:tabular-nums;white-space:nowrap}\n[data-theme=\"light\"] .plg-grp-h .plg-sub{color:#1a9960}\n[data-theme=\"light\"] .plg-grand{color:#15803d;border-top-color:rgba(43,182,115,.5)}\n.plg-grp ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}\n.plg-grp li{display:flex;align-items:center;gap:10px;font-size:.74rem;color:#cbd5e1;font-weight:600;padding:4px 6px;border-radius:6px;transition:background .15s,color .15s}\n.plg-grp li.lk{cursor:pointer}\n.plg-grp li.lk:hover{background:rgba(255,255,255,.04);color:#eaf2fb}\n.plg-grp li .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.35)}\n.plg-grp li .nm{flex:1;line-height:1.35}\n.plg-grp li .vl{color:#7b8a9c;font-weight:700;font-variant-numeric:tabular-nums;font-size:.72rem}\n/* Monthly-trend legend: label + total case count only. */\n.plg-totals{gap:7px}\n.plg-totals-head,.plg-total-row{display:grid;grid-template-columns:minmax(190px,1fr) 92px;gap:12px;align-items:center;padding:6px 7px}\n.plg-totals-head{padding-top:0;padding-bottom:5px;border-bottom:1px solid var(--bd);color:var(--mu);font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px}\n.plg-totals-head .total,.plg-total-val{text-align:right}\n.plg-totals-head .total{white-space:nowrap;overflow:visible}\n.plg-total-row{border-radius:6px;color:#cbd5e1;font-size:.74rem;font-weight:600;transition:background .15s,color .15s}\n.plg-total-row.lk{cursor:pointer}\n.plg-total-row.lk:hover{background:rgba(255,255,255,.04);color:#eaf2fb}\n.plg-total-name{min-width:0;line-height:1.35}\n.plg-total-val{color:var(--mu);font-size:.72rem;font-weight:800;font-variant-numeric:tabular-nums}\n@media(max-width:700px){.plg-totals-head,.plg-total-row{grid-template-columns:minmax(135px,1fr) 76px;gap:8px}}\n\n/* Section separator */\n.sep{\n  display:flex;align-items:center;gap:12px;\n  margin:26px 0 16px;padding:0 2px;\n}\n.sep::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gn);box-shadow:0 0 10px var(--gn)}\n.sep-t{\n  font-family:'Open Sans',sans-serif;\n  font-size:1.05rem;font-weight:700;color:var(--hl);\n  letter-spacing:-.2px;\n}\n.sep-l{\n  flex:1;height:1px;\n  background:linear-gradient(90deg, var(--bd2), transparent);\n}\n\n/* ═════════════ TABLE ═════════════ */\n.tc{\n  background:var(--sf);\n  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  border:1px solid var(--bd);\n  border-radius:var(--r);\n  padding:22px 24px;\n  overflow:hidden;\n}\n.tbl-wrap{max-height:560px;overflow:auto;border-radius:10px;border:1px solid var(--bd)}\n.tbl-wrap::-webkit-scrollbar{width:8px;height:8px}\n.tbl-wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}\n.tbl-wrap::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}\n.tbl-wrap::-webkit-scrollbar-thumb:hover{background:var(--mu2)}\ntable{width:100%;border-collapse:collapse;font-size:.76rem}\nth{\n  background:rgba(8,14,22,.95);\n  backdrop-filter:blur(10px);\n  padding:11px 12px;text-align:left;\n  font-size:.62rem;font-weight:700;color:var(--mu);\n  text-transform:uppercase;letter-spacing:1.2px;\n  position:sticky;top:0;z-index:2;\n  border-bottom:1px solid var(--bd2);\n}\ntd{padding:10px 12px;border-bottom:1px solid var(--bd);color:var(--tx)}\ntr:hover td{background:rgba(255,255,255,.025)}\ntr:last-child td{border-bottom:none}\n.bg{\n  display:inline-block;padding:3px 9px;border-radius:10px;\n  font-size:.62rem;font-weight:700;letter-spacing:.4px;\n  text-transform:uppercase;border:1px solid;\n}\n.br{background:rgba(255,91,138,.12);color:#ff8eae;border-color:rgba(255,91,138,.3)}\n.bgn{background:rgba(62,207,142,.12);color:#7ee0a7;border-color:rgba(62,207,142,.3)}\n.by{background:rgba(255,209,102,.10);color:#ffd784;border-color:rgba(255,209,102,.28)}\n.bgr{background:rgba(148,163,184,.10);color:#a0b0c2;border-color:rgba(148,163,184,.24)}\n\n/* Complaint Summary — free text; bounded width + inner scroll so long entries don't blow up the row */\ntd.sumtd{vertical-align:top;max-width:360px;min-width:200px}\ntd.sumtd .sum{max-height:108px;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.45;font-size:.74rem}\ntd.sumtd .sum::-webkit-scrollbar{width:6px}\ntd.sumtd .sum::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}\n\n/* ═════════════ INSIGHT ═════════════ */\n.ins{\n  margin-top:16px;padding:14px 18px;\n  background:linear-gradient(135deg, rgba(62,207,142,.08), rgba(95,180,255,.08));\n  border:1px solid rgba(62,207,142,.22);\n  border-radius:12px;\n  font-size:.8rem;line-height:1.65;color:var(--tx);\n  position:relative;padding-left:46px;\n}\n.ins::before{\n  content:'◆';position:absolute;left:18px;top:14px;\n  color:var(--gn);font-size:.85rem;\n  text-shadow:0 0 10px rgba(62,207,142,.6);\n}\n.ins b{color:var(--hl);font-weight:700}\n\n/* ═════════════ FOOTER ═════════════ */\n.ft{\n  text-align:center;padding:24px 20px 14px;\n  font-size:.7rem;color:var(--mu2);letter-spacing:.4px;\n}\n.ft b{color:var(--mu);font-weight:600}\n\n.nodata{text-align:center;padding:60px 20px;color:var(--mu);font-style:italic;font-size:.85rem}\n\n/* ─── ICON CLEANUP — hide decorative icons for a cleaner look ─── */\n.cc h3 .i{display:none}      /* card heading icon boxes */\n.kpi .ic{display:none}        /* KPI corner badge icons */\n.kpi{padding-top:16px}        /* tighten padding now that corner icon is gone */\n.msel .ic{display:none}       /* filter button leading icons */\n.msel{padding-left:14px}      /* slightly tighter padding for filter buttons */\n.adv-l{display:none}          /* hide the \"🎚 Filters\" label */\n.sep::before{display:none}    /* hide section separator decorative dot */\n.sep{margin-top:22px}\n.vb .i{display:none}          /* hide nav tab leading icons */\n.vb{padding-left:18px;padding-right:18px}\n\n/* ═════════════ RESPONSIVE ═════════════ */\n\n/* Tablet landscape — 2-column charts unchanged, KPIs to 3-col */\n@media(max-width:1100px){\n  .kpis{grid-template-columns:repeat(3,1fr)}\n  .cr{grid-template-columns:1fr}\n  .cr.s3{grid-template-columns:1fr}\n  .cr.s4{grid-template-columns:1fr}\n  .main{padding:22px 24px 50px}\n  .hdr{padding:12px 22px}\n}\n\n/* Tablet portrait — header wraps, nav becomes horizontal scroll */\n@media(max-width:880px){\n  .hdr-row{gap:12px}\n  .brand h1{font-size:1.2rem}\n  .brand .tag{font-size:.62rem;letter-spacing:1px}\n  .co-group{order:3}\n  .live{order:2}\n  /* Nav becomes horizontally scrollable to keep tabs in one row */\n  .nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}\n  .nav::-webkit-scrollbar{height:4px}\n  .nav::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}\n  .vb{flex-shrink:0}\n  /* Chart card a bit less padded */\n  .cc{padding:18px 18px}\n}\n\n/* Phone — single column, stack header, compact spacing */\n@media(max-width:700px){\n  body{font-size:14px}\n  .hdr{padding:12px 14px;position:relative}\n  .main{padding:18px 14px 40px}\n  .hdr-row{flex-wrap:wrap}\n  .brand{min-width:0;flex:1}\n  .brand h1{font-size:1.05rem;line-height:1.2;letter-spacing:-.2px}\n  .brand .tag{font-size:.58rem;letter-spacing:.8px;white-space:normal}\n  .brand-mark{width:54px;height:36px;border-radius:5px}\n  .live{padding:4px 10px;font-size:.55rem;gap:5px;border-radius:16px;letter-spacing:.5px;flex-shrink:0;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}\n  .live .dot{width:5px;height:5px}\n  /* Filter bar: cleaner stack, full-width inputs */\n  .filt{padding:10px 12px;gap:10px;flex-direction:column;align-items:stretch}\n  .filt-grp{flex-wrap:wrap;gap:6px;justify-content:flex-start}\n  .filt input[type=\"date\"]{flex:1;min-width:0;padding:8px 10px;font-size:.85rem}\n  .arrow{display:none}\n  .filt-grp label{font-size:.65rem}\n  .pills{margin-left:0;width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px}\n  .pills::-webkit-scrollbar{height:0}\n  .pill{flex-shrink:0;padding:7px 13px;font-size:.72rem}\n  /* Advanced filter row */\n  .adv-filt{padding:8px 10px;gap:6px}\n  .msel{padding:8px 14px;font-size:.74rem}\n  /* Filter popup becomes a bottom sheet on phones — no off-screen clipping */\n  .msel.open .msel-pop{\n    position:fixed;\n    left:10px;right:10px;top:auto;bottom:12px;\n    width:auto;min-width:0;max-width:none;max-height:60vh;\n    border-radius:14px;padding:10px;\n    box-shadow:0 -8px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);\n    animation:sheetUp .25s ease;\n  }\n  @keyframes sheetUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}\n  .msel-opt{padding:11px 12px;font-size:.85rem;min-height:42px}\n  .fbtn-clr{padding:6px 12px;font-size:.68rem}\n  /* KPI grid */\n  .kpis{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}\n  .kpi{padding:14px 14px 12px}\n  .kpi .v{font-size:1.55rem}\n  .kpi .l{font-size:.55rem;letter-spacing:1.1px}\n  /* Section title */\n  .s-ttl{font-size:1.25rem}\n  .s-sub{font-size:.74rem;margin-bottom:18px;line-height:1.55}\n  /* Nav buttons taller for touch (44px target) */\n  .vb{padding:11px 14px;font-size:.76rem;gap:6px}\n  .vb .i{font-size:1rem}\n  /* Cards */\n  .cc{padding:16px 14px;border-radius:14px}\n  .cc h3{font-size:.95rem;flex-wrap:wrap}\n  .cc h3 .sub{margin-left:0;font-size:.6rem;width:100%;margin-top:2px}\n  /* Chart heights reduced on phone */\n  .cb.h250{height:220px}\n  .cb.h300{height:240px}\n  .cb.h340{height:280px}\n  .cb.h380{height:320px}\n  .cb.h420{height:360px}\n  .cb.h500{height:420px}\n  .cb.h600{height:480px}\n  .cb.h820{height:560px}\n  /* Separator */\n  .sep{margin:20px 0 12px}\n  .sep-t{font-size:.9rem}\n  /* Insight box */\n  .ins{font-size:.74rem;padding:12px 14px 12px 38px}\n  .ins::before{left:14px;top:13px}\n  /* Table */\n  .tc{padding:14px 12px}\n  table{font-size:.7rem}\n  th,td{padding:7px 6px}\n  th{font-size:.55rem;letter-spacing:.8px}\n  .bg{font-size:.55rem;padding:2px 6px}\n  /* Modal */\n  .mdl{padding:20px 18px;border-radius:14px;max-height:92vh}\n  .mdl h2{font-size:1.15rem}\n  .mdl .desc{font-size:.74rem}\n  .mdl-row{flex-wrap:wrap}\n  .mdl-row .btn{flex:1;min-width:120px;padding:10px 14px;font-size:.72rem}\n  .steps{font-size:.72rem;padding:12px 14px}\n  .steps ol{padding-left:16px}\n  /* Diagnostic panel — full width code */\n  .diag-row{flex-direction:column;gap:3px;align-items:flex-start}\n  .diag-row>span:first-child{min-width:auto}\n  .diag-row code{width:100%;font-size:.65rem}\n  /* Footer */\n  .ft{padding:18px 14px 12px;font-size:.66rem;line-height:1.5}\n}\n\n/* Tiny phones (≤380px) — maximum density */\n@media(max-width:380px){\n  .hdr{padding:10px 10px}\n  .main{padding:14px 10px 32px}\n  .kpis{gap:8px}\n  .kpi{padding:12px 12px 10px}\n  .kpi .v{font-size:1.4rem}\n  .brand h1{font-size:.95rem}\n  .brand-mark{width:46px;height:30px}\n  .co-logo{height:36px}\n  .moh-logo{height:34px}\n  .nav{padding:5px 6px}\n  .vb{padding:10px 11px;font-size:.7rem}\n  .msel{padding:7px 11px;font-size:.7rem}\n  .s-ttl{font-size:1.1rem}\n  .live{font-size:.5rem;padding:4px 8px;max-width:72px}\n}\n\n/* Landscape on phones — keep header compact */\n@media(max-height:480px) and (orientation:landscape){\n  .hdr{position:relative}\n  .kpis{grid-template-columns:repeat(7,1fr);gap:8px}\n  .kpi .v{font-size:1.4rem}\n  .cb.h300{height:200px}\n  .cb.h340{height:220px}\n  .cb.h380{height:260px}\n  .cb.h500{height:300px}\n  .cb.h600{height:360px}\n  .cb.h820{height:420px}\n}\n\n/* Touch target hint — make all clickable controls comfortably tappable */\n@media(hover:none) and (pointer:coarse){\n  .vb,.pill,.msel,.btn,.live,.fbtn-clr,.seg{min-height:38px}\n  .filt input[type=\"date\"]{min-height:36px}\n  .msel-opt{padding:9px 11px;min-height:36px}\n}\n\n/* Reduced motion — respect user preference */\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}\n}\n\n/* ═══════════════════════════════════════════════════════════════\n   LIGHT THEME OVERRIDES — scoped to <html data-theme=\"light\">\n   Fixes hardcoded dark/glass values the token swap can't reach.\n   Dark theme uses the base rules above; in light mode these win via\n   the higher-specificity [data-theme=\"light\"] ancestor selector.\n   ═══════════════════════════════════════════════════════════════ */\n\n/* Ambient background — faint light-blue wash instead of dark glow */\n[data-theme=\"light\"] body::before{\n  background:\n    radial-gradient(ellipse 900px 600px at 10% -10%, rgba(0,147,213,.07), transparent 62%),\n    radial-gradient(ellipse 700px 500px at 92% 18%, rgba(0,92,171,.06), transparent 60%),\n    radial-gradient(ellipse 900px 600px at 50% 110%, rgba(43,182,115,.05), transparent 65%);\n}\n[data-theme=\"light\"] body::after{background:none}\n\n/* WHO logo — show the original blue PNG (dark theme re-colors it white) */\n[data-theme=\"light\"] .co-logo{filter:drop-shadow(0 1px 3px rgba(15,36,56,.15))}\n\n/* KPI value — drop the dark glow on the white card */\n[data-theme=\"light\"] .kpi .v{text-shadow:none}\n\n/* Header */\n[data-theme=\"light\"] .brand-mark{box-shadow:0 2px 8px rgba(15,36,56,.14), 0 0 0 1px rgba(15,36,56,.06)}\n[data-theme=\"light\"] .brand h1{text-shadow:none}\n\n/* Live / sync pill — darker text for contrast on light tints */\n[data-theme=\"light\"] .live{background:rgba(43,182,115,.10);border-color:rgba(43,182,115,.30);color:#15803d}\n[data-theme=\"light\"] .live:hover{background:rgba(43,182,115,.16)}\n[data-theme=\"light\"] .live.off{background:rgba(100,116,139,.08);border-color:rgba(100,116,139,.28);color:#64748b}\n[data-theme=\"light\"] .live.off .dot{background:#94a3b8}\n[data-theme=\"light\"] .live.err{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30);color:#dc2626}\n[data-theme=\"light\"] .live.err .dot{background:#dc2626;box-shadow:0 0 8px rgba(239,68,68,.5)}\n[data-theme=\"light\"] .live.syn{background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.34);color:#b45309}\n[data-theme=\"light\"] .live.syn .dot{background:#eab308;box-shadow:0 0 8px rgba(234,179,8,.5)}\n\n/* Modal & inputs */\n[data-theme=\"light\"] .mdl{background:#ffffff;box-shadow:var(--sh-lg)}\n[data-theme=\"light\"] .mdl input[type=\"text\"],[data-theme=\"light\"] .mdl input[type=\"url\"]{background:#f3f6fa;color:var(--tx)}\n[data-theme=\"light\"] .mdl .x:hover{background:rgba(15,36,56,.06)}\n[data-theme=\"light\"] .steps{background:#f3f6fa}\n[data-theme=\"light\"] .steps code{background:rgba(43,182,115,.12);color:#15803d}\n[data-theme=\"light\"] .mdl .stat.ok{color:#15803d}[data-theme=\"light\"] .mdl .stat.bad{color:#dc2626}\n\n/* Diagnostic panel */\n[data-theme=\"light\"] .diag{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.22);border-left-color:#ef4444}\n[data-theme=\"light\"] .diag-ttl{color:#dc2626}\n[data-theme=\"light\"] .diag-row code{background:#eef2f7;color:#334155}\n[data-theme=\"light\"] .diag-hint{background:rgba(234,179,8,.10);border-color:rgba(234,179,8,.30);color:#b45309}\n[data-theme=\"light\"] .diag-hint b{color:#92400e}\n\n/* Filter / advanced / per-tab filter bars — frosted light surfaces */\n[data-theme=\"light\"] .filt{background:rgba(255,255,255,.7)}\n[data-theme=\"light\"] .adv-filt{background:rgba(255,255,255,.7)}\n[data-theme=\"light\"] .tab-filter{background:rgba(255,255,255,.7)}\n\n/* Source banner — light gradient per state */\n[data-theme=\"light\"] .src-bnr{background:linear-gradient(135deg, rgba(0,147,213,.06), #ffffff)}\n[data-theme=\"light\"] .src-bnr.syn{background:linear-gradient(135deg, rgba(234,179,8,.10), #ffffff);border-color:rgba(234,179,8,.32)}\n[data-theme=\"light\"] .src-bnr.err{background:linear-gradient(135deg, rgba(239,68,68,.10), #ffffff);border-color:rgba(239,68,68,.32)}\n[data-theme=\"light\"] .src-bnr.ok{background:linear-gradient(135deg, rgba(43,182,115,.10), #ffffff);border-color:rgba(43,182,115,.32)}\n\n/* Multi-select chips & popup */\n[data-theme=\"light\"] .msel{background:#f3f6fa}\n[data-theme=\"light\"] .msel:hover{background:#e9eef4}\n[data-theme=\"light\"] .msel .cnt{background:rgba(43,182,115,.16);color:#15803d}\n[data-theme=\"light\"] .msel-pop{background:#ffffff;box-shadow:var(--sh-lg)}\n[data-theme=\"light\"] .msel-opt{color:var(--tx)}\n[data-theme=\"light\"] .msel-opt:hover{background:rgba(0,147,213,.08);color:var(--hl)}\n\n/* Hover overlays — white-on-white is invisible, so use subtle dark */\n[data-theme=\"light\"] .vb:hover{background:rgba(15,36,56,.05)}\n[data-theme=\"light\"] .seg:hover{background:rgba(15,36,56,.04)}\n\n/* Card top highlight line — subtle dark instead of white */\n[data-theme=\"light\"] .cc::before{background:linear-gradient(90deg, transparent, rgba(15,36,56,.07), transparent)}\n\n/* Drill-down bar */\n[data-theme=\"light\"] .drill-bar{background:linear-gradient(135deg, rgba(0,147,213,.08), rgba(43,182,115,.06))}\n[data-theme=\"light\"] .drill-chip{background:rgba(0,147,213,.10);border-color:rgba(0,147,213,.30)}\n[data-theme=\"light\"] .drill-x{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.34);color:#dc2626}\n[data-theme=\"light\"] .drill-x:hover{background:rgba(239,68,68,.18);color:#dc2626}\n\n/* Per-tab indicator chips + popup */\n[data-theme=\"light\"] .ind-chip{background:#f3f6fa;color:#334155}\n[data-theme=\"light\"] .ind-chip:hover{color:#0f2438}\n[data-theme=\"light\"] .ind-chip.active{color:#0f2438;background:rgba(43,182,115,.10)}\n[data-theme=\"light\"] .ind-chip .cnt{background:rgba(43,182,115,.16);color:#15803d}\n[data-theme=\"light\"] .ind-chip.active .cnt{background:#2bb673;color:#ffffff}\n[data-theme=\"light\"] .ind-chip-pop{background:#ffffff;box-shadow:var(--sh-lg)}\n[data-theme=\"light\"] .ind-opt{color:#334155}\n[data-theme=\"light\"] .ind-opt:hover{background:rgba(15,36,56,.04);color:#0f2438}\n[data-theme=\"light\"] .ind-opt-grp{color:#64748b}\n[data-theme=\"light\"] .ind-opt-grp:hover{background:rgba(15,36,56,.04);color:#334155}\n[data-theme=\"light\"] .ic-all{color:#15803d}\n[data-theme=\"light\"] .ic-all:hover{color:#0f2438}\n[data-theme=\"light\"] .btn-tf{background:rgba(239,68,68,.10);color:#dc2626;border-color:rgba(239,68,68,.32)}\n[data-theme=\"light\"] .btn-tf:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5)}\n\n/* Pie legend list */\n[data-theme=\"light\"] .plg-grp{border-left-color:rgba(15,36,56,.10)}\n[data-theme=\"light\"] .plg-grp-h{color:#64748b}\n[data-theme=\"light\"] .plg-grp li{color:#334155}\n[data-theme=\"light\"] .plg-grp li .vl{color:#94a3b8}\n[data-theme=\"light\"] .plg-grp li.lk:hover{background:rgba(15,36,56,.04);color:#0f2438}\n[data-theme=\"light\"] .plg-grp li .dot{box-shadow:0 0 0 1px rgba(15,36,56,.12)}\n[data-theme=\"light\"] .plg-total-row{color:#334155}\n[data-theme=\"light\"] .plg-total-row.lk:hover{background:rgba(15,36,56,.04);color:#0f2438}\n\n/* Clear-filter button */\n[data-theme=\"light\"] .fbtn-clr:hover{color:#dc2626;background:rgba(239,68,68,.08)}\n\n/* Date pickers — light fill + native light controls */\n[data-theme=\"light\"] .filt input[type=\"date\"]{background:#f3f6fa;color-scheme:light}\n[data-theme=\"light\"] .filt input[type=\"date\"]:hover,[data-theme=\"light\"] .filt input[type=\"date\"]:focus{background:#fff}\n\n/* Table */\n[data-theme=\"light\"] th{background:#f1f5f9;color:#475569}\n[data-theme=\"light\"] tr:hover td{background:rgba(0,147,213,.04)}\n\n/* Status badges — darker text for contrast on white */\n[data-theme=\"light\"] .br{background:rgba(239,68,68,.10);color:#dc2626;border-color:rgba(239,68,68,.32)}\n[data-theme=\"light\"] .bgn{background:rgba(43,182,115,.12);color:#15803d;border-color:rgba(43,182,115,.34)}\n[data-theme=\"light\"] .by{background:rgba(234,179,8,.14);color:#b45309;border-color:rgba(234,179,8,.38)}\n[data-theme=\"light\"] .bgr{background:rgba(100,116,139,.10);color:#475569;border-color:rgba(100,116,139,.28)}\n\n/* Theme-toggle button (sun/moon) — sits in the header next to the sync pill */\n.theme-tgl{\n  display:inline-flex;align-items:center;justify-content:center;\n  width:38px;height:38px;flex-shrink:0;\n  border-radius:50%;cursor:pointer;font-size:1.05rem;line-height:1;\n  background:var(--sf2);border:1px solid var(--bd2);color:var(--hl);\n  transition:.18s;font-family:inherit;\n}\n.theme-tgl:hover{transform:translateY(-1px);border-color:var(--who);box-shadow:var(--sh)}\n.theme-tgl .moon{display:none}\n.theme-tgl .sun{display:inline}\n[data-theme=\"light\"] .theme-tgl .sun{display:none}\n[data-theme=\"light\"] .theme-tgl .moon{display:inline}\n@media(max-width:700px){.theme-tgl{width:34px;height:34px;font-size:.95rem}}\n<\/style>\n<\/head>\n<body>\n\n<!-- ═════════════ HEADER ═════════════ -->\n<div class=\"hdr\">\n  <div class=\"filt\">\n    <div class=\"filt-grp\">\n      <label>📅 From<\/label>\n      <input type=\"date\" id=\"dF\" value=\"2025-08-01\">\n      <span class=\"arrow\">→<\/span>\n      <label>To<\/label>\n      <input type=\"date\" id=\"dT\" value=\"2026-02-01\">\n    <\/div>\n    <div class=\"filt-grp\">\n      <button class=\"btn\" onclick=\"aD(true)\">Apply<\/button>\n      <button class=\"btn btn-out\" onclick=\"rD()\">Reset<\/button>\n      <button class=\"btn btn-out\" onclick=\"syncSheet()\" title=\"Refresh from Google Sheet\">⟳ Sync<\/button>\n    <\/div>\n    <div class=\"filt-grp\" style=\"margin-left:auto;transform:scale(.85);transform-origin:right center\">\n      <button class=\"theme-tgl\" id=\"themeBtn\" onclick=\"toggleTheme()\" title=\"Switch light / dark theme\" aria-label=\"Switch light or dark theme\"><span class=\"sun\">☀️<\/span><span class=\"moon\">🌙<\/span><\/button>\n      <button class=\"live off\" id=\"syncBtn\" onclick=\"openCfg()\" title=\"Connect Google Sheet\"><span class=\"dot\"><\/span><span id=\"syncTxt\">Connect Sheet<\/span><\/button>\n    <\/div>\n  <\/div>\n  <!-- Top chip filter removed in v2 — replaced by per-tab dual indicator dropdowns below -->\n  <div class=\"adv-filt\" id=\"advFilt\" style=\"display:none\"><button class=\"fbtn-clr hide\" id=\"fbtnClr\" onclick=\"clearFilters()\">✕ Clear All<\/button><\/div>\n<\/div>\n\n<div class=\"main\">\n\n  <h2 class=\"s-ttl\">Patient Feedback Overview<\/h2>\n  <div class=\"s-sub\">Live dashboard tracking patient feedback across Kiribati. Filter by date, demographics, facility or category to surface actionable insights for safer care. <b style=\"color:var(--hl)\">💡 Tip:<\/b> click any bar segment in the charts below to drill down into matching cases.<\/div>\n\n  <!-- Drill-down chip bar — appears after clicking any chart segment -->\n  <div class=\"drill-bar\" id=\"drillBar\" style=\"display:none\"><\/div>\n  <div id=\"syncWarn\" style=\"display:none;margin:0 0 14px;padding:14px 18px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.30);border-radius:10px;font-family:'Open Sans',sans-serif;font-size:.82rem;color:#dc2626;line-height:1.55\"><\/div>\n\n  <!-- ═════════════ KPIs ═════════════ -->\n  <div class=\"kpis\">\n    <div class=\"kpi bl\"><div class=\"ic\">📊<\/div><div class=\"v\" id=\"k1\">0<\/div><div class=\"l\"># of Total Cases<\/div><\/div>\n    <div class=\"kpi rd\"><div class=\"ic\">⚠<\/div><div class=\"v\" id=\"k2\">0<\/div><div class=\"l\"># of Complaints<\/div><\/div>\n    <div class=\"kpi pu\"><div class=\"ic\">★<\/div><div class=\"v\" id=\"k3\">0<\/div><div class=\"l\"># of Compliments<\/div><\/div>\n    <div class=\"kpi gn\"><div class=\"ic\">✓<\/div><div class=\"v\" id=\"k7\">0<\/div><div class=\"l\"># of Cases Closed<\/div><\/div>\n    <div class=\"kpi in\" title=\"Median over closed cases that have a recorded closing duration (số ngày ở giữa, ít bị ảnh hưởng bởi ca cá biệt)\"><div class=\"ic\">⏱<\/div><div class=\"v\" id=\"k4\">—<\/div><div class=\"l\">Median Days to Close<\/div><\/div>\n    <div class=\"kpi or\"><div class=\"ic\">⏳<\/div><div class=\"v\" id=\"k5\">0<\/div><div class=\"l\"># of Pending at MHMS<\/div><\/div>\n    <div class=\"kpi cy\"><div class=\"ic\">⌂<\/div><div class=\"v\" id=\"k6\">0<\/div><div class=\"l\"># of Pending at K-PaF Office<\/div><\/div>\n  <\/div>\n\n  <!-- ═════════════ NAV ═════════════ -->\n  <div class=\"nav\">\n    <button class=\"vb\" data-v=\"cat\" onclick=\"sw('cat')\"><span class=\"i\">📋<\/span>Category<\/button>\n    <button class=\"vb\" data-v=\"fac\" onclick=\"sw('fac')\"><span class=\"i\">🏨<\/span>Facility<\/button>\n    <button class=\"vb\" data-v=\"sg\" onclick=\"sw('sg')\"><span class=\"i\">👥<\/span>Service Group<\/button>\n    <button class=\"vb\" data-v=\"pj\" onclick=\"sw('pj')\"><span class=\"i\">🔄<\/span>Patient Journey<\/button>\n    <button class=\"vb vb-back\" id=\"backOv\" onclick=\"sw('ov')\" style=\"display:none\">← Back to the Front Page<\/button>\n  <\/div>\n\n  <!-- ═════════════ OVERVIEW ═════════════ -->\n  <div class=\"pn sh\" id=\"p-ov\">\n    <div class=\"cr s1\"><div class=\"cc\">\n      <h3>Feedback Type Breakdown<span class=\"sub\">All records · Complaint / Compliment / Other — n (%) · click a slice to drill<\/span><\/h3>\n      <div class=\"cb h250\"><canvas id=\"c_type\"><\/canvas><\/div>\n      <div id=\"typeStat\" style=\"text-align:center;margin-top:12px;font-family:'Open Sans',sans-serif;font-size:.95rem;color:var(--hl);font-weight:600;line-height:1.6\"><\/div>\n    <\/div><\/div>\n    <div class=\"cr s1\"><div class=\"note-band\">\n      <span class=\"note-ic\">ℹ️<\/span>\n      <span><b>Note:<\/b> Every chart and figure below uses <b>complaint cases only<\/b> as the denominator. Compliments and other feedback types are excluded from the analyses that follow. <b>Category<\/b>, <b>Service Group<\/b> and <b>Patient Journey<\/b> can have more than one value per case, so their percentages are shares of <b>total mentions<\/b> and may add up to more than the number of cases. Charts based on a small number of cases (low n) should be read with caution.<\/span>\n    <\/div><\/div>\n    <div class=\"cr s1\"><div class=\"cc\">\n      <h3><span class=\"i\">📈<\/span>Total Cases per Month<span class=\"sub\">Monthly Trend<\/span><\/h3>\n      <div class=\"cb h380\"><canvas id=\"c_ov\"><\/canvas><\/div>\n    <\/div><\/div>\n    <div class=\"cr s4\">\n      <div class=\"cc\">\n        <h3><span class=\"i\">📋<\/span>Percentage by Category<span class=\"sub\">pie · click to drill<\/span><\/h3>\n        <div class=\"cb h380\"><canvas id=\"c_ov_cat\"><\/canvas><\/div>\n        <div class=\"plg\" id=\"leg_c_ov_cat\"><\/div>\n      <\/div>\n      <div class=\"cc\">\n        <h3><span class=\"i\">🏨<\/span>Percentage by Facility<span class=\"sub\">pie · click to drill<\/span><\/h3>\n        <div class=\"cb h380\"><canvas id=\"c_ov_fac\"><\/canvas><\/div>\n        <div class=\"plg\" id=\"leg_c_ov_fac\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cr s4\">\n      <div class=\"cc\">\n        <h3><span class=\"i\">👥<\/span>Percentage by Service Group<span class=\"sub\">pie · click to drill<\/span><\/h3>\n        <div class=\"cb h380\"><canvas id=\"c_ov_sg\"><\/canvas><\/div>\n        <div class=\"plg\" id=\"leg_c_ov_sg\"><\/div>\n      <\/div>\n      <div class=\"cc\">\n        <h3><span class=\"i\">🔄<\/span>Percentage by Patient Journey<span class=\"sub\">pie · click to drill<\/span><\/h3>\n        <div class=\"cb h380\"><canvas id=\"c_ov_pj\"><\/canvas><\/div>\n        <div class=\"plg\" id=\"leg_c_ov_pj\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cr s4\">\n      <div class=\"cc\">\n        <h3><span class=\"i\">🚪<\/span>Outpatient

applyChartTheme(){\n  const t=TH();\n  Chart.defaults.color=t.font;\n  Chart.defaults.borderColor=t.cborder;\n  GRID={color:t.grid,drawBorder:false};\n  AXIS={ticks:{color:t.tick,font:{size:10.5,weight:'600'}},grid:GRID};\n  TT={\n    backgroundColor:t.ttBg,\n    titleColor:t.ttTitle,titleFont:{family:\"'Open Sans',sans-serif\",size:13,weight:'700'},\n    bodyColor:t.ttBody,bodyFont:{size:11.5,weight:'600'},\n    borderColor:t.ttBorder,borderWidth:1,\n    padding:11,cornerRadius:10,boxPadding:4,\n    titleMarginBottom:6,usePointStyle:true\n  };\n  const _m=document.querySelector('meta[name=\"theme-color\"]');if(_m)_m.content=t.meta;\n}\napplyChartTheme();\n\n/* Responsive helpers — viewport-aware label sizing for charts */\nconst isMobileVP=()=>window.matchMedia('(max-width: 700px)').matches;\nconst isTinyVP=()=>window.matchMedia('(max-width: 380px)').matches;\nconst lblSize=(base)=>isTinyVP()?Math.max(base-3.5,7):(isMobileVP()?Math.max(base-2,8):base);\nconst legendSize=(base)=>isMobileVP()?Math.max(base-1.5,9):base;\n\n/* ═════════════ STATE ═════════════ */\nlet R_LIVE=normalizeRecords([...R]);  // live data (replaced when sheet sync succeeds)\nlet D=[...R_LIVE],DALL=[...R_LIVE],ch={},cv='tbl';\nconst F={month:new Set(),fac:new Set(),cat:new Set(),sg:new Set(),pj:new Set(),g:new Set(),age:new Set(),rel:new Set(),io:new Set(),st:new Set(),followupRequested:new Set()};\n/* Indicator multi-select (tickmark) — checkboxes grouped by indicator column. Within a column\n   the checked values OR; across columns AND. Selection state syncs across every tab's chip. */\nconst INDICATOR_COLS=[\n  {k:'cat',label:'Complaint category',multi:true},\n  {k:'fac',label:'Facility'},\n  {k:'sg',label:'Service group',multi:true},\n  {k:'pj',label:'Patient journey',multi:true},\n  {k:'month',label:'Month/year',getValue:r=>mm(r.d),displayValue:v=>monthLabel(v)},\n  {k:'g',label:'Gender',displayValue:v=>({F:'Female',M:'Male'}[v]||v)},\n  {k:'age',label:'Age'},\n  {k:'rel',label:'Relationship'},\n  {k:'io',label:'In/outpatient'},\n  {k:'st',label:'Case status'},\n  {k:'followupRequested',label:'Request'}\n];\nconst indicatorChecks={};// {colKey: Set<value>}\nconst escAttr=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n/* Cache: distinct values per indicator column (computed from R_LIVE) */\nconst REQUEST_OPTIONS=['Action + Report back','Action but no report back','Feedback only','Undetermined'];\nfunction indVals(col){\n  const getter=col.getValue||(r=>r[col.k]);\n  if(col.k==='followupRequested'){\n    const extra=[...new Set(R_LIVE.map(r=>getter(r)).filter(v=>v&&v.toString().trim()&&!REQUEST_OPTIONS.includes(v.toString().trim())))];\n    return REQUEST_OPTIONS.concat(extra.sort());\n  }\n  return [...new Set(R_LIVE.flatMap(r=>col.k==='cat'?splitCat(getter(r)):(col.multi?splitMulti(getter(r)):[getter(r)])).filter(v=>v&&v.toString().trim()))].sort();\n}\n/* Build the row of chips (one per indicator column + \"All\" toggle) inside an .ind-chips host */\nfunction buildIndChips(host){\n  let html=`<button class=\"ind-chip ic-all\" onclick=\"toggleIndAllChips(event,this)\" title=\"Select / deselect all indicators\">All<\/button>`;\n  INDICATOR_COLS.forEach(col=>{\n    const vals=indVals(col);if(!vals.length)return;\n    const checked=indicatorChecks[col.k]?indicatorChecks[col.k].size:0;\n    const activeCls=checked>0?' active':'';\n    html+=`<div class=\"ind-chip${activeCls}\" data-col=\"${escAttr(col.k)}\" onclick=\"toggleIndChip(event,this)\">`+\n          `${escAttr(col.label)}`+\n          `<span class=\"cnt\">${checked}<\/span><span class=\"car\">▾<\/span>`+\n          `<div class=\"ind-chip-pop\" onclick=\"event.stopPropagation()\"><\/div><\/div>`;\n  });\n  host.innerHTML=html;\n}\n/* Fill a chip's popup with checkboxes for that one column only */\nfunction buildChipPop(chip){\n  const k=chip.dataset.col,col=INDICATOR_COLS.find(c=>c.k===k);if(!col)return;\n  const pop=chip.querySelector('.ind-chip-pop');if(!pop)return;\n  const vals=indVals(col),setRef=indicatorChecks[k]||new Set();\n  let html=`<label class=\"ind-opt ind-opt-grp\"><input type=\"checkbox\" data-grp=\"${escAttr(k)}\" onchange=\"toggleIndGroup(this)\"><span>All ${escAttr(col.label)}<\/span><\/label>`;\n  vals.forEach(v=>{\n    const checked=setRef.has(v)?' checked':'';\n    const dv=col.displayValue?col.displayValue(v):v;\n    html+=`<label class=\"ind-opt\"><input type=\"checkbox\" data-k=\"${escAttr(k)}\" value=\"${escAttr(v)}\" onchange=\"toggleIndCheck(this)\"${checked}><span>${escAttr(dv)}<\/span><\/label>`;\n  });\n  pop.innerHTML=html;\n  const grpCb=pop.querySelector('.ind-opt-grp input');\n  if(grpCb){const c=setRef.size,t=vals.length;grpCb.checked=c===t&&t>0;grpCb.indeterminate=c>0&&c<t}\n}\nfunction toggleIndChip(e,chip){\n  e.stopPropagation();\n  document.querySelectorAll('.ind-chip.open').forEach(c=>{if(c!==chip)c.classList.remove('open')});\n  if(!chip.classList.contains('open'))buildChipPop(chip);\n  chip.classList.toggle('open');\n}\nfunction toggleIndCheck(cb){\n  const k=cb.dataset.k,v=cb.value;\n  if(!indicatorChecks[k])indicatorChecks[k]=new Set();\n  if(cb.checked)indicatorChecks[k].add(v);else indicatorChecks[k].delete(v);\n  if(!indicatorChecks[k].size)delete indicatorChecks[k];\n  // Refresh the \"All <col>\" header inside the open popup\n  const pop=cb.closest('.ind-chip-pop');\n  if(pop){const col=INDICATOR_COLS.find(c=>c.k===k),vals=col?indVals(col):[];\n    const grpCb=pop.querySelector('.ind-opt-grp input');\n    if(grpCb){const c=indicatorChecks[k]?indicatorChecks[k].size:0,t=vals.length;\n      grpCb.checked=c===t&&t>0;grpCb.indeterminate=c>0&&c<t}}\n  updateIndCounts();\n  rc();\n}\n/* Tick \"All <col>\" → check all values in that column; untick → clear */\nfunction toggleIndGroup(cb){\n  const k=cb.dataset.grp,col=INDICATOR_COLS.find(c=>c.k===k);if(!col)return;\n  if(cb.checked)indicatorChecks[k]=new Set(indVals(col));\n  else delete indicatorChecks[k];\n  // Rebuild the popup so sub-checkboxes reflect new state\n  const chip=cb.closest('.ind-chip');if(chip)buildChipPop(chip);\n  updateIndCounts();\n  rc();\n}\n/* \"✓ All\" chip — toggle: if anything checked, clear; otherwise select every value */\nfunction toggleIndAllChips(e,btn){\n  e.stopPropagation();\n  const any=Object.values(indicatorChecks).some(s=>s.size>0);\n  if(any){Object.keys(indicatorChecks).forEach(k=>delete indicatorChecks[k])}\n  else{INDICATOR_COLS.forEach(col=>{const v=indVals(col);if(v.length)indicatorChecks[col.k]=new Set(v)})}\n  document.querySelectorAll('.ind-chip.open').forEach(c=>c.classList.remove('open'));\n  document.querySelectorAll('.ind-chips').forEach(buildIndChips);\n  rc();\n}\n/* Sync each chip's count badge + active class across every tab */\nfunction updateIndCounts(){\n  document.querySelectorAll('.ind-chip[data-col]').forEach(chip=>{\n    const k=chip.dataset.col;\n    const c=indicatorChecks[k]?indicatorChecks[k].size:0;\n    const badge=chip.querySelector('.cnt');if(badge)badge.textContent=c;\n    chip.classList.toggle('active',c>0);\n  });\n}\nfunction clearIndicatorFilters(){\n  Object.keys(indicatorChecks).forEach(k=>delete indicatorChecks[k]);\n  document.querySelectorAll('.ind-chip.open').forEach(c=>c.classList.remove('open'));\n  document.querySelectorAll('.ind-chips').forEach(buildIndChips);\n  rc();\n}\n/* Init / refresh: called from DOMContentLoaded and after sheet sync */\nfunction populateTabFilters(){document.querySelectorAll('.ind-chips').forEach(buildIndChips)}\n/* Close any open chip popup on outside click */\ndocument.addEventListener('click',e=>{if(!e.target.closest('.ind-chip'))document.querySelectorAll('.ind-chip.open').forEach(c=>c.classList.remove('open'))});\nconst FK=[\n  {k:'month',label:'Month/Year',ic:'📅',getValue:r=>mm(r.d),displayValue:v=>monthLabel(v)},\n  {k:'fac',label:'Facility',ic:'🏨'},\n  {k:'cat',label:'Complaint Category',ic:'📋',multi:true},\n  {k:'sg',label:'Service Group',ic:'👥',multi:true},\n  {k:'pj',label:'Patient Journey',ic:'🔄',multi:true},\n  {k:'g',label:'Gender',ic:'⚧'},\n  {k:'age',label:'Age',ic:'🎂'},\n  {k:'rel',label:'Relationship',ic:'🤝'},\n  {k:'io',label:'In/Outpatient',ic:'🛏'},\n  {k:'st',label:'Case Status',ic:'📊'},\n  {k:'followupRequested',label:'Request',ic:'📨'}\n];\n/* Drill-down state — set when user clicks a chart segment. null = no drill. */\nlet DRILL=null;\n/* Remember the chart tab the user came from so Clear can return them there */\nlet DRILL_PREV_TAB=null;\n/* true once the user has pinned a date window (Apply). Keeps auto-sync from snapping\n   them back to the full data range every 60s — Reset clears it back to auto-expand. */\nlet userSetRange=false;\nlet SYNC_TIMER=null,LAST_SYNC=null;\nconst CFG_KEY='kpaf_sheet_cfg_v3';\nconst CACHE_KEY='kpaf_data_cache_v1';\n/* Cache bản sync gần nhất (chỉ trường phân tích — KHÔNG lưu định danh/ô nhạy như tên, SĐT, email,\n   chi tiết, summary) để lần mở sau vẽ NGAY, không phải chờ ~5s sync. Sync nền sẽ làm tươi + cập nhật cache. */\nconst CACHE_FIELDS=['n','d','g','age','fac','rel','io','cat','sg','pj','st','sev','mod','typ','followupRequested','statusAfter','followupEndDate','followupNotes'];\nfunction cacheData(cases){try{localStorage.setItem(CACHE_KEY,JSON.stringify(cases.map(r=>{const o={};CACHE_FIELDS.forEach(k=>o[k]=r[k]);return o})))}catch(e){}}\nconst AUTO_SEC=60;\n/* Optional Google Sheet source. Built-in data is generated from the latest workbook. */\nconst DEFAULT_DATA_URL='https://xspzasjievdxknjbwyzy.supabase.co';\n\n/* ═════════════ FOLLOW-UP (Case Register write-back) ═════════════\n   Cán bộ y tế nhập 3 trường follow-up cho từng case (khoá theo Case Number r.n):\n   Status after follow-up, Follow-up end date, Follow-up notes.\n   • Lưu localStorage NGAY (offline / file://).\n   • Ghi ngược lên Google Sheet qua Apps Script khi đã đặt Follow-up URL (Settings).\n   • Khi load/sync sẽ GET followups từ Sheet rồi gộp (updatedAt mới hơn thắng)\n     → chia sẻ giữa nhiều máy. Xem apps-script-followups.gs. */\nconst FU_KEY='kpaf_followups_v1';\nlet FU={};            // { [caseNumber]: {status,endDate,notes,dirty,submitted} }\nlet pidFilter='';     // bộ lọc Patient ID — CHỈ thu hẹp bảng\n/* Patient ID search shows ALL matching cases (any status, incl. Case Closed). */\n// \"Đã submit / done\" = Sheet ĐÃ CÓ Status after follow-up (nguồn sự thật từ doGet),\n// KHÔNG đọc localStorage theo số case (tránh sai khi số case bị tái dùng).\nconst isSubmitted=r=>!!(r&&r.statusAfter&&String(r.statusAfter).trim());\nfunction loadFU(){FU={};try{localStorage.removeItem(FU_KEY)}catch(e){}}// dọn dữ liệu localStorage cũ gây \"submitted\" sai\nfunction saveFULocal(){try{localStorage.setItem(FU_KEY,JSON.stringify(FU))}catch(e){}}\nfunction followupUrl(){const c=getCfg();return (c.followupUrl||c.url||DEFAULT_DATA_URL||'').trim()}\n/* Token đăng nhập do v10 shell cấp (server-side) — dùng chung sessionStorage cùng origin. Bắt buộc để GHI follow-up. */\nfunction authToken(){try{return sessionStorage.getItem('kpaf_v10_token')||''}catch(e){return''}}\nfunction onPidFilter(v){pidFilter=(v||'').trim().toLowerCase();if(cv==='tbl')rTbl()}\nfunction clearPidFilter(){const i=document.getElementById('pidSearch');if(i)i.value='';onPidFilter('')}\nfunction updateFuProgress(){const el=document.getElementById('fuProgress');if(!el)return;const m=R_LIVE.filter(isSubmitted).length;el.textContent=m?('✓ Submitted: '+m):''}\nfunction setRowSync(el,state,errMsg){\n  const tr=el&&el.closest&&el.closest('tr');if(!tr)return;\n  const dot=tr.querySelector('.fu-sync');if(!dot)return;\n  dot.className='fu-sync '+state;\n  const base={dirty:'Edited — click Submit to save to the Sheet',local:'Saved on this device (no Follow-up URL set)',saving:'Sending to the Sheet…',saved:'Saved to Google Sheet',err:'Failed to send to the Sheet — kept a local copy'};\n  dot.title=(base[state]||'')+(state==='err'&&errMsg?(' ('+errMsg+')'):'');\n}\n/* Sửa 1 ô → chỉ đánh dấu \"dirty\" (chưa Submit). Giá trị giữ ngay trong ô input, KHÔNG lưu localStorage. */\nfunction onFollowupEdit(el){setRowSync(el,'dirty');const tr=el&&el.closest&&el.closest('tr');const b=tr&&tr.querySelector('.fu-submit');if(b){b.classList.remove('fu-done');b.textContent='Submit';}}\n/* Bấm Submit → đọc 3 ô của dòng đó (DOM) rồi gửi lên Google Sheet (ghi cột AF/AG/AH).\n   POST \"simple request\" (body chuỗi, KHÔNG set Content-Type) để Apps Script không cần CORS preflight. */\nasync function submitFollowup(n,btn){\n  const tr=btn&&btn.closest&&btn.closest('tr');if(!tr)return;\n  const status=(tr.querySelector('.fu-sel')||{}).value||'';\n  const endDate=(tr.querySelector('.fu-date')||{}).value||'';\n  const notes=(tr.querySelector('.fu-note')||{}).value||'';\n  const url=followupUrl();\n  if(!url){setRowSync(btn,'local');return}\n  setRowSync(btn,'saving');\n\n  // CON ĐƯỜNG B: nếu nguồn là Supabase → gọi hàm RPC cap_nhat_followup_v2\n  // (cập nhật 3 cột follow-up cho ca theo ID — khóa chính, KHÔNG ghi nhầm ca).\n  if(/supabase\\.co/.test(url)){\n    const token=authToken();\n    if(!token){ setRowSync(btn,'err','Chưa đăng nhập — đăng nhập lại rồi Submit.'); return; }\n    // Lấy id (khóa chính) của ĐÚNG dòng này từ data-id. KHÔNG đoán theo dòng khác.\n    let caseId=tr.getAttribute('data-id');\n    if(caseId===null||caseId===''||isNaN(parseInt(caseId))){\n      setRowSync(btn,'err','Thiếu ID dòng này — hãy Sync lại (cần chạy SQL 03 trên Supabase trước).'); return;\n    }\n    try{\n      const res=await fetch(url.replace(/\\/$/,'')+'/rest/v1/rpc/cap_nhat_followup_v2',{\n        method:'POST',\n        headers:{\n          'apikey':(window.SUPABASE_ANON||'').trim(),\n          'Authorization':'Bearer '+token,\n          'Content-Type':'application/json'\n        },\n        body:JSON.stringify({\n          p_id:parseInt(caseId),\n          p_status_after:status||null,\n          p_end_date:endDate||null,\n          p_notes:notes||null\n        })\n      });\n      if(res.ok){\n        const rec=R_LIVE.find(x=>String(x.n)===String(n));\n        if(rec){rec.statusAfter=status;rec.followupEndDate=endDate;rec.followupNotes=notes;}\n        setRowSync(btn,'saved');updateFuProgress();\n        // KHÓA dòng này lại (mỗi ca độc lập). Admin có thể bấm Unlock để sửa.\n        khoaDongFollowup(tr,btn,true);\n      } else {\n        let detail='';try{const j=await res.json();detail=j.message||j.hint||'';}catch(_){}\n        if(res.status===401||res.status===403) setRowSync(btn,'err','Phiên hết hạn (HTTP '+res.status+') — đăng nhập lại.');\n        else setRowSync(btn,'err','Lỗi lưu (HTTP '+res.status+'). '+detail);\n      }\n    }catch(e){ setRowSync(btn,'err',e.message); }\n    return;\n  }\n\n  // (Nguồn cũ — Apps Script) giữ nguyên cách cũ\n  try{\n    const res=await fetch(url,{method:'POST',redirect:'follow',\n      body:JSON.stringify({action:'save',token:authToken(),caseNumber:String(n),status:status,endDate:endDate,notes:notes})});\n    let j=null;try{j=await res.json()}catch(_){}\n    // CHỈ coi thành công khi nhận đúng JSON {ok:true} từ doPost.\n    const ok=!!(j&&j.ok);\n    if(ok){\n      // Sheet is the source of truth -> reflect the saved follow-up on the in-memory record (shared with DALL).\n      const rec=R_LIVE.find(x=>String(x.n)===String(n));\n      if(rec){rec.statusAfter=status;rec.followupEndDate=endDate;}\n      // Keep the row visible (the table now shows all matches, incl. closed) and mark it saved.\n      setRowSync(btn,'saved');updateFuProgress();\n      // Show a read-only \"✓ Submitted\" in the Submit column so reviewers don't mistake it for un-submitted.\n      if(status){btn.classList.add('fu-done');btn.textContent='✓ Submitted';}\n    }\n    else{setRowSync(btn,'err',(j&&j.error)||('No valid response (HTTP '+res.status+') — did you add doPost & deploy a New version?'))}\n  }catch(e){setRowSync(btn,'err',e.message)}\n}\n\n/* Khóa/mở khóa các ô follow-up của MỘT dòng. lock=true → khóa (chỉ-đọc),\n   lock=false → mở để admin sửa. Mỗi ca độc lập (khóa theo từng dòng). */\nfunction khoaDongFollowup(tr,btn,lock){\n  if(!tr)return;\n  ['.fu-sel','.fu-date','.fu-note'].forEach(sel=>{\n    const el=tr.querySelector(sel); if(el) el.disabled=lock;\n  });\n  if(btn){\n    if(lock){ btn.classList.add('fu-done'); btn.textContent='✓ Submitted'; btn.disabled=true; }\n    else    { btn.classList.remove('fu-done'); btn.textContent='Submit'; btn.disabled=false; }\n  }\n  // Thêm/bỏ nút Unlock\n  const td=btn&&btn.closest&&btn.closest('td');\n  if(td){\n    let unlock=td.querySelector('.fu-unlock');\n    if(lock && !unlock){\n      const cn=tr.getAttribute('data-cn')||'';\n      unlock=document.createElement('button');\n      unlock.className='fu-unlock'; unlock.textContent='🔓 Unlock';\n      unlock.title='Admin: mở khóa để sửa';\n      unlock.onclick=function(){ unlockFollowup(cn,this); };\n      btn.insertAdjacentElement('afterend',unlock);\n    } else if(!lock && unlock){\n      unlock.remove();\n    }\n  }\n}\n\n/* Admin mở khóa một ca để sửa lại follow-up. */\nfunction unlockFollowup(n,unlockBtn){\n  const tr=unlockBtn&&unlockBtn.closest&&unlockBtn.closest('tr');\n  if(!tr)return;\n  if(!confirm('Mở khóa ca '+n+' để sửa follow-up? (Chỉ dành cho admin)')) return;\n  const submitBtn=tr.querySelector('.fu-submit');\n  khoaDongFollowup(tr,submitBtn,false);\n}\n\n/* Bấm Print → gửi Case Number lên Apps Script (action:'printPdf'). Server tạo PDF từ Doc\n   template rồi trả về base64 → trình duyệt dựng lại file và TẢI THẲNG về máy cán bộ\n   (không lưu Drive, không cần chia sẻ link). Phản hồi hiện trực tiếp trên nút Print. */\nasync function printCase(n,btn){\n  if(!btn)return;\n  // In PDF NGAY trong trinh duyet, theo mau template PATIENT FEEDBACK RECORD.\n  const rec=R_LIVE.find(x=>String(x.n)===String(n));\n  if(!rec){ alert('Khong tim thay du lieu ca '+n+' - hay Sync roi thu lai.'); return; }\n  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\n  const v=x=>{ const t=(x==null?'':String(x)).trim(); return t===''?'\\u2014':esc(t); };\n  const fmtD=x=>{ const t=(x==null?'':String(x)).trim(); if(!t)return '\\u2014';\n    const m=t.match(/^(\\d{4})-(\\d{2})-(\\d{2})/); return m?(m[3]+'/'+m[2]+'/'+m[1]):esc(t); };\n  const who=(typeof authedUser==='function'?authedUser():'')||(sessionStorage.getItem('kpaf_v10_auth')||'');\n  const nowStr=(function(){const d=new Date();const p2=x=>String(x).padStart(2,'0');\n    return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());})();\n\n  // 2 o tren cung 1 hang\n  const cell=(lab,val)=>`<td class=\"lab\">${esc(lab)}<\/td><td class=\"val\">${val}<\/td>`;\n  // 1 o trai dai het hang (label + value bên dưới, cho cac truong dai)\n  const wide=(lab,val)=>`<tr><td class=\"lab\">${esc(lab)}<\/td><\/tr><tr><td class=\"val wide\" colspan=\"4\">${val}<\/td><\/tr>`;\n\n  const html=\n'<!doctype html><html><head><meta charset=\"utf-8\"><title>Patient Feedback Record - Case '+esc(rec.n||n)+'<\/title><style>'+\n'*{box-sizing:border-box;margin:0;padding:0}'+\n'body{font-family:Arial,Helvetica,sans-serif;color:#1a2533;font-size:11px;line-height:1.5;padding:28px 34px}'+\n'.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}'+\n'.top .org{display:flex;align-items:center;gap:9px;font-size:10px;color:#334155;font-weight:700}'+\n'.top .org .em{font-size:20px}'+\n'.hdr{display:flex;justify-content:space-between;align-items:flex-start;background:#0f5c6e;color:#fff;border-radius:5px;padding:15px 18px;margin-bottom:16px}'+\n'.hdr h1{font-size:17px;font-weight:800;letter-spacing:.3px}'+\n'.hdr .s{font-size:10px;opacity:.9;margin-top:3px;font-weight:400}'+\n'.hdr .meta{text-align:right;font-size:9px;line-height:1.7}'+\n'.hdr .meta .k{opacity:.8}'+\n'.hdr .meta .b{font-size:15px;font-weight:800;display:block}'+\n'.sec{background:#0f7a6e;color:#fff;font-size:10.5px;font-weight:700;padding:6px 11px;border-radius:4px;margin:14px 0 8px;letter-spacing:.3px}'+\n'table{width:100%;border-collapse:collapse;table-layout:fixed}'+\n'td{border:1px solid #e2e8f0;padding:7px 10px;vertical-align:top;word-wrap:break-word}'+\n'td.lab{background:#f1f5f8;font-weight:700;color:#334155;width:23%}'+\n'td.val{color:#155e75;width:27%}'+\n'td.val.wide{width:100%;color:#1a2533;white-space:pre-wrap}'+\n'.foot{margin-top:20px;padding-top:10px;border-top:2px solid #0f7a6e;font-size:8.5px;color:#64748b;line-height:1.6}'+\n'.foot b{color:#334155}'+\n'.pby{margin-top:8px;font-size:8.5px;color:#94a3b8}'+\n'@page{margin:1.2cm}'+\n'@media print{body{padding:0}}'+\n'<\/style><\/head><body>'+\n\n'<div class=\"top\">'+\n'<div class=\"org\"><img src=\"'+(window.LOGO_MOH||'')+'\" alt=\"Ministry of Health & Medical Services\" style=\"height:46px\"><\/div>'+\n'<div class=\"org\"><img src=\"'+(window.LOGO_WPRO||'')+'\" alt=\"WHO Western Pacific Region\" style=\"height:46px\"><\/div>'+\n'<\/div>'+\n\n'<div class=\"hdr\"><div><h1>PATIENT FEEDBACK RECORD<\/h1>'+\n'<div class=\"s\">Kiribati Ministry of Health &amp; Medical Services \\u00b7 K-PaF Patient Safety<\/div><\/div>'+\n'<div class=\"meta\"><span class=\"k\">Case No.<\/span><span class=\"b\">'+esc(rec.n||n)+'<\/span>'+\n'<span class=\"k\">Patient ID<\/span><span class=\"b\">'+v(rec.patientId)+'<\/span><\/div><\/div>'+\n\n'<div class=\"sec\">1 \\u00b7 Case Information<\/div>'+\n'<table><tr>'+cell('Receipt Date',fmtD(rec.d))+cell('Intake Officer',v(rec.officer))+'<\/tr>'+\n'<tr>'+cell('Feedback Modality',v(rec.mod))+'<td class=\"lab\"><\/td><td class=\"val\"><\/td><\/tr><\/table>'+\n\n'<div class=\"sec\">2 \\u00b7 Patient Information<\/div>'+\n'<table><tr>'+cell('Sex',v(rec.g))+cell('Age Category',v(rec.age))+'<\/tr>'+\n'<tr>'+cell('Phone',v(rec.phone))+cell('Email',v(rec.email))+'<\/tr>'+\n'<tr>'+cell('Relationship to Patient',v(rec.rel))+'<td class=\"lab\"><\/td><td class=\"val\"><\/td><\/tr>'+\n'<tr>'+cell('Address',v(rec.address))+'<td class=\"lab\"><\/td><td class=\"val\"><\/td><\/tr><\/table>'+\n\n'<div class=\"sec\">3 \\u00b7 Facility &amp; Visit<\/div>'+\n'<table><tr>'+cell('Concerned Facility',v(rec.fac))+cell('Inpatient / Outpatient',v(rec.io))+'<\/tr>'+\n'<tr>'+cell('Area of Facility',v(rec.area))+'<td class=\"lab\"><\/td><td class=\"val\"><\/td><\/tr><\/table>'+\n\n'<div class=\"sec\">4 \\u00b7 Feedback<\/div>'+\n'<table><tr>'+cell('Type',v(rec.typ))+'<td class=\"lab\"><\/td><td class=\"val\"><\/td><\/tr><\/table>'+\n'<table style=\"margin-top:-1px\"><tr><td class=\"lab\" colspan=\"4\">Complaint Details<\/td><\/tr>'+\n'<tr><td class=\"val wide\" colspan=\"4\">'+v(rec.details)+'<\/td><\/tr>'+\n'<tr><td class=\"lab\" colspan=\"4\">Complaint Summary \\u2014 to be shared with MHMS<\/td><\/tr>'+\n'<tr><td class=\"val wide\" colspan=\"4\">'+v(rec.summary)+'<\/td><\/tr><\/table>'+\n\n'<div class=\"sec\">5 \\u00b7 Classification<\/div>'+\n'<table><tr>'+cell('Case Categories',v(rec.cat))+cell('Complaints Group',v(rec.sg))+'<\/tr>'+\n'<tr>'+cell('Patient Journey',v(rec.pj))+'<td class=\"lab\"><\/td><td class=\"val\"><\/td><\/tr><\/table>'+\n\n'<div class=\"sec\">6 \\u00b7 Follow-up &amp; Resolution<\/div>'+\n'<table><tr>'+cell('Requested Follow-up',v(rec.followupRequested))+cell('Case Status',v(rec.st))+'<\/tr>'+\n'<tr>'+cell('Date Forwarded to PNO',fmtD(rec.dateForwardedPno))+cell('Date Closed',fmtD(rec.dateClosed))+'<\/tr>'+\n'<tr>'+cell('Handed over to',v(rec.handedOverTo))+cell('Duration to Case Closing',v(rec.dur))+'<\/tr>'+\n'<tr>'+cell('Status After Follow-up',v(rec.statusAfter))+cell('Follow-up End Date',fmtD(rec.followupEndDate))+'<\/tr>'+\n'<tr><td class=\"lab\" colspan=\"4\">Follow-up Notes<\/td><\/tr>'+\n'<tr><td class=\"val wide\" colspan=\"4\">'+v(rec.followupNotes)+'<\/td><\/tr><\/table>'+\n\n'<div class=\"foot\"><b>CONFIDENTIAL<\/b> \\u2014 This record contains patient feedback information and is intended for authorized Ministry of Health &amp; Medical Services staff only. Please review and validate the data. \\u00b7 Generated by the K-PaF Patient Feedback Dashboard.<\/div>'+\n'<div class=\"pby\">Printed by: '+esc(who||'\\u2014')+' \\u2022 '+nowStr+' \\u2022 CONFIDENTIAL<\/div>'+\n'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},250);};<\/scr'+'ipt>'+\n'<\/body><\/html>';\n\n  const w=window.open('','_blank');\n  if(!w){ alert('Trinh duyet chan cua so in. Hay cho phep pop-up cho trang nay roi thu lai.'); return; }\n  w.document.open(); w.document.write(html); w.document.close();\n  btn.textContent='\\u2713 Printed';\n  setTimeout(()=>{ if(btn) btn.textContent='Print'; }, 3000);\n}\n/* Nạp followups từ Sheet (cột AF/AG/AH) và gộp vào FU. Giữ bản local của case đang \"dirty\"\n   (đã sửa nhưng chưa Submit) để Sheet không ghi đè.\n   Đọc bằng POST {action:'list'} vì GET của web app đã dành cho doGet đọc data. */\nasync function fetchFollowups(){\n  const url=followupUrl();if(!url)return;\n  // CON ĐƯỜNG B: nếu nguồn là Supabase, dữ liệu follow-up đã nằm sẵn trong View\n  // v_dashboard (đọc qua fetchSupabase). KHÔNG POST {action:'list'} tới Supabase\n  // (sẽ ra URL trần → 404). Bỏ qua hàm này khi dùng Supabase.\n  if(/supabase\\.co/.test(url)) return;\n  try{\n    const res=await fetch(url,{method:'POST',redirect:'follow',body:JSON.stringify({action:'list',token:authToken()})});\n    const j=await res.json();\n    if(!j||!j.ok||!Array.isArray(j.followups))return;\n    let changed=false;\n    j.followups.forEach(f=>{\n      const k=String(f.caseNumber||'').trim();if(!k)return;\n      const cur=FU[k];\n      if(cur&&cur.dirty)return;// đang sửa dở, chưa Submit → giữ local\n      // Có dữ liệu trên Sheet = đã submit (bởi máy này hoặc máy khác) → ẩn khỏi hàng đợi\n      const next={status:f.status||'',endDate:f.endDate||'',notes:f.notes||'',submitted:true};\n      if(!cur||cur.status!==next.status||cur.endDate!==next.endDate||cur.notes!==next.notes||!cur.submitted)changed=true;\n      FU[k]=next;\n    });\n    if(changed){\n      saveFULocal();\n      const ae=document.activeElement;\n      const editing=ae&&ae.closest&&ae.closest('#tb');// đừng giật bảng khi đang gõ\n      if(cv==='tbl'&&!editing)rTbl();\n    }\n  }catch(e){/* offline / file:// / CORS → giữ bản localStorage */}\n}\n\n/* ═════════════ GOOGLE SHEET SYNC ═════════════ */\nconst CMAP={\n  ts:['Timestamp','ts_form','created_at'],\n  d:['1. Receipt Date','Receipt Date','Receipt Date (insert DD)','Receipt Date(insert DD)','Date','Receipt date','receipt_date'],\n  officer:['2. Intake Officer','Intake Officer','intake_officer'],\n  mod:['3. Modality','Modality','Initial Feedback Modality','Initial Feedback Modality(insert TT)','Initial Feedback Modality (insert TT)','Initial Modality','modality'],\n  caseId:['ID','id'],\n  n:['0. Case Number','Case Number','case number','#','No','no','case_number'],\n  patientId:['4. Patient ID','Patient ID','patient_id'],\n  g:[\"5. Patient's Sex\",\"Patient's Sex\",'Patient Sex','Gender of Patient','Gender','gender','Sex','patient_sex'],\n  age:[\"6. Patient's Age Category\",\"Patient's Age Category\",'Patient Age Category','Age category of Patient','Age category','Age','age','patient_age_cat'],\n  address:[\"7. Patient's Address\",\"Patient's Address\",'Patient Address','Residential Area(Village)','Residential Area','Address','patient_address'],\n  phone:['8. Phone','Phone'],\n  email:['9. Email','Email'],\n  rel:['10. Relationship to Patient','Relationship to Patient','Relationship to the patient','Relationship','relationship'],\n  fac:['11. Concerned Facility','Concerned Facility','Facility','facility'],\n  area:['12. Area of Facility','Area of Facility','Area of the Facility','facility_area'],\n  io:['13. Inpatient / Outpatient','Inpatient / Outpatient','Inpatient/Outpatient','In/Outpatient','I/O','in_outpatient'],\n  typ:['14. Complaint or Compliment','Complaint or Compliment','Feedback Type','Case Type','Type','Complaint/Compliment','case_type'],\n  details:['15. Complaint Details','Complaint Details','Feedback Details','Details','complaint_details'],\n  summary:['15-2 Complaint Summary - to be shared with MHMS','15-2 Complaint Summary','Complaint Summary - to be shared with MHMS','Complaint Summary','Summary','complaint_summary'],\n  cat:['16. Case Categories','Case Categories','Case Category','Category','category','case_category'],\n  sg:['17. Complaints Group','Complaints Group','Complaints to by group','Service Group','By group','Group','sg','complaints_group'],\n  pj:['18. Patient journey','Patient journey','Patient Journey','Stage of treatment(Patient Journey)','Stage of treatment (Patient Journey)','Stage of treatment','Journey','pj','patient_journey'],\n  followupRequested:['19. Requested Follow-up','Requested Follow-up','Requested Follow up','followup_requested'],\n  dateForwardedPno:['20. Date Forwarded to PNO','Date Forwarded to PNO','date_forwarded_pno'],\n  handedOverTo:['20-1 Handed over to','20-1. Handed over to','Handed over to','Handed Over To','handed_over_to'],\n  st:['21. Case Status','Case Status','Status','status','case_status'],\n  dateLastFollowUpPno:['22. Date of last follow up to PNO','Date of last follow up to PNO','Date of last follow-up to PNO','date_last_follow_up_pno'],\n  dateClosed:['23. Date Closed','Date Closed','date_closed'],\n  dur:['Duration to case closing','Duration to closing','Duration','duration_to_close'],\n  daysPending:['Days pending','days pending','days_pending'],\n  statusAfter:['24. Case status after follow-up','Case status after follow-up','Status after follow-up','status_after_fu','status_after_followup','status_after'],\n  followupEndDate:['25. Follow-up end date','Follow-up end date','followup_end_date','follow_up_end_date'],\n  followupNotes:['26. Follow-up notes','Follow-up notes','followup_notes','follow_up_notes']\n};\nconst CHECK_FIELDS=['d','g','age','fac','rel','io','cat','sg','pj','st','mod','typ'];\nconst norm=s=>(s||'').toString().trim().replace(/\\s+/g,' ').replace(/[\\n\\r]/g,' ');\n/* Header fuzzy match fallback: strip form numbering, parentheticals, and punctuation. */\nconst cleanHdr=s=>norm(s).toLowerCase()\n  .replace(/^\\s*\\d+\\s*[.)-]?\\s*/,'')\n  .replace(/\\([^)]*\\)/g,'')\n  .replace(/[\\'\"]/g,'')\n  .replace(/[-_/]/g,' ')\n  .replace(/[^a-z0-9 ]+/g,' ')\n  .replace(/\\s+/g,' ')\n  .trim();\nfunction findCol(headers,aliases){\n  const H=headers.map(h=>norm(h).toLowerCase());\n  // 1. Exact normalized match\n  for(const a of aliases){const i=H.indexOf(norm(a).toLowerCase());if(i>=0)return headers[i]}\n  // 2. Cleaned match. When multiple columns clean to the same string, prefer the shortest raw header.\n  const Hc=H.map(cleanHdr);\n  for(const a of aliases){\n    const ac=cleanHdr(a);if(!ac)continue;\n    const matches=[];for(let i=0;i<Hc.length;i++){if(Hc[i]===ac)matches.push(i)}\n    if(matches.length){matches.sort((x,y)=>(headers[x]||'').length-(headers[y]||'').length);return headers[matches[0]]}\n  }\n  // 3. Substring fallback - only for aliases with >=2 words AND >=8 chars.\n  for(const a of aliases){\n    const ac=cleanHdr(a);if(!ac||ac.length<8||ac.split(' ').length<2)continue;\n    for(let i=0;i<Hc.length;i++){\n      if(!Hc[i]||Hc[i].length<8||Hc[i].split(' ').length<2)continue;\n      if(Hc[i].includes(ac)||ac.includes(Hc[i]))return headers[i];\n    }\n  }\n  // 4. Token-based fallback - any distinctive >=6-char word from an alias.\n  const tokens=new Set();\n  aliases.forEach(a=>cleanHdr(a).split(' ').forEach(t=>{if(t.length>=6)tokens.add(t)}));\n  for(let i=0;i<Hc.length;i++){\n    if(!Hc[i])continue;\n    const words=new Set(Hc[i].split(' '));\n    for(const t of tokens){if(words.has(t))return headers[i]}\n  }\n  return null;\n}\nfunction parseDate(s){\n  if(!s)return'';\n  if(typeof s==='number'&&isFinite(s))return excelSerialDate(s);\n  s=s.toString().trim();\n  if(/^\\d{4,5}(\\.\\d+)?$/.test(s))return excelSerialDate(parseFloat(s));\n  if(/^\\d{4}-\\d{2}-\\d{2}/.test(s))return s.substring(0,10);\n  let m=s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{2,4})/);\n  if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}\n  m=s.match(/^(\\d{1,2})-([A-Za-z]{3})-(\\d{2,4})/);\n  if(m){const mn={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'}[m[2]];let y=m[3];if(y.length===2)y='20'+y;return mn?`${y}-${mn}-${m[1].padStart(2,'0')}`:s}\n  return s;\n}\nfunction excelSerialDate(n){\n  if(n<20000||n>80000)return'';\n  const d=new Date(Date.UTC(1899,11,30)+Math.round(n*86400000));\n  if(isNaN(d.getTime()))return'';\n  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;\n}\nfunction rowsToCases(rows,headers){\n  const col={};Object.keys(CMAP).forEach(k=>col[k]=findCol(headers,CMAP[k]));\n  if(!rows.length){\n    const banner=document.getElementById('syncWarn');\n    if(banner){banner.style.display='none';banner.innerHTML=''}\n    return [];\n  }\n  const checkFields=CHECK_FIELDS.filter(k=>Object.prototype.hasOwnProperty.call(CMAP,k));\n  const unmapped=checkFields.filter(k=>!col[k]);\n  if(unmapped.length){\n    console.warn('[Sync] Unmapped dashboard fields:',unmapped);\n    console.warn('[Sync] Available sheet headers:',headers);\n    console.warn('[Sync] Tried these aliases for unmapped fields:',Object.fromEntries(unmapped.map(k=>[k,CMAP[k]])));\n  }\n  console.info('[Sync] Field -> Header mapping:',col);\n  const sample={};checkFields.forEach(k=>{\n    if(!col[k]){sample[k]={status:'NOT FOUND',header:null,nonEmpty:0,total:rows.length};return}\n    const ne=rows.filter(r=>{const v=r[col[k]];return v!=null&&v.toString().trim()!==''}).length;\n    sample[k]={status:ne===0?'ALL EMPTY':'ok',header:col[k],nonEmpty:ne,total:rows.length};\n  });\n  console.info('[Sync] Column data check:',sample);\n  const probs=Object.entries(sample).filter(([k,s])=>s.status!=='ok');\n  const banner=document.getElementById('syncWarn');\n  if(banner){\n    if(probs.length){\n      const esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\n      const FIELD_LBL={d:'Date',g:'Gender',age:'Age',fac:'Facility',rel:'Relationship',io:'In/Outpatient',cat:'Category',sg:'Complaints Group',pj:'Patient Journey',st:'Status',mod:'Modality',typ:'Type'};\n      const rows=probs.map(([k,s])=>{\n        const lbl=FIELD_LBL[k]||k;\n        if(s.status==='NOT FOUND')return `<li><b>${lbl}<\/b> - no matching column. Tried aliases: <code>${esc(CMAP[k].join(' | '))}<\/code><\/li>`;\n        return `<li><b>${lbl}<\/b> - found column \"<code>${esc(s.header)}<\/code>\" but all ${s.total} values are empty<\/li>`;\n      }).join('');\n      banner.innerHTML=`<b>Sync issue detected<\/b> - some fields did not populate. Sheet headers found: <code>${esc(headers.filter(h=>h).join(' · '))}<\/code><ul style=\"margin:8px 0 0;padding-left:20px;color:#475569\">${rows}<\/ul>`;\n      banner.style.display='block';\n    }else{banner.style.display='none';banner.innerHTML=''}\n  }\n  const out=[];\n  rows.forEach((r,i)=>{\n    const get=k=>col[k]?norm(r[col[k]]):'';\n    const date=k=>parseDate(get(k));\n    const d=date('d'),cat=get('cat');\n    if(!d)return;// chỉ cần có ngày; KHÔNG loại record thiếu Category (vd compliment/other) để k1 đếm đủ\n    out.push({\n      caseId:(get('caseId')!==''?parseInt(get('caseId')):null),\n      n:get('n')||i+1,d:d,\n      g:get('g')||'Unknown',\n      age:get('age')||'Unknown',\n      fac:get('fac')||'Unknown',\n      rel:get('rel')||'Unknown',\n      io:get('io')||'Unknown',\n      cat:cat,\n      sg:get('sg')||'Not assigned',\n      pj:get('pj')||'Other',\n      st:get('st')||'Not assigned',\n      mod:get('mod')||'Unknown',\n      typ:get('typ')||'Unknown',\n      timestamp:get('ts'),\n      officer:get('officer'),\n      patientId:get('patientId'),\n      address:get('address'),\n      phone:get('phone'),\n      email:get('email'),\n      area:get('area'),\n      details:get('details'),\n      summary:get('summary'),\n      followupRequested:get('followupRequested'),\n      dateForwardedPno:date('dateForwardedPno'),\n      handedOverTo:get('handedOverTo'),\n      dateLastFollowUpPno:date('dateLastFollowUpPno'),\n      dateClosed:date('dateClosed'),\n      dur:get('dur'),\n      daysPending:get('daysPending'),\n      statusAfter:get('statusAfter'),\n      followupEndDate:date('followupEndDate'),\n      followupNotes:get('followupNotes')\n    });\n  });\n  return out;\n}\n\nfunction getCfg(){\n  try{\n    const c=JSON.parse(localStorage.getItem(CFG_KEY)||'{}');\n    // CON ĐƯỜNG B: luôn dùng Supabase làm nguồn dữ liệu, bỏ qua mọi URL Google cũ.\n    if(window.SUPABASE_URL){\n      c.url = window.SUPABASE_URL;          // ép nguồn đọc = Supabase\n      if(c.followupUrl && /script\\.google\\.com|docs\\.google\\.com/.test(c.followupUrl)) delete c.followupUrl;\n    }\n    return c;\n  }catch(e){\n    return window.SUPABASE_URL ? {url:window.SUPABASE_URL} : {};\n  }\n}\nfunction setCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c))}\n\nfunction setStat(state,txt){\n  const b=document.getElementById('syncBtn'),t=document.getElementById('syncTxt');\n  b.classList.remove('off','err','syn');\n  if(state)b.classList.add(state);\n  // Compact status text on mobile so the button stays tiny\n  if(isMobileVP()&&txt){\n    const m=txt.match(/(\\d+)\\s*records?/i);\n    if(m)txt=m[1];\n    else if(/^Connect/i.test(txt))txt='Connect';\n    else if(/^Sync|^Reconn/i.test(txt))txt='⟳';\n    else if(/fail/i.test(txt))txt='⚠';\n  }\n  t.textContent=txt;\n  b.title=document.getElementById('syncTxt').textContent;// preserve full info via tooltip\n}\n/* Source banner removed — stub kept so existing call sites are no-ops */\nfunction setSrcBnr(){}\nfunction fmtTime(){const d=new Date();return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}\nfunction timeAgo(t){if(!t)return'';const m=Math.floor((Date.now()-t)/60000);if(m<1)return'just now';if(m===1)return'1 min ago';if(m<60)return m+' min ago';const h=Math.floor(m/60);return h+'h ago'}\n\n/* Normalize any Google Sheets URL → CSV export URL.\n   Accepts: share URL (/edit), publish URL (/pub), or already-CSV URL. */\nfunction toCsvUrl(url){\n  if(!url)return'';\n  url=url.trim();\n  if(/output=csv|format=csv/i.test(url))return url;\n  // Share URL: /spreadsheets/d/{ID}/edit#gid=N or /edit?usp=sharing\n  let m=url.match(/\\/spreadsheets\\/d\\/([a-zA-Z0-9_-]+)/);\n  if(m){\n    const id=m[1];\n    const gm=url.match(/[#?&]gid=(\\d+)/);\n    const gid=gm?gm[1]:'0';\n    return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;\n  }\n  return url;\n}\n\n/* Dispatcher: detects URL type and uses the appropriate fetch path */\nasync function fetchSheet(url){\n  if(!url)throw new Error('No URL configured');\n  url=url.trim();\n  let cases;\n  if(/supabase\\.co/.test(url)){\n    cases=await fetchSupabase();\n  } else if(/script\\.google\\.com\\/macros\\//.test(url)){\n    cases=await fetchAppsScript(url+(url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(authToken()));\n  } else {\n    cases=await fetchCsv(toCsvUrl(url));\n  }\n  // Chuẩn hoá nhãn ngay tại cửa ngõ dữ liệu — áp dụng cho MỌI nguồn.\n  normalizeRecords(cases);\n  return cases;\n}\n\n/* ── Supabase: đọc View v_dashboard (đã đăng nhập), trả về mảng record\n   tên cột GIỐNG header gốc, rồi đưa qua rowsToCases() y như CSV. ── */\nfunction sbCfg(){\n  return {\n    url:  (window.SUPABASE_URL||'').trim(),\n    anon: (window.SUPABASE_ANON||'').trim(),\n    view: (window.SUPABASE_VIEW||'v_dashboard').trim()\n  };\n}\nasync function fetchSupabase(){\n  const c=sbCfg();\n  if(!c.url||!c.anon)throw new Error('Chưa cấu hình SUPABASE_URL / SUPABASE_ANON trong file.');\n  const token=authToken();\n  if(!token)throw new Error('Chưa đăng nhập — hãy đăng nhập để xem dữ liệu.');\n  const endpoint=c.url.replace(/\\/$/,'')+'/rest/v1/'+encodeURIComponent(c.view)+'?select=*';\n  let r;\n  try{\n    r=await fetch(endpoint,{headers:{apikey:c.anon,Authorization:'Bearer '+token},cache:'no-store'});\n  }catch(e){throw new Error('Lỗi mạng tới Supabase: '+(e.message||'fetch blocked'));}\n  if(!r.ok){\n    if(r.status===401||r.status===403)throw new Error('Bị từ chối (HTTP '+r.status+'): phiên đăng nhập hết hạn. Đăng nhập lại.');\n    throw new Error('HTTP '+r.status+' từ Supabase');\n  }\n  const rows=await r.json();\n  if(!Array.isArray(rows))throw new Error('Supabase trả về dữ liệu không hợp lệ');\n  const headers=rows.length?Object.keys(rows[0]):[];\n  const cases=rowsToCases(rows,headers);\n  if(!cases.length && rows.length)throw new Error('Đọc được dữ liệu nhưng tên cột không khớp — kiểm tra View v_dashboard.');\n  return cases;\n}\n\n/* JSON fetch — for Google Apps Script Web App endpoints (/exec) */\nasync function fetchAppsScript(url){\n  let r;\n  try{r=await fetch(url,{cache:'no-store',redirect:'follow'})}\n  catch(e){throw new Error('Network error: '+(e.message||'fetch blocked')+' — Apps Script may not be deployed with \"Anyone\" access, or browser blocking.')}\n  if(!r.ok){\n    if(r.status===401||r.status===403)throw new Error('Access denied (HTTP '+r.status+'): Apps Script deployed without \"Anyone\" access. Re-deploy: Web app → Who has access = Anyone.');\n    throw new Error('HTTP '+r.status+' from Apps Script');\n  }\n  const text=await r.text();\n  if(!text)throw new Error('Empty response from Apps Script');\n  if(text.trim().startsWith('<'))throw new Error('Got HTML — Apps Script returned a login/error page. Re-deploy: Who has access = Anyone.');\n  let json;\n  try{json=JSON.parse(text)}catch(e){throw new Error('Invalid JSON response: '+text.substring(0,120))}\n  if(!json.ok)throw new Error(json.error||'Apps Script returned ok=false');\n  const records=Array.isArray(json.records)?json.records:[];\n  if(!records.length)throw new Error('No records — check SHEET_NAME constant in Apps Script, or that the sheet has data rows.');\n  return records;\n}\n\n/* CSV fetch — for Google Sheets share/publish URLs */\nasync function fetchCsv(csvUrl){\n  let r;\n  try{r=await fetch(csvUrl,{cache:'no-store',redirect:'follow'})}\n  catch(netErr){\n    throw new Error('Network error: '+(netErr.message||'fetch blocked')+' — possible CORS/file:// block or sheet still private.');\n  }\n  if(!r.ok){\n    if(r.status===401||r.status===403)throw new Error('Access denied (HTTP '+r.status+'): sheet is private. Set \"Anyone with the link\" in Share.');\n    throw new Error('HTTP '+r.status);\n  }\n  const csv=await r.text();\n  if(!csv||csv.length<10)throw new Error('Empty response from sheet');\n  if(csv.trim().startsWith('<'))throw new Error('Got HTML instead of CSV — sheet requires sign-in. Set sharing to \"Anyone with the link\".');\n  const parsed=Papa.parse(csv,{header:true,skipEmptyLines:true});\n  if(parsed.errors.length&&!parsed.data.length)throw new Error('CSV parse failed');\n  const cases=rowsToCases(parsed.data,parsed.meta.fields||[]);\n  if(!cases.length)throw new Error('No valid rows — column headers do not match Master Database fields (Receipt Date, Case Category, …)');\n  return cases;\n}\n\n/* Diagnostic panel — auto-fills when a connection fails */\nfunction showDiag(url,error){\n  const csv=toCsvUrl(url)||'';\n  document.getElementById('dDetected').textContent=url||'—';\n  document.getElementById('dFetch').textContent=csv||'—';\n  document.getElementById('dErr').textContent=error||'—';\n  const link=document.getElementById('dManual');\n  if(csv){link.href=csv;link.style.pointerEvents='auto';link.style.opacity='1'}\n  else{link.removeAttribute('href');link.style.pointerEvents='none';link.style.opacity='.5'}\n  let hint='';\n  const proto=location.protocol;\n  if(proto==='file:'){\n    hint='<b>⚠ Likely cause:<\/b> Dashboard opened as a local file (<code>file://<\/code>). Some browsers block <code>fetch()<\/code> from <code>file://<\/code> origins. <b>Fix:<\/b> click the 🔗 link above — if it loads CSV in the new tab, your sheet is fine. Then either (a) open the dashboard from a local web server (e.g. <code>python -m http.server<\/code> in the project folder, then visit <code>http://localhost:8000/dashboard.html<\/code>), or (b) upload the HTML somewhere with <code>http(s)://<\/code>.';\n  }else if(/HTML/i.test(error)){\n    hint='<b>⚠ Sheet requires sign-in.<\/b> Open Share → <b>General access<\/b> → change \"Restricted\" to <b>Anyone with the link<\/b> (Viewer).';\n  }else if(/401|403|denied|private/i.test(error)){\n    hint='<b>⚠ Sheet is private.<\/b> Open Share → General access → <b>Anyone with the link<\/b> → Viewer. Then click Save & Sync again.';\n  }else if(/Network|fetch|CORS|TypeError/i.test(error)){\n    hint='<b>⚠ Network blocked.<\/b> Click 🔗 above to verify the sheet URL opens in your browser. If it opens fine but dashboard fails → likely CORS or browser extension. Try a different browser or disable ad-blockers. If on <code>file://<\/code>, serve via local web server.';\n  }else if(/column headers|valid rows/i.test(error)){\n    hint='<b>⚠ Column mismatch.<\/b> Make sure your sheet\\'s tab has these headers: <code>Case Number<\/code>, <code>Receipt Date<\/code>, <code>Gender of Patient<\/code>, <code>Concerned Facility<\/code>, <code>Case Category<\/code>, etc. Or specify the correct tab via <code>#gid=NUMBER<\/code> at the end of the URL.';\n  }else{\n    hint='<b>Tip:<\/b> Click 🔗 above to verify the sheet URL opens correctly in a new browser tab.';\n  }\n  document.getElementById('dHint').innerHTML=hint;\n  document.getElementById('diag').style.display='block';\n}\nfunction hideDiag(){document.getElementById('diag').style.display='none'}\n\nasync function syncSheet(silent){\n  const cfg=getCfg();\n  if(!cfg.url){if(!silent)openCfg();return}\n  setStat('syn','Syncing...');\n  setSrcBnr('syn','Syncing from Google Sheets…','');\n  try{\n    const cases=await fetchSheet(cfg.url);\n    R_LIVE=cases;cacheData(cases);\n    LAST_SYNC=Date.now();\n    setCfg({...cfg,lastSync:LAST_SYNC,count:cases.length});\n    // Refresh date window in footer\n    const dates=cases.map(c=>c.d).sort();\n    const fmt=d=>{const[y,m]=d.split('-');return MONTH_NAMES[+m-1]+' '+y};\n    if(dates.length)document.getElementById('dataWin').textContent=fmt(dates[0])+' — '+fmt(dates[dates.length-1]);\n    // Auto-expand date range to cover all data (so newly added months/years show) —\n    // but ONLY if the user hasn't pinned their own window, so a background sync never\n    // snaps them out of their time filter.\n    if(!userSetRange)applyDataDateRange();\n    // Rebuild filter options from fresh data\n    buildFilterOpts();\n    populateTabFilters();\n    // Re-apply current filter (date range + filters)\n    aD();\n    fetchFollowups();// làm tươi follow-up từ Sheet (gộp bản mới hơn từ máy khác)\n    setStat('',`Synced ${fmtTime()} · ${cases.length} records`);\n    setSrcBnr('ok',`Connected to Google Sheets · last sync ${fmtTime()}`,`${cases.length} records`);\n  }catch(e){\n    setStat('err','Sync failed: '+e.message);\n    setSrcBnr('err','Sync failed — '+e.message,'using last data');\n    if(!silent)alert('Sync failed: '+e.message+'\\n\\nCheck that the sheet is published as CSV and the URL is correct.');\n  }\n}\n\nfunction startAutoSync(){\n  if(SYNC_TIMER)clearInterval(SYNC_TIMER);\n  SYNC_TIMER=setInterval(()=>syncSheet(true),AUTO_SEC*1000);\n}\n\nfunction openCfg(){\n  const c=getCfg();\n  const inp=document.getElementById('cfgUrl');\n  inp.value=c.url||'';\n  const fuInp=document.getElementById('cfgFollowupUrl');if(fuInp)fuInp.value=c.followupUrl||'';\n  const s=document.getElementById('cfgStat');\n  if(c.url&&c.lastSync){s.textContent=`✓ Connected · last sync ${timeAgo(c.lastSync)} · ${c.count||'?'} records`;s.className='stat ok'}\n  else{s.textContent='💡 Paste a Google Sheets URL — dashboard auto-connects. Press Enter or click Save & Sync to apply.';s.className='stat'}\n  hideDiag();\n  document.getElementById('cfgOvly').classList.add('sh');\n  setTimeout(()=>{inp.focus();inp.select()},80);\n}\nfunction closeCfg(){document.getElementById('cfgOvly').classList.remove('sh')}\n/* Clear error state as user types so stale warnings don't persist */\nfunction onUrlInput(){\n  const s=document.getElementById('cfgStat');\n  if(s.classList.contains('bad')){s.className='stat';s.textContent='💡 Press Enter or click Save & Sync to apply.'}\n}\n/* Auto-connect on paste of a valid Google Sheets URL — no extra click needed */\nfunction onUrlPaste(e){\n  setTimeout(()=>{\n    const url=document.getElementById('cfgUrl').value.trim();\n    if(url&&/^https:\\/\\/(docs\\.google\\.com\\/spreadsheets|script\\.google\\.com\\/macros)\\//.test(url))saveCfg();\n  },30);\n}\n\nasync function saveCfg(){\n  const url=document.getElementById('cfgUrl').value.trim();\n  const fuUrl=(document.getElementById('cfgFollowupUrl')||{}).value;\n  const followupUrl=(fuUrl||'').trim();\n  const s=document.getElementById('cfgStat');\n  if(!url){s.textContent='⚠ Please paste a URL.';s.className='stat bad';return}\n  if(!/^https:\\/\\/(docs\\.google\\.com\\/spreadsheets|script\\.google\\.com\\/macros)\\//.test(url)){\n    s.textContent='⚠ URL must be a Google Sheets share link or Apps Script Web App URL.';s.className='stat bad';return;\n  }\n  hideDiag();\n  setCfg({url,followupUrl});\n  s.textContent='Connecting...';s.className='stat';\n  try{\n    const cases=await fetchSheet(url);\n    R_LIVE=cases;cacheData(cases);LAST_SYNC=Date.now();\n    setCfg({url,followupUrl,lastSync:LAST_SYNC,count:cases.length});\n    s.textContent=`✓ Connected · ${cases.length} records loaded.`;s.className='stat ok';\n    userSetRange=false;// fresh connection → show the new sheet's full range\n    applyDataDateRange();\n    buildFilterOpts();\n    aD();\n    fetchFollowups();// nạp follow-up đã lưu trên Sheet (nếu có Follow-up URL)\n    setStat('',`Synced ${fmtTime()} · ${cases.length} records`);\n    setSrcBnr('ok',`Connected to Google Sheets · last sync ${fmtTime()}`,`${cases.length} records`);\n    setTimeout(closeCfg,900);\n  }catch(e){\n    s.textContent='✗ '+e.message;s.className='stat bad';\n    showDiag(url,e.message);\n  }\n}\n\nasync function testCfg(){\n  const url=document.getElementById('cfgUrl').value.trim();\n  const s=document.getElementById('cfgStat');\n  if(!url){s.textContent='⚠ Paste a URL first.';s.className='stat bad';return}\n  hideDiag();\n  s.textContent='Testing...';s.className='stat';\n  try{\n    const cases=await fetchSheet(url);\n    s.textContent=`✓ Valid · ${cases.length} records detected. Click Save to apply.`;s.className='stat ok';\n  }catch(e){\n    s.textContent='✗ '+e.message;s.className='stat bad';\n    showDiag(url,e.message);\n  }\n}\n\nfunction disconnectCfg(){\n  localStorage.removeItem(CFG_KEY);\n  R_LIVE=normalizeRecords([...R]);\n  if(SYNC_TIMER){clearInterval(SYNC_TIMER);SYNC_TIMER=null}\n  document.getElementById('cfgUrl').value='';\n  const fuInp=document.getElementById('cfgFollowupUrl');if(fuInp)fuInp.value='';\n  const s=document.getElementById('cfgStat');s.textContent='Disconnected. Using embedded workbook data.';s.className='stat';\n  setStat('off','Connect Sheet');\n  setSrcBnr('disc','Not connected — using embedded workbook data',R.length+' records');\n  applyDataDateRange();\n  FK.forEach(({k})=>F[k].clear());\n  buildFilterOpts();\n  aD();\n}\n\n\n/* ═════════════ UTIL ═════════════ */\nconst MULTI_KEYS=new Set(['cat','sg','pj']);\nconst splitMulti=v=>{\n  const raw=String(v||'').trim();\n  if(!raw)return[];\n  return [...new Set(raw\n    .replace(/[;\\n\\r]+/g, ',')\n    .split(',')\n    .map(x=>normLabel(x.replace(/^\\s*\\d+\\s*[.)-]?\\s*/,'')))\n    .filter(Boolean)\n  )];\n};\n/* Category cells split on ; / newlines ONLY — names contain commas (e.g.\n   \"Respect, dignity, and caring\"), so comma is NOT a delimiter here. Each piece is\n   canonicalised + deduped so look-alikes collapse to one segment across every chart. */\nconst splitCat=v=>[...new Set(String(v||'').split(/[;\\n\\r]+/)\n  .map(x=>canonCat(normLabel(x.replace(/^\\s*\\d+\\s*[.)-]?\\s*/,''))))\n  .filter(Boolean))];\nconst hasMulti=(r,k,v)=>(k==='cat'?splitCat(r[k]):splitMulti(r[k])).includes(v);\nconst valuesForKey=(r,k)=>k==='cat'?splitCat(r[k]):(MULTI_KEYS.has(k)?splitMulti(r[k]):[r[k]||'Unknown']);\nconst cnt=(d,k)=>{const c={};d.forEach(r=>{valuesForKey(r,k).forEach(v=>{c[v]=(c[v]||0)+1})});return c};\nconst cntRecode=(d,getValue)=>{const c={};d.forEach(r=>{const v=getValue(r)||'Unknown';c[v]=(c[v]||0)+1});return c};\nconst topCounts=(data,limit=20)=>Object.fromEntries(se(data).sort((a,b)=>b[1]-a[1]).slice(0,limit));\nconst nonZeroCounts=data=>Object.fromEntries(Object.entries(data||{}).filter(([,v])=>Number(v)>0));\nconst NEW_CAT_VALUES=['Management: Institutional Issues: Patient Journey(Administrative)','Clinical: Saftey: Clinical documentation'];\nconst NEW_FAC_VALUES=['TEMAIKU Maneaba'];\nconst NEW_SG_VALUES=['Laboratory','Kitchen and Catering','Coordination'];\nconst NEW_PJ_VALUES=['Laboratory','Pre-Admission','Treatment on Ward','Patient Transit Facility(Maneaba)'];\nconst NEW_MOD_VALUES=['Offcer outreach'];\nconst padCounts=(data,keys)=>{const out={...data};(keys||[]).forEach(k=>{if(!(k in out))out[k]=0});return out};\nconst se=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);\n/* Grey \"residual\" buckets (Other / Others / Unknown / Not assigned / N/A). pi's otherLast\n   option pushes these to the END of a pie so the grey slice always sits at the bottom of the legend. */\nconst isOtherLabel=s=>/^(others?|unknown|not assigned|not assessed|n\\/?a)$/i.test(String(s||'').trim());\n/* Sort entries by group order, then by value desc within group — used by pi/bStack/bH for consistent grouping */\nconst sortByGroup=(data,groupFn,groupOrder)=>se(data).sort((a,b)=>{\n  if(!groupFn)return b[1]-a[1];\n  const ga=groupFn(a[0]),gb=groupFn(b[0]);\n  if(ga!==gb){\n    const order=groupOrder||[],ia=order.indexOf(ga),ib=order.indexOf(gb);\n    if(ia!==ib)return(ia<0?999:ia)-(ib<0?999:ib);\n    return String(ga).localeCompare(String(gb));\n  }\n  return b[1]-a[1];\n});\nconst mm=d=>d.substring(0,7);\nconst kl=id=>{if(ch[id]){ch[id].destroy();delete ch[id]}};\nconst pc=(n,t)=>t?Math.round(n/t*100):0;\n/* All distinct months in R_LIVE, sorted chronologically */\nconst allMonths=()=>{const s=new Set(R_LIVE.map(r=>mm(r.d)).filter(m=>m&&/^\\d{4}-\\d{2}/.test(m)));return [...s].sort()};\n/* Active months in the currently filtered data (D), in chronological order */\nconst aMo=()=>{const s=new Set(D.map(r=>mm(r.d)));return allMonths().filter(m=>s.has(m))};\nconst hex2rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`};\n/* Light-theme helper: perceived luminance of a #hex. Used to flip chart labels & segment\n   borders to dark on pale fills (the lightest palette shades read as near-white on white cards). */\nconst _lum=h=>{if(typeof h!=='string'||h[0]!=='#'||h.length<7)return 0;const n=parseInt(h.slice(1),16);return(0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255))/255};\nconst isLightCol=h=>_lum(h)>0.62;\n/* Label color sitting ON a colored fill — depends on the FILL, not the card, so theme-independent */\nconst lblOn=c=>isLightCol(c)?'#0f2438':'#fff';\nconst lblShadowOn=c=>isLightCol(c)?'rgba(255,255,255,.9)':'rgba(0,0,0,.85)';\n/* Bar segment border: light mode gives pale fills a navy hairline so they stay visible on the white\n   card; dark mode keeps the fill color (the original look — pale fills already pop on the dark card). */\nconst segBorderOn=c=>(THEME==='light'&&isLightCol(c))?'rgba(15,36,56,.28)':c;\n/* Pie/doughnut slice separator: light → white gaps (navy hairline for near-white slices); dark → dark gaps. */\nconst pieBorderOn=c=>THEME==='light'?(isLightCol(c)?'rgba(15,36,56,.22)':'#ffffff'):TH().slice;\n\n/* Gradient helper for canvas bars — fade floor is lighter in light mode so pale fills don't wash out */\nconst grad=(ctx,c,vert)=>{\n  const a=ctx.canvas.getContext('2d');\n  const g=vert?a.createLinearGradient(0,0,0,360):a.createLinearGradient(0,0,800,0);\n  g.addColorStop(0,hex2rgba(c,.95));\n  g.addColorStop(1,hex2rgba(c,TH().gradFloor));\n  return g;\n};\n\n/* Compute the full date range covered by R_LIVE and write it into dF/dT */\nfunction applyDataDateRange(){\n  const dates=R_LIVE.map(r=>r.d).filter(d=>d&&/^\\d{4}-\\d{2}-\\d{2}/.test(d)).sort();\n  if(!dates.length)return;\n  const first=dates[0];\n  const last=dates[dates.length-1];\n  const[y,m]=last.split('-').map(Number);\n  const eom=new Date(y,m,0);// last day of last month\n  const lastStr=eom.getFullYear()+'-'+String(eom.getMonth()+1).padStart(2,'0')+'-'+String(eom.getDate()).padStart(2,'0');\n  const firstStr=first.substring(0,8)+'01';\n  document.getElementById('dF').value=firstStr;\n  document.getElementById('dT').value=lastStr;\n}\n\n/* ═════════════ FILTER ═════════════ */\nfunction applyFilters(data){\n  return data.filter(r=>{\n    for(const fk of FK){\n      if(!F[fk.k].size)continue;\n      const v=fk.getValue?fk.getValue(r):(r[fk.k]||'');\n      if(fk.multi){if(!valuesForKey(r,fk.k).some(v=>F[fk.k].has(v)))return false;}\n      else if(!F[fk.k].has(v))return false;\n    }\n    if(DRILL){\n      const rv=(k,fb='Unknown')=>r[k]||fb;\n      if(DRILL.g&&rv('g')!==DRILL.g)return false;\n      if(DRILL.age&&rv('age')!==DRILL.age)return false;\n      if(DRILL.rel&&rv('rel')!==DRILL.rel)return false;\n      if(DRILL.io&&rv('io')!==DRILL.io)return false;\n      if(DRILL.mod&&rv('mod')!==DRILL.mod)return false;\n      if(DRILL.cat&&!hasMulti(r,'cat',DRILL.cat))return false;\n      if(DRILL.catDomain&&!splitCat(r.cat).some(v=>v.toLowerCase().startsWith(DRILL.catDomain.toLowerCase())))return false;\n      if(DRILL.facOverview&&recodeFacilityOverview(r.fac)!==DRILL.facOverview)return false;\n      if(DRILL.fac&&r.fac!==DRILL.fac)return false;\n      if(DRILL.sg&&!hasMulti(r,'sg',DRILL.sg))return false;\n      if(DRILL.pj&&!hasMulti(r,'pj',DRILL.pj))return false;\n      if(DRILL.typ&&rv('typ')!==DRILL.typ)return false;\n      if(DRILL.followupRequested&&rv('followupRequested')!==DRILL.followupRequested)return false;\n      // Drill from the Feedback Type Breakdown pie — uses the SAME Complaint /\n      // Compliment / Other classification as the pie (typ + cat regex), so the\n      // case register matches the clicked slice exactly.\n      if(DRILL.feedbackType&&feedbackType(r)!==DRILL.feedbackType)return false;\n      if(DRILL.month&&mm(r.d)!==DRILL.month)return false;\n    }\n    return true;\n  });\n}\n/* Chia tập dữ liệu: DALL = MỌI loại (cho KPI + pie loại phản hồi ở header);\n   D = chỉ Complaint → toàn bộ biểu đồ/tab phân tích chỉ chạy trên nhóm complaint. */\nconst caseIdSortKey=r=>{const n=Number(r&&r.caseId);return Number.isFinite(n)?n:null;};\nconst byCaseIdDesc=(a,b)=>{\n  const an=caseIdSortKey(a),bn=caseIdSortKey(b);\n  if(an!=null&&bn!=null&&an!==bn)return bn-an;\n  if(an!=null&&bn==null)return -1;\n  if(an==null&&bn!=null)return 1;\n  const dd=String(b&&b.d||'').localeCompare(String(a&&a.d||''));\n  return dd||((Number(b&&b.n)||0)-(Number(a&&a.n)||0));\n};\nconst sortByCaseIdDesc=rows=>rows.slice().sort(byCaseIdDesc);\nfunction setData(rows){DALL=sortByCaseIdDesc(applyFilters(rows));D=DALL.filter(isComplaint)}\n\n/* ═════════════ DRILL-DOWN ═════════════ */\nconst DRILL_LBL={g:'Gender',age:'Age',rel:'Relationship',io:'In/Outpatient',mod:'Initial Feedback Modality',cat:'Category',catDomain:'Domain',facOverview:'Facility Group',fac:'Facility',sg:'Service Group',pj:'Patient Journey',typ:'Feedback Type',followupRequested:'Requested Follow-up',feedbackType:'Feedback Type',month:'Month'};\nfunction drillDown(filters){\n  // Remember which chart tab we came from (if not already viewing the table)\n  if(cv!=='tbl')DRILL_PREV_TAB=cv;\n  DRILL=filters;\n  updateDrillUI();\n  // Recompute D so applyFilters runs with the new DRILL — otherwise rTbl sees\n  // stale data and table doesn't reflect the clicked segment.\n  const a=document.getElementById('dF').value,b=document.getElementById('dT').value;\n  setData(R_LIVE.filter(r=>r.d>=a&&r.d<=b));\n  sw('tbl');  // switch to Case Detail Register tab (rc() re-renders with updated D)\n}\nfunction clearDrill(){\n  DRILL=null;\n  updateDrillUI();\n  const back=DRILL_PREV_TAB||'ov';\n  DRILL_PREV_TAB=null;\n  aD();        // re-filter D now that DRILL is cleared\n  sw(back);    // return to the chart tab the user came from\n}\nfunction updateDrillUI(){\n  const bar=document.getElementById('drillBar');\n  if(!bar)return;\n  if(!DRILL){bar.style.display='none';bar.innerHTML='';return}\n  const chips=[];\n  for(const k in DRILL){\n    if(!DRILL[k])continue;\n    let v=DRILL[k];\n    if(k==='month')v=ML[v]||v;\n    else if(k==='catDomain')v=String(v).replace(/:$/,'');\n    else v=displayValue(v);\n    chips.push(`<span class=\"drill-chip\"><span class=\"drill-k\">${DRILL_LBL[k]||k}<\/span><span class=\"drill-v\">${v}<\/span><\/span>`);\n  }\n  bar.innerHTML=`<span class=\"drill-lbl\">🎯 Drilled into<\/span>${chips.join('')}<button class=\"drill-x\" onclick=\"clearDrill()\">✕ Clear drill-down<\/button>`;\n  bar.style.display='flex';\n}\n/* Find the month key (YYYY-MM) for a chart's display label (e.g. \"Sep 25\") */\nfunction monthKeyFromLabel(label){\n  for(const m of allMonths()){if(monthLabel(m)===label)return m}\n  return null;\n}\n/* Standard onClick / onHover handlers for drill-down charts */\nfunction chartClickFactory(mode,key){\n  /* mode: 'stack' | 'agg' | 'domain' */\n  return (e,elems,chart)=>{\n    if(!elems||!elems.length)return;\n    const el=elems[0];\n    const label=chart.data.labels[el.index];\n    if(mode==='agg'){drillDown({[key]:label});return}\n    const month=monthKeyFromLabel(label);\n    // Prefer rawLabel (un-fixed key) so drill-down filter matches the underlying data values\n    const ds=chart.data.datasets[el.datasetIndex];\n    const dsLabel=ds.rawLabel||ds.label;\n    if(mode==='domain'){drillDown({catDomain:dsLabel+':',month});return}\n    drillDown({[k ort:ageSort},\n    {key:'mod',label:'Modality Distribution',pal:CmodFlow,include:NEW_MOD_VALUES},\n    {key:'rel',label:'Relationship to Patient',pal:CrelFlow},\n    {key:'io',label:'Inpatient/Outpatient',pal:Cio},\n    {key:'followupRequested',label:'Requested Follow-up',sort:followupSort}\n  ],C10);\n}\n\n/* Build {name: color} map from data + a grouped colorFn — keeps tab charts consistent with Overview pies */\nfunction groupColorMap(data,colorFn){\n  const names=se(data).map(e=>e[0]),map={};\n  names.forEach(n=>{map[n]=colorFn(n,names)});\n  return map;\n}\n\n/* Run a renderer with D narrowed by indicator checkboxes: within a column OR, across columns AND.\n   When NO indicator is checked, D is left untouched (mặc định = hiện tất cả).\n   When a column has ALL its values checked, that column's filter is skipped so records with\n   missing/empty data in that column aren't dropped (otherwise \"All\" would lose any record that's\n   incomplete in any of the 10 indicator columns). */\nfunction withIndicatorFilter(fn){\n  const orig=D,origAll=DALL;\n  const hasAny=Object.values(indicatorChecks).some(s=>s.size>0);\n  // Mặc định: KHÔNG chọn indicator nào = hiện TẤT CẢ (bỏ luật \"phải chọn ít nhất 1\").\n  // Chỉ lọc khi người dùng thực sự tick một giá trị nào đó.\n  if(hasAny){\n    Object.entries(indicatorChecks).forEach(([k,set])=>{\n      if(!set.size)return;\n      const col=INDICATOR_COLS.find(c=>c.k===k);if(!col)return;\n      const allVals=indVals(col);\n      // Skip per-column filter when user has selected every possible value (no narrowing)\n      if(set.size>=allVals.length)return;\n      const getter=col.getValue||(r=>r[k]);\n      const f=r=>col.multi?valuesForKey(r,k).some(v=>set.has(v)):set.has(getter(r));\n      D=D.filter(f);DALL=DALL.filter(f);\n    });\n  }\n  try{fn()}finally{D=orig;DALL=origAll}\n}\n\nfunction rCat(){withIndicatorFilter(()=>{\n  // Exclude Compliment records — this tab focuses on complaints only\n  const origD=D;\n  D=D.filter(r=>String(r.typ||'').toLowerCase()!=='compliment'&&String(r.cat||'').toLowerCase()!=='compliment');\n  try{\n    const data=topCounts(cnt(D,'cat'),20),map=groupColorMap(data,catColor);\n    const gOpt={groupFn:catCategoryGroup,groupOrder:CATEGORY_ORDER};\n    bStack('c_cat_t','cat',map,{...gOpt,htmlLegend:true,legendStyle:'totals',legendLabel:'Category',top:20,labelFn:categoryLeafLabel});\n    bH('c_cat_a',data,map,'cat',{denominator:D.length,labelFn:categoryLeafLabel});\n  }finally{D=origD}\n})}\n\nfunction rFac(){withIndicatorFilter(()=>{\n  const data=padCounts(cnt(D,'fac'),NEW_FAC_VALUES),map=groupColorMap(data,facilityColor);\n  const gOpt={groupFn:facilityGroup,groupOrder:['TCH','Clinic','BH','Others','Other']};\n  bStack('c_fac_t','fac',map,{...gOpt,htmlLegend:true,legendStyle:'totals',legendLabel:'Facility',include:NEW_FAC_VALUES});\n  bH('c_fac_a',data,map,'fac',{});\n})}\n\nfunction rSg(){withIndicatorFilter(()=>{\n  const data=topCounts(cnt(D,'sg'),20);\n  bStack('c_sg_t','sg',CsgFlow,{htmlLegend:true,legendStyle:'totals',legendLabel:'Service group',top:20});\n  bH('c_sg_a',data,CsgFlow,'sg',{denominator:D.length});\n})}\n\nfunction rPj(){withIndicatorFilter(()=>{\n  // Patient journey stages in clinical FLOW order. Data spelling variants (e.g. \"Pre-Examination\",\n  // \"Regstration/ Reception\") are matched by mkey so the monthly chart AND the aggregate charts\n  // order (flowOf), colour (flowColor) and 0-pad all align to the K-PaF flow. Previously the\n  // monthly chart used pjOrder with exact-string match, so those variants fell to the bottom.\n  // PJ_FLOW / flowMk / flowOf are now module-level (shared with the Overview PJ pies).\n  // Aggregate charts (Total + Outpatient + Inpatient) ALL list EVERY journey stage in flow order.\n  // keepZeros shows empty stages; allLabels = every label on ONE line (full-width charts fit it).\n  // The bar's raw label stays the DATA spelling so drill keeps matching.\n  const buildFlow=src=>{const out={...src},have=new Set(Object.keys(src).map(mkey));PJ_FLOW.forEach(s=>{if(!have.has(mkey(s)))out[s]=0;});return out;};\n  const flowColor=src=>{const m={};Object.keys(src).forEach(k=>{const i=flowMk.indexOf(mkey(k));m[k]=CpjFlow[i>=0?PJ_FLOW[i]:k]||CpjFlow[k]||'#7b8a9c';});return m;};  // colour via mkey → CpjFlow\n  const flowOpts={groupFn:flowOf,groupOrder:PJ_FLOW,keepZeros:true,allLabels:true};\n  const dPjA=buildFlow(cnt(D,'pj'));\n  // Monthly Trend uses the SAME flow-padded list as the aggregate charts below, so its legend\n  // shows every stage in the same order (consistent), not just the months' present stages.\n  bStack('c_pj_t','pj',CpjFlow,{data:dPjA,keepZeros:true,groupFn:flowOf,groupOrder:PJ_FLOW,htmlLegend:true,legendStyle:'totals',legendLabel:'Patient journey',colorFn:cpjColor});\n  bH('c_pj_a',dPjA,flowColor(dPjA),'pj',{...flowOpts,denominator:D.length});\n  // Outpatient and Inpatient charts each drop the stages that don't belong on their pathway\n  // (exact PJ_FLOW spellings). buildFlowFor keeps ONLY the allowed stages — present-but-excluded\n  // stages are dropped too, not just the 0-pads — and orders by the trimmed flow list.\n  const IP_ONLY=['Pre-Admission','Admissions','Care on Ward','Treatment on Ward','Discharge(IPD)'];   // hidden from Outpatient\n  const OP_ONLY=['Pre-examination','Consultation/Examination / Initial Assessment','Discharge(OPD)']; // hidden from Inpatient\n  const PJ_FLOW_OP=PJ_FLOW.filter(s=>!IP_ONLY.includes(s));\n  const PJ_FLOW_IP=PJ_FLOW.filter(s=>!OP_ONLY.includes(s));\n  const buildFlowFor=(src,stages)=>{const allow=new Set(stages.map(mkey)),out={};\n    Object.entries(src).forEach(([k,v])=>{if(allow.has(mkey(k)))out[k]=v;});\n    const have=new Set(Object.keys(out).map(mkey));stages.forEach(s=>{if(!have.has(mkey(s)))out[s]=0;});return out;};\n  const Dop=D.filter(r=>String(r.io||'').toLowerCase()==='outpatient');\n  const Dip=D.filter(r=>String(r.io||'').toLowerCase()==='inpatient');\n  const dPjOp=buildFlowFor(cnt(Dop,'pj'),PJ_FLOW_OP);\n  bH('c_pj_a_op',dPjOp,flowColor(dPjOp),'pj',{...flowOpts,groupOrder:PJ_FLOW_OP,extraDrill:{io:'Outpatient'},denominator:Dop.length});\n  const dPjIp=buildFlowFor(cnt(Dip,'pj'),PJ_FLOW_IP);\n  bH('c_pj_a_ip',dPjIp,flowColor(dPjIp),'pj',{...flowOpts,groupOrder:PJ_FLOW_IP,extraDrill:{io:'Inpatient'},denominator:Dip.length});\n})}\n\n\nfunction rTbl(){withIndicatorFilter(()=>{\n  const tb=document.getElementById('tb');if(!tb)return;\n  // Show cases when ANY filter is active: a typed Patient ID OR an indicator chip (Case status, etc.).\n  // DALL here is already narrowed by the From-To date range + selected chips (via withIndicatorFilter).\n  const hit=document.getElementById('pidHit');\n  updateFuProgress();\n  const indActive=Object.values(indicatorChecks).some(s=>s.size>0);\n  if(!pidFilter&&!indActive){\n    if(hit)hit.textContent='';\n    tb.innerHTML='<tr><td colspan=\"16\" class=\"nodata\">🔎 Type a Patient ID above, or pick a filter (e.g. Case status), to show cases<\/td><\/tr>';\n    return;\n  }\n  // ALL statuses are included (Pending AND Case Closed) so a case is always findable.\n  let rows=pidFilter?DALL.filter(r=>String(r.patientId||'').toLowerCase().includes(pidFilter)):DALL;\n  if(hit)hit.textContent=`${rows.length} found`;\n  if(!rows.length){\n    tb.innerHTML='<tr><td colspan=\"16\" class=\"nodata\">No matching cases — check the From–To dates, the indicator filters, or the Patient ID.<\/td><\/tr>';return;\n  }\n  const stb=s=>({'Case Closed':'bgn','Pending at K-PaF':'br','Pending at MHMS':'by'}[s]||'bgr');\n  const dv=v=>displayValue(v||'');\n  const opt=(v,sel)=>`<option value=\"${escAttr(v)}\"${sel===v?' selected':''}>${escAttr(v)}<\/option>`;\n  // Giá trị follow-up lấy TỪ record đã sync (Sheet), KHÔNG từ localStorage → tránh dữ liệu cũ khi số case bị tái dùng.\n  tb.innerHTML=rows.map(r=>{\n    const fuS=String(r.statusAfter||'').trim();      // 24. Case status after follow-up (từ Sheet)\n    const fuE=String(r.followupEndDate||'').trim();  // 25. Follow-up end date (từ Sheet)\n    const fuN=String(r.followupNotes||'').trim();    // 26. Follow-up notes (từ Sheet)\n    const dc=fuS?'saved':'';                          // có dữ liệu Sheet = đã làm → chấm xanh\n    const locked=!!fuS;                               // đã follow-up = KHÓA (mỗi ca độc lập)\n    const dis=locked?' disabled':'';                  // ô chỉ-đọc khi đã khóa\n    return `<tr data-cn=\"${escAttr(r.n)}\" data-id=\"${r.caseId!=null?escAttr(r.caseId):''}\"><td data-label=\"#\"><b style=\"color:var(--hl)\">${r.caseId!=null?r.caseId:'?'}<\/b><\/td><td data-label=\"Patient ID\">${escAttr(r.patientId||'')}<\/td><td data-label=\"Date\">${r.d}<\/td><td data-label=\"Gender\">${dv(r.g)}<\/td><td data-label=\"Age\">${dv(r.age)}<\/td><td data-label=\"Facility\">${dv(r.fac)}<\/td><td data-label=\"Category\">${dv(r.cat)||(isCompliment(r)?'Compliment':'')}<\/td><td data-label=\"Service\">${dv(r.sg)}<\/td><td data-label=\"Journey\">${dv(r.pj)}<\/td><td data-label=\"Status\">${r.st?`<span class=\"bg ${stb(r.st)}\">${r.st}<\/span>`:''}<\/td><td data-label=\"Request\">${dv(r.followupRequested)}<\/td>`\n      +`<td data-label=\"Status after follow-up\"><select class=\"fu-sel\" onchange=\"onFollowupEdit(this)\"${dis}><option value=\"\"><\/option>${opt('Case closed',fuS)}${opt('Other',fuS)}<\/select><\/td>`\n      +`<td data-label=\"Follow-up end date\"><input type=\"date\" class=\"fu-date\" value=\"${escAttr(fuE)}\" onchange=\"onFollowupEdit(this)\"${dis}><\/td>`\n      +`<td class=\"fu-notetd\" data-label=\"Follow-up notes\"><input type=\"text\" class=\"fu-note\" value=\"${escAttr(fuN)}\" placeholder=\"Notes…\" onchange=\"onFollowupEdit(this)\"${dis}><\/td>`\n      +`<td class=\"fu-act\" data-label=\"Submit\"><button class=\"fu-submit${locked?' fu-done':''}\" onclick=\"submitFollowup(this.closest('tr').getAttribute('data-cn'),this)\"${locked?' disabled':''}>${locked?'✓ Submitted':'Submit'}<\/button>${locked?`<button class=\"fu-unlock\" onclick=\"unlockFollowup(this.closest('tr').getAttribute('data-cn'),this)\" title=\"Admin: mở khóa để sửa\">🔓 Unlock<\/button>`:''}<span class=\"fu-sync ${dc}\" title=\"${dc?'Follow-up data already on the Sheet':''}\"><\/span><\/td>`\n      +`<td class=\"fu-act\" data-label=\"Print\"><button class=\"fu-print\" onclick=\"printCase(this.closest('tr').getAttribute('data-cn'),this)\">🖨 Print<\/button><\/td><\/tr>`;\n  }).join('');\n})}\n\n/* ═════════════ RENDER CURRENT ═════════════ */\nfunction rc(){rK();({ov:rOv,cat:rCat,fac:rFac,sg:rSg,pj:rPj,tbl:rTbl})[cv]?.()}\n\n/* ═════════════ INIT ═════════════ */\ndocument.addEventListener('DOMContentLoaded',()=>{\n  try{localStorage.removeItem('kpaf_sheet_cfg_v1')}catch(e){}\n  try{\n    const saved=JSON.parse(localStorage.getItem(CFG_KEY)||'{}');\n    if(saved.url&&/AKfycbx1yAMOVa8EndZbiCATxHGUKeLIF4kQtt11oRX_bhIOUCJvEc41X5IgHc2_pAQMEsNF/.test(saved.url)){\n      localStorage.removeItem(CFG_KEY);\n    }\n  }catch(e){}\n  // Vẽ NGAY: ưu tiên cache lần sync gần nhất, chưa có thì dùng mảng nhúng → không phải chờ ~5s sync.\n  try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(Array.isArray(cached)&&cached.length)R_LIVE=normalizeRecords(cached);}catch(e){}\n  loadFU();// nạp follow-up đã lưu trên máy → bảng hiện ngay, không chờ Sheet\n  applyDataDateRange();\n  buildFilterOpts();\n  populateTabFilters();\n  aD();\n  const cfg=getCfg();\n  const activeUrl=cfg.url||DEFAULT_DATA_URL;\n  if(activeUrl){\n    if(!cfg.url&&DEFAULT_DATA_URL)setCfg({...cfg,url:DEFAULT_DATA_URL});\n    setStat('syn','Syncing…');\n    syncSheet(true);// sync nền: cập nhật bản mới nhất từ Google Sheet\n    startAutoSync();// auto-refresh mỗi 60s\n  }else{\n    setStat('off','Connect Sheet');\n    setSrcBnr('disc','Using embedded snapshot',R.length+' records');\n  }\n  fetchFollowups();// nạp follow-up đã lưu trên Sheet (nếu đã đặt Follow-up URL)\n});\n\n/* Re-render charts on viewport resize so label fonts adapt to mobile/desktop */\nlet _rzTimer=null,_lastMobile=null;\nwindow.addEventListener('resize',()=>{\n  clearTimeout(_rzTimer);\n  _rzTimer=setTimeout(()=>{\n    const m=isMobileVP();\n    if(_lastMobile!==null&&_lastMobile===m)return;// only re-render when crossing breakpoint\n    _lastMobile=m;\n    rc();\n  },200);\n});\n<\/script>\n<\/body>\n<\/html>\n"
};

<script>

const SUPABASE_URL  = "https://xspzasjievdxknjbwyzy.supabase.co";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* Đăng nhập bằng Supabase Auth. Trường "Username" giờ nhận EMAIL. */
async function doLogin(e){

  const btn = e.target && e.target.querySelector('button[type="submit"]');
  if(btn){ btn.disabled=true; btn.dataset.t=btn.textContent; btn.textContent='Signing in…'; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if(error || !data || !data.session){
      er.textContent = 'Incorrect email or password. Please try again.'; er.hidden = false;
      $('liPass').value=''; $('liPass').focus();
    } else {
      sessionStorage.setItem(SK_AUTH, data.user.email || email);
      sessionStorage.setItem(SK_TOKEN, data.session.access_token); // dashboard con đọc để đọc/ghi Supabase
      sessionStorage.setItem(SK_ROLE, (data.user.app_metadata && data.user.app_metadata.role) || '');
      closeLogin(); applyAuthUI();
      showView('analytics');
    }
  }catch(err){
    er.textContent = 'Could not connect to the sign-in server. Please check your network.'; er.hidden = false;
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=btn.dataset.t||'Sign in'; }
  }
  return false;
}

async function logout(){
  try{ await sb.auth.signOut(); }catch(e){}
  sessionStorage.removeItem(SK_AUTH);
  sessionStorage.removeItem(SK_TOKEN);
  sessionStorage.removeItem(SK_ROLE);
  sessionStorage.setItem(SK_VIEW, 'analytics');
  const f = $('frmFu'); f.hidden = true; f.src = 'about:blank'; fuLoaded = false;
  const a = $('frmAna'); a.hidden = true; a.src = 'about:blank'; anaLoaded = false;
  const en = $('frmEntry'); en.hidden = true; en.src = 'about:blank'; entryLoaded = false;
  applyAuthUI();
}

function applyAuthUI(){
  const on = authed();
  $('btnLogin').hidden = on;
  $('navAuth').hidden  = !on;
  $('whoLabel').hidden = !on;
  $('btnLogout').hidden = !on;
  $('welcome').hidden = on;                 // ẩn màn hình chào khi đã đăng nhập
  // viewer = chỉ xem Analytics -> ẩn tab New Entry và Follow-up
  const v = isViewer();
  $('tabEntry').hidden = v;
  $('tabFu').hidden = v;
  if (on) $('whoLabel').textContent = '👤 ' + curUser();
  else { $('frmAna').hidden = true; $('frmEntry').hidden = true; $('frmFu').hidden = true; }
}

function showView(v){
  if (!authed()){ return; }                       // chưa đăng nhập thì giữ màn hình chào
  if (isViewer() && v!=='analytics'){ v='analytics'; }  // viewer chỉ được Analytics
  $('welcome').hidden = true;
  // Load lười từng iframe lần đầu mở
  if (v==='analytics' && !anaLoaded){ $('frmAna').srcdoc = window.KPAF_EMBEDDED_PAGES.dashboard_v9; anaLoaded = true; }
  if (v==='entry' && !entryLoaded){ $('frmEntry').srcdoc = window.KPAF_EMBEDDED_PAGES.form; entryLoaded = true; }
  if (v==='followup' && !fuLoaded){ $('frmFu').srcdoc = window.KPAF_EMBEDDED_PAGES.dashboard_v9b; fuLoaded = true; }
  // Hiện đúng iframe, ẩn hai cái còn lại
  $('frmAna').hidden = (v!=='analytics');
  $('frmEntry').hidden = (v!=='entry');
  $('frmFu').hidden = (v!=='followup');
  // Tô đậm nút tab đang chọn
  $('tabAna').classList.toggle('on', v==='analytics');
  $('tabEntry').classList.toggle('on', v==='entry');
  $('tabFu').classList.toggle('on', v==='followup');
  sessionStorage.setItem(SK_VIEW, v);
}

addEventListener('storage', e => {
  if (e.key === 'kpaf_theme')
    document.documentElement.setAttribute('data-theme', e.newValue==='dark' ? 'dark' : 'light');
});
addEventListener('keydown', e => { if (e.key==='Escape') closeLogin(); });

/* Khi mở lại: hỏi Supabase xem còn phiên đăng nhập không (token chưa hết hạn) */
(async function boot(){
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      sessionStorage.setItem(SK_AUTH, data.session.user.email||'');
      sessionStorage.setItem(SK_TOKEN, data.session.access_token);
      sessionStorage.setItem(SK_ROLE, (data.session.user.app_metadata && data.session.user.app_metadata.role) || '');
    }
  }catch(e){}
  applyAuthUI();
  showView('analytics');
})();
</script>
